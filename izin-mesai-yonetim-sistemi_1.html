<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ACR · İzin ve Mesai Yönetim Sistemi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1B2430; --ink2:#41505F; --ink3:#75828F;
  --canvas:#F1F4F1; --surface:#FFFFFF; --surface2:#F8FAF8;
  --line:#DCE3DF; --line2:#EAEFEB;
  --brand:#2D5F5D; --brand-deep:#193B39; --brand-soft:#E2EDEA;
  --bekle:#9C6B11; --bekle-soft:#FAF0D9; --bekle-line:#E6CE94;
  --onay:#2C7350; --onay-soft:#E1EFE7; --onay-line:#A9CDBA;
  --red:#9E3833; --red-soft:#F8E7E4; --red-line:#E0B3AE;
  --mavi:#2B5580; --mavi-soft:#E4EDF6;
  --mor:#5B4A82; --mor-soft:#EBE7F4;
  --r:8px; --r2:12px;
  --sh:0 1px 2px rgba(27,36,48,.06), 0 4px 14px rgba(27,36,48,.05);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Inter',-apple-system,'Segoe UI',Roboto,sans-serif;
  background:var(--canvas); color:var(--ink);
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:'Archivo','Inter',sans-serif; margin:0; letter-spacing:-.015em; font-weight:600}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums}
button,input,select,textarea{font-family:inherit; font-size:inherit; color:inherit}
a{color:var(--brand)}

/* ---------- kabuk ---------- */
.shell{display:grid; grid-template-columns:236px 1fr; min-height:100vh}
.side{background:var(--brand-deep); color:#D6E3E0; display:flex; flex-direction:column; position:sticky; top:0; height:100vh; overflow-y:auto}
.brand{padding:20px 18px 16px; border-bottom:1px solid rgba(255,255,255,.09)}
.brand .logo{display:flex; align-items:center; gap:9px}
.brand .mark{width:26px;height:26px;border-radius:6px;background:#E4B33F;color:#193B39;display:grid;place-items:center;font-family:'Archivo';font-weight:700;font-size:13px}
.brand .nm{font-family:'Archivo'; font-weight:700; color:#fff; font-size:15px; letter-spacing:-.02em}
.brand .sb{font-size:11px; color:#8FAAA6; margin-top:5px; letter-spacing:.04em; text-transform:uppercase}
.nav{padding:12px 10px; flex:1}
.nav .grp{font-size:10px; letter-spacing:.11em; text-transform:uppercase; color:#7A9793; padding:14px 8px 6px; font-weight:600}
.nav button{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  background:none; border:0; color:#C8D9D6; padding:9px 10px; border-radius:7px;
  cursor:pointer; font-size:13.5px; font-weight:500; margin-bottom:1px;
}
.nav button:hover{background:rgba(255,255,255,.07); color:#fff}
.nav button.on{background:var(--brand); color:#fff}
/* İzinlerim ana iş akışı — menüde daha belirgin dursun */
.nav button.navizin{font-weight:700}
.nav button .ic{width:16px; text-align:center; opacity:.85; font-size:14px}
.nav button .cnt{margin-left:auto; background:#E4B33F; color:#193B39; font-size:11px; font-weight:700; padding:1px 6px; border-radius:9px; font-family:'IBM Plex Mono'}
.side .foot{padding:12px 16px; border-top:1px solid rgba(255,255,255,.09); font-size:11px; color:#7A9793}

.main{min-width:0; display:flex; flex-direction:column}
.oturum{padding:14px 14px 15px; border-bottom:1px solid rgba(255,255,255,.09); display:flex;
  flex-direction:column; gap:7px}
.oturum select{width:100%; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.14);
  color:#EAF1EF; font-size:12.5px; padding:7px 9px; border-radius:8px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='11' height='7' viewBox='0 0 11 7'><path d='M1 1l4.5 4.5L10 1' fill='none' stroke='%23A9C2BD' stroke-width='1.6' stroke-linecap='round'/></svg>");
  background-repeat:no-repeat; background-position:right 9px center; -webkit-appearance:none; appearance:none}
.oturum select:focus{border-color:rgba(255,255,255,.4); box-shadow:none; outline:none}
.oturum select option{background:var(--brand-deep); color:#EAF1EF}
.hesapbtn{display:none}
#aySel{display:none}
.donemyeri{display:none}
.digernav{display:none}
.vbar{background:var(--bekle-soft); border-bottom:1px solid var(--bekle-line); padding:8px 22px; font-size:12.5px; color:var(--bekle); display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.vbar b{color:var(--ink)}
.vbar .btn{margin-left:auto}
.oturum .who{display:flex; align-items:center; gap:9px; min-width:0; margin-bottom:3px}
.av{width:32px;height:32px;border-radius:8px;background:var(--brand-soft);color:var(--brand-deep);display:grid;place-items:center;font-weight:700;font-size:12px;font-family:'Archivo';flex:none}
.who .t1{font-weight:600; font-size:13.5px; line-height:1.25; color:#fff;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.who .t2{font-size:11.5px; color:#9DB6B1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.page{padding:22px; flex:1; max-width:1400px; width:100%}

/* ---------- form öğeleri ---------- */
.fld{display:flex; flex-direction:column; gap:5px}
label.lb{font-size:11px; font-weight:600; color:var(--ink2); letter-spacing:.03em; text-transform:uppercase}
input[type=text],input[type=date],input[type=time],input[type=number],input[type=email],select,textarea{
  border:1px solid var(--line); background:var(--surface); border-radius:var(--r);
  padding:8px 10px; outline:none; width:100%;
}
input:focus,select:focus,textarea:focus{border-color:var(--brand); box-shadow:0 0 0 3px rgba(45,95,93,.13)}
input.tarih{font-family:'IBM Plex Mono',ui-monospace,monospace; letter-spacing:.04em; padding-right:36px}
input.tarih::placeholder{font-family:'Inter',sans-serif; letter-spacing:0; color:var(--ink3); opacity:.6}
input.tarih.hatali{border-color:var(--red-line); background:var(--red-soft)}
.tarihkutu{position:relative; display:block}
.takvimbtn{position:absolute; right:1px; top:1px; bottom:1px; width:32px; display:grid; place-items:center;
  color:var(--ink3); cursor:pointer; border-left:1px solid var(--line2); border-radius:0 7px 7px 0; background:var(--surface)}
.takvimbtn:hover{color:var(--brand); background:var(--surface2)}
.takvimbtn input[type=date]{position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:pointer;
  padding:0; border:0; background:none}
.takvimbtn input[type=date]::-webkit-calendar-picker-indicator{position:absolute; inset:0; width:100%; height:100%;
  margin:0; padding:0; opacity:0; cursor:pointer}
textarea{resize:vertical; min-height:64px}
select{cursor:pointer; appearance:none; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='7'><path d='M1 1l4 4 4-4' fill='none' stroke='%2375828F' stroke-width='1.6'/></svg>"); background-repeat:no-repeat; background-position:right 10px center; padding-right:28px}
.btn{
  border:1px solid var(--line); background:var(--surface); border-radius:var(--r);
  padding:8px 13px; cursor:pointer; font-weight:600; font-size:13px; display:inline-flex;
  align-items:center; gap:7px; white-space:nowrap; transition:.12s;
}
.btn:hover{background:var(--surface2); border-color:#C6D0CB}
.btn.pri{background:var(--brand); border-color:var(--brand); color:#fff}
.btn.pri:hover{background:var(--brand-deep); border-color:var(--brand-deep)}
.btn.ok{background:var(--onay); border-color:var(--onay); color:#fff}
.btn.ok:hover{filter:brightness(.93)}
.btn.no{background:var(--surface); border-color:var(--red-line); color:var(--red)}
.btn.no:hover{background:var(--red-soft)}
.btn.sm{padding:5px 9px; font-size:12px; border-radius:6px}
.btn:disabled{opacity:.45; cursor:not-allowed}

/* ---------- kart / tablo ---------- */
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r2); box-shadow:var(--sh)}
.card .hd{padding:14px 16px; border-bottom:1px solid var(--line2); display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.card .hd h3{font-size:14.5px}
.card .hd .sp{margin-left:auto; display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.card .hd .btn.pri.sm{padding:7px 14px; font-weight:600}
/* --- izin formundaki mini takvim --- */
.ftak{border:1px solid var(--line); border-radius:var(--r2); padding:8px 10px 9px; background:var(--surface2);
  max-width:340px}
.fth{display:flex; align-items:center; gap:6px; margin-bottom:6px}
.fth b{font-family:'Archivo'; font-size:12.5px; min-width:104px; text-align:center}
.fth button{border:1px solid var(--line); background:var(--surface); color:var(--ink2); width:22px; height:22px;
  border-radius:6px; cursor:pointer; font-size:13px; line-height:1; display:grid; place-items:center; padding:0}
.fth button:hover:not(:disabled){border-color:var(--brand); color:var(--brand)}
.fth button:disabled{opacity:.35; cursor:not-allowed}
.fth .hint{margin-left:auto; font-size:10.5px}
.fth .fkapat{width:20px; height:20px; font-size:14px; border-color:transparent; background:transparent}
.fth .fkapat:hover{border-color:var(--line); color:var(--ink)}
.fgun{display:grid; grid-template-columns:repeat(7,1fr); gap:2px}
.fgb{text-align:center; font-size:9px; color:var(--ink3); font-weight:600; padding-bottom:2px}
.fb{aspect-ratio:1}
.fg{aspect-ratio:1; display:grid; place-items:center; font-size:11px; border-radius:5px; cursor:pointer;
  font-family:'IBM Plex Mono'; background:var(--surface); border:1px solid var(--line2); color:var(--ink)}
.fg:hover{border-color:var(--brand); background:var(--brand-soft)}
.fg.fw{background:#EDF0ED; color:var(--ink3)}
.fg.ft{background:#F6EADF; color:#9C6B11}
.fg.fizin{background:var(--red-soft); color:var(--red); border-color:var(--red-line);
  cursor:not-allowed; text-decoration:line-through}
.fg.fizin:hover{background:var(--red-soft); border-color:var(--red-line)}
.fg.fpas{opacity:.35; cursor:not-allowed}
.fg.fpas:hover{border-color:var(--line2); background:var(--surface)}
.fg.fkural{background:#FFF3D4; color:#8A6A16; border-color:#E7CE86}
.fg.fkural:hover{background:#FDECBE; border-color:#8A6A16}
.fg.fara{background:var(--brand-soft); border-color:var(--brand-soft); color:var(--brand-deep)}
.fg.fuc{background:var(--brand); border-color:var(--brand); color:#fff; font-weight:700}
.fg.fbugun{box-shadow:inset 0 0 0 2px var(--bekle)}
.fleg{display:flex; gap:11px; flex-wrap:wrap; margin-top:7px; font-size:10.5px; color:var(--ink3)}
.fleg span{display:flex; align-items:center; gap:4px}
.fs{width:10px; height:10px; border-radius:3px; display:inline-block; border:1px solid var(--line)}
.saatserit{display:flex; flex-wrap:wrap; gap:5px; margin-top:7px}
.saatcip{font-family:'IBM Plex Mono'; font-size:12px; padding:5px 9px; border:1px solid var(--line2);
  border-radius:7px; background:var(--surface); color:var(--ink2); cursor:pointer}
.saatcip:hover{border-color:var(--brand); background:var(--brand-soft)}
.saatcip.ara{background:var(--brand-soft); border-color:var(--brand-soft); color:var(--brand-deep)}
.saatcip.uc{background:var(--brand); border-color:var(--brand); color:#fff; font-weight:700}
.fs.fizin{background:var(--red-soft); border-color:var(--red-line)}
.fs.fkural{background:#FFF3D4; border-color:#E7CE86}
.fs.fw{background:#EDF0ED}
.fs.ft{background:#F6EADF}

.aysec{display:flex; gap:4px; flex-wrap:wrap}
.aysec button{border:1px solid var(--line); background:var(--surface); color:var(--ink2);
  font-size:11.5px; font-weight:600; padding:5px 9px; border-radius:7px; cursor:pointer;
  font-family:inherit; letter-spacing:.01em}
.aysec button:hover{border-color:var(--brand); color:var(--brand)}
.aysec button.on{background:var(--brand); border-color:var(--brand); color:#fff}
.aysec button.ayb2{margin-left:6px; border-style:dashed}
/* İzin raporu filtreleri: üç çoklu-seçim menüsü yan yana */
.mselgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
@media(max-width:640px){ .mselgrid{grid-template-columns:1fr} }
/* mesai formundaki tür + tutar kutusu */
.ptbl tr.dip td{border-top:2px solid var(--line); background:var(--surface2); padding-top:11px; padding-bottom:11px}
.ptbl tr.dip b{font-family:'Archivo'; font-size:14px}

/* pencere içi bilgi tablosu */
/* iki alanı her ekranda yan yana tutar */
.ikili{display:grid; grid-template-columns:1fr 1fr; gap:12px; align-items:start}
.ikili .tamsat, .ikili > .hint{grid-column:1 / -1}
.grid > .tamsat{grid-column:1 / -1}
.ikili input[type=time]{width:100%; text-align:center; font-family:'IBM Plex Mono',monospace}

/* tarih seçme düğmesi */
.tarihsec{width:100%; display:flex; align-items:center; justify-content:space-between; gap:8px;
  border:1px solid var(--line); background:var(--surface); color:var(--ink3); cursor:pointer;
  border-radius:var(--r3); padding:11px 13px; font-family:inherit; font-size:14px; text-align:left}
.tarihsec:hover{border-color:var(--brand)}
.tarihsec svg{flex:none; color:var(--ink3)}
.tarihsec.dolu{color:var(--ink); font-weight:600; border-color:var(--brand); background:var(--brand-soft)}
.tarihsec.dolu svg{color:var(--brand)}

/* izin formu özeti — bölmeler anlamına göre renklenir */
.ozet.renkli .o-tarih .v-ad{color:var(--brand-deep); font-family:'IBM Plex Mono',monospace;
  font-size:15px; font-weight:700; letter-spacing:-.02em}
.ozet.renkli .o-gun{background:linear-gradient(180deg,#EFF5F2,#E7F0EC)}
.ozet.renkli .o-gun .v{color:var(--brand-deep)}
.ozet.renkli .o-kalan .v{color:var(--ink)}
.ozet.renkli .o-kalan.eksi{background:var(--red-soft)}
.ozet.renkli .o-kalan.eksi .lb, .ozet.renkli .o-kalan.eksi .s{color:#9C4B4B}
.ozet.renkli .o-kalan.eksi .v{color:var(--red)}
.ozet.renkli .o-onay .v-ad{color:var(--ink)}
.ozet.renkli .o-tarih .s b{color:var(--brand-deep); font-weight:700}
.ozet.renkli .o-onay .v-ad{font-weight:700}
.ikili .tarihkutu input.tarih{text-align:center; padding-left:8px; padding-right:8px}
.ikili .takvimbtn{padding:0 8px}

.dtbl{width:100%; border-collapse:collapse; border:1px solid var(--line); border-radius:var(--r2);
  overflow:hidden; font-size:13.5px}
.dtbl tr + tr{border-top:1px solid var(--line2)}
.dtbl th{width:38%; text-align:left; padding:10px 13px; background:var(--surface2); color:var(--ink2);
  font-weight:500; font-size:12.5px; vertical-align:top}
.dtbl td{padding:10px 13px; vertical-align:top; overflow-wrap:anywhere}
.dtbl tr.vurgu th{background:var(--brand-soft); color:var(--brand-deep); font-weight:600}
.dtbl tr.vurgu td{background:var(--brand-soft); color:var(--brand-deep)}
.dtbl tr.vurgu b{font-family:'Archivo'; font-size:16px}
.dtbl.dokum{border-color:#C7DEEF; overflow:visible}   /* başlık-içi ay menüsü panelinin kırpılmaması için */
.dtbl.dokum th{width:auto; padding:11px 15px; background:linear-gradient(180deg,#F6FAFE,#E9F3FC); color:#215C8C;
  text-align:left; font-size:11px; font-weight:700; letter-spacing:.055em; text-transform:uppercase; border-bottom:1px solid #C7DEEF}
.dtbl.dokum td{padding:12px 15px; font-size:13.5px; border-top:1px solid #EDF3F8; vertical-align:middle}
.dtbl.dokum tbody tr:hover td{background:#F8FBFE}
.dtbl.dokum td .mono{font-size:13px; color:var(--ink); letter-spacing:.01em; white-space:nowrap}
.dtbl.dokum td.doktur{white-space:normal; color:var(--ink); font-size:13px; min-width:120px}
.dtbl.dokum td.doktur .doktur-ad{display:flex; align-items:baseline; gap:8px}
.dtbl.dokum td.doktur .ddot{flex:none; position:relative; top:1px}
.dtbl.dokum td.doktur .doktur-rozet{margin-top:5px; padding-left:17px}
.pill{white-space:nowrap}
.dtbl.dokum td b{color:#215C8C; font-family:'Archivo'; font-size:15px}
.dtbl.dokum th.num, .dtbl.dokum td.num{text-align:right}
.dtbl.dokum td.num .dokgun{display:inline-flex; align-items:center; justify-content:flex-end; gap:7px}
.dtbl.dokum td.num .dokgun .pill{margin:0}
.dtbl.dokum td.num .dokgun b{min-width:22px; text-align:right}
.dtbl.dokum tr.dip td{background:#EEF6FC; border-top:2px solid #9CC4E4; padding-top:12px; padding-bottom:12px}
.dtbl.dokum tr.dip:hover td{background:#EEF6FC}
.coksec.dokumay{margin-top:0; vertical-align:middle}
.coksec.dokumay .cokbtn{width:auto; background:#fff; border-color:#BFD8ED; color:#215C8C; font-weight:600; border-radius:7px}
.coksec.dokumay .cokbtn.dolu{background:#EAF4FC}
.coksec.dokumay .cokpan{left:auto; right:0}
.ddot{display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:9px; vertical-align:middle;
  box-shadow:0 0 0 3px rgba(20,60,90,.06)}
.pill.bekle{background:#FFF3D4; color:#8A6A16; border-color:#EEDBA0}
.pill.kismi{background:#EAF1F6; color:#5A7488; border-color:#D3E1EB}
.pill.dusmez{background:#EEF1F4; color:#8A93A0; border-color:#DEE4EA}
.dokumnot{margin-top:9px; font-size:11.5px; line-height:1.5; padding:8px 11px; background:#F6F8FA;
  border:1px solid var(--line); border-radius:8px; color:var(--ink2)}
/* revize: eski – yeni karşılaştırma tablosu */
/* kadro listesinde başlığın kendisi süzgeç */
.basliksec{width:100%; font-family:'Archivo',sans-serif; font-weight:700; font-size:12px;
  letter-spacing:.05em; text-transform:uppercase; color:var(--ink2);
  background:var(--surface2); border:1px solid var(--line); border-radius:9px;
  padding:9px 26px 9px 11px}
input.basliksec{padding-right:11px; text-transform:none; letter-spacing:0; font-size:13px}
input.basliksec::placeholder{font-family:'Archivo',sans-serif; font-weight:700; font-size:12px;
  letter-spacing:.05em; text-transform:uppercase; color:var(--ink2)}
.basliksec:hover{border-color:var(--brand)}
.basliksec.dolu{background:var(--brand-soft); border-color:var(--brand);
  color:var(--brand-deep); text-transform:none; letter-spacing:0; font-size:13.5px}

/* ücret sütunu: süzgeç + sıralama düğmesi */
.ucretsut{display:flex; gap:6px; align-items:stretch}
.ucretsut .coksec{flex:1; min-width:0}
.ucretsut .basliksec{flex:1; min-width:0}
button.basliksec{display:flex; align-items:center; justify-content:space-between; gap:6px;
  cursor:pointer; text-align:left}
button.basliksec span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
button.basliksec i{font-style:normal; opacity:.6; flex:none}
.coksec .cokpan{min-width:240px}
.sirabtn{flex:none; width:38px; border:1px solid var(--line); background:var(--surface2);
  border-radius:9px; cursor:pointer; font-size:15px; color:var(--ink2); font-family:inherit}
.sirabtn:hover{border-color:var(--brand); color:var(--brand-deep)}
.sirabtn.dolu{background:var(--brand); border-color:var(--brand); color:#fff; font-weight:700}

/* kadro raporunda satır içi açılan detay */
.ptbl tr.detaysatir td{padding:0; background:var(--surface2); border-top:0}
.kadrodetay{padding:12px 14px 14px}
.kadrodetay .ictablo{width:100%; border-collapse:collapse; background:var(--surface);
  border:1px solid var(--line); border-radius:10px; overflow:hidden; font-size:13px}
.kadrodetay .ictablo th{text-align:left; padding:8px 11px; background:var(--surface2);
  color:var(--ink2); font-size:11px; text-transform:uppercase; letter-spacing:.04em; font-weight:700}
.kadrodetay .ictablo td{padding:8px 11px; border-top:1px solid var(--line2)}
.kadrodetay .ictablo th.num, .kadrodetay .ictablo td.num{text-align:right}
.kadrodetay .ictablo tr.ictoplam td{background:var(--surface2); border-top:2px solid var(--line)}
.ptbl tr.acikbas td{background:var(--brand-soft)}
.ptbl td.acikbas{background:var(--brand-soft); color:var(--brand-deep)}

/* kadro raporunda açılabilir satırlar */
.ptbl tr.acilir{cursor:pointer}
.ptbl tr.acilir:hover td{background:var(--brand-soft)}
/* çapraz tabloda tıklanabilir rakamlar */
.ptbl td.acilir{cursor:pointer; font-weight:700; position:relative;
  color:var(--brand-deep); background:var(--brand-soft);
  box-shadow:inset 0 0 0 1px rgba(45,95,93,.22); transition:background .12s, box-shadow .12s}

/* ---------- modal ---------- */
.ov{position:fixed; inset:0; background:rgba(20,30,28,.5); display:none; align-items:flex-start; justify-content:center; z-index:100; padding:28px 16px; overflow:auto; backdrop-filter:blur(2px)}
.ov.on{display:flex}
.modal{background:var(--surface); border-radius:14px; width:100%; max-width:680px; box-shadow:0 24px 60px rgba(20,30,28,.28); animation:up .16s ease;
  display:flex; flex-direction:column; max-height:calc(100vh - 56px)}
.modal.genis{max-width:1060px}
.modal .mb .g5.kartrapor{grid-template-columns:repeat(5,1fr); gap:12px; margin-bottom:4px}

@media(max-width:720px){ .modal .mb .g5.kartrapor{grid-template-columns:1fr 1fr} }
@keyframes up{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.modal .mh{padding:16px 20px; border-bottom:1px solid var(--line2); display:flex; align-items:center; flex:none}
.modal .mh h3{font-size:16px}
.modal .mh .x{margin-left:auto; background:none; border:0; font-size:22px; cursor:pointer; color:var(--ink3); line-height:1; padding:0 4px}
.modal .mb{padding:20px; overflow-y:auto; flex:1 1 auto; min-height:0; overscroll-behavior:contain}
.modal .mf{padding:14px 20px; border-top:1px solid var(--line2); display:flex; gap:9px; justify-content:flex-end; background:var(--surface2); border-radius:0 0 14px 14px; flex:none; flex-wrap:wrap}

.toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:11px 18px; border-radius:9px; font-size:13.5px; font-weight:500; z-index:200; box-shadow:0 10px 30px rgba(0,0,0,.25); opacity:0; pointer-events:none; transition:.2s}
.toast.on{opacity:1; transform:translateX(-50%) translateY(-4px)}

.empty{padding:44px 20px; text-align:center; color:var(--ink3)}
.empty .e1{font-family:'Archivo'; font-weight:600; font-size:15px; color:var(--ink2); margin-bottom:5px}

.tabs{display:flex; gap:2px; border-bottom:1px solid var(--line); margin-bottom:16px; overflow-x:auto}
.tabs button{background:none; border:0; padding:9px 14px; cursor:pointer; font-weight:600; font-size:13px; color:var(--ink3); border-bottom:2px solid transparent; white-space:nowrap}
.tabs button.on{color:var(--brand); border-bottom-color:var(--brand)}

/* personel tablosu: satır tıklanabilir, ilk ve son sütun sabit */

.ptbl tbody tr:hover{background:var(--brand-soft)}
.ptbl th.stl,.ptbl td.stl{position:sticky; left:0; z-index:4; background:var(--surface); box-shadow:1px 0 0 var(--line)}

.ptbl tbody tr:hover td.stl{background:var(--brand-soft)}
.ptbl th.str,.ptbl td.str{position:sticky; right:0; z-index:4; background:var(--surface); box-shadow:-1px 0 0 var(--line); text-align:right}
.ptbl th.str{background:var(--surface2); z-index:8}
.ptbl tbody tr:hover td.str{background:var(--brand-soft)}

tbody tr.dgrup{background:var(--brand-soft); cursor:pointer}
.dtbl th.str,.dtbl td.str{position:sticky; right:0; z-index:3; text-align:right; white-space:nowrap;
  background:var(--surface); box-shadow:-1px 0 0 var(--line)}
.dtbl th.str{background:var(--surface2); z-index:7}
.dtbl tr.dgrup td.str{background:var(--brand-soft)}
.dtbl tbody tr:not(.dgrup):hover td.str{background:var(--surface2)}
.chev{display:inline-block; width:14px; color:var(--brand); font-size:10px}
tbody tr.dgrup:hover{background:#D6E6E2}
tbody tr.dgrup td{border-bottom:1px solid var(--line)}
.pill{display:inline-block; padding:2px 7px; border-radius:5px; font-size:11px; font-weight:600; background:var(--surface2); border:1px solid var(--line); color:var(--ink2)}
.sep{height:1px; background:var(--line2); margin:16px 0}
.row{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.mt{margin-top:14px}

@media(max-width:900px){
  /* ızgara sütunu içeriğe göre genişlemesin */

  .nav{grid-column:1 / -1; display:flex; gap:6px; padding:7px 12px 8px; flex:none;

  /* diğer sayfalar ⚙ panelinde */
  .oturum.acik .digernav{display:grid; grid-template-columns:1fr 1fr; gap:6px; width:100%; margin-top:2px}

    font-weight:700; padding:1px 6px; border-radius:9px}

  /* ---- tablolar kart olur ---- */
  .ptbl thead{display:none}
  .ptbl, .ptbl tbody, .ptbl tr.kart, .ptbl tr.kart td{display:block; width:auto}
  /* açılır detay/hikâye satırı kart modunda: üstteki kartın devamı gibi, etiketsiz */

<script>
/* Yalnızca sayfa gerçekten boş kaldıysa devreye girer.
   Başka kaynaklardan gelen ("Script error.") hatalara dokunmaz. */
(function(){
  function bosMu(){
    var p = document.getElementById('page');
    return p && !p.innerHTML.replace(/\s/g,'');
  }
  function yaz(m, k){
    if(!bosMu()) return;                 /* sayfa doluysa karışma */
    var p = document.getElementById('page');
    p.innerHTML = '<div style="max-width:640px;margin:24px auto;padding:18px;border:1px solid #E8D5D5;'
      + 'border-radius:14px;background:#fff;font-family:-apple-system,sans-serif;color:#1B2A2E">'
      + '<div style="font-size:17px;font-weight:700;margin-bottom:6px">Uygulama açılamadı</div>'
      + '<pre style="margin-top:10px;padding:11px;background:#F6F7F7;border-radius:9px;font-size:12px;'
      + 'white-space:pre-wrap;word-break:break-word">' + String(m) + (k ? '\n' + k : '') + '</pre></div>';
  }
  window.onerror = function(mesaj, dosya, satir){
    /* farklı kaynaktan gelen hatalar satır 0 ve "Script error." olur — bizim değil */
    if(!satir && String(mesaj).indexOf('Script error') === 0) return false;
    yaz(mesaj, 'satır ' + satir);
    return false;
  };
  window.addEventListener('load', function(){
    setTimeout(function(){ if(bosMu()) yaz('Sayfa boş kaldı', ''); }, 2000);
  });
})();
</script>

/* Tanımlı olmayan yıllar için sabit tatilleri üretir; dinî bayramlar elle eklenmelidir */
function tatilListesi(yil){
  const y = String(yil);
  S.ayar.tatiller = S.ayar.tatiller || {};
  if(!S.ayar.tatiller[y]){
    S.ayar.tatiller[y] = SABIT_TATILLER.map(x => ({
      t: y+'-'+String(x.ay).padStart(2,'0')+'-'+String(x.gun).padStart(2,'0'),
      ad: x.ad, yarim: !!x.yarim, oto: true
    }));
  }
  return S.ayar.tatiller[y];
}

function tatilBul(tarih){
  const liste = tatilListesi(tarih.slice(0,4));
  return liste.find(x => x.t === tarih) || null;
}
function calismaGunuMu(tarih){
  const g = d(tarih).getDay();
  if(!S.ayar.calismaGunleri.includes(g)) return false;
  const t = tatilBul(tarih);
  if(t && !t.yarim) return false;
  return true;
}

/* Hafta sonu ve resmî tatiller düşülerek iş günü hesabı. Arife = 0,5 gün. */
/* Bir günün izinden kaç gün düşeceği: hafta tatili ve resmî tatiller 0 */
function gunDegeri(tarih){
  const dt = d(tarih);
  if(!S.ayar.calismaGunleri.includes(dt.getDay())) return 0;   // cumartesi / pazar
  const t = tatilBul(tarih);
  if(!t) return 1;
  if(t.yarim) return S.ayar.arifeYarim ? 0.5 : 0;              // arife
  return 0;                                                     // resmî tatil
}

/* Verilen tarihten sonraki ilk çalışma günü */
function sonrakiIsGunu(tarih){
  if(!tarih) return '';
  let a = d(tarih);
  a.setDate(a.getDate() + 1);
  for(let i = 0; i < 400; i++){
    const t = iso(a);
    if(gunDegeri(t) > 0) return t;
    a.setDate(a.getDate() + 1);
  }
  return '';
}

/* İki tarih arasında kaç gün var (aradaki tatil sayısı için) */
function gunFarki(a, b){
  return Math.round((d(b) - d(a)) / 86400000);
}

function isGunu(bas, bit){
  if(!bas || !bit) return 0;
  let a = d(bas); const b = d(bit);
  if(a > b) return 0;
  let top = 0;
  while(a <= b){ top += gunDegeri(iso(a)); a.setDate(a.getDate()+1); }
  return top;
}

/* Aralığın dökümü: kaç takvim günü, kaç hafta tatili, kaç resmî tatil düşüldü */
function isGunuDokum(bas, bit){
  const r = {takvim:0, isGunu:0, haftaSonu:0, tatil:0, arife:0, tatilAdlari:[]};
  if(!bas || !bit) return r;
  let a = d(bas); const b = d(bit);
  if(a > b) return r;
  while(a <= b){
    const t = iso(a);
    r.takvim++;
    const deger = gunDegeri(t);
    r.isGunu += deger;
    const tat = tatilBul(t);
    if(!S.ayar.calismaGunleri.includes(a.getDay())) r.haftaSonu++;
    else if(tat){
      if(tat.yarim) r.arife++; else r.tatil++;
      r.tatilAdlari.push(tat.ad);
    }
    a.setDate(a.getDate()+1);
  }
  return r;
}

/* Belirli bir tarihte doldurulmuş kıdem yılı */
function kidemYiliTarihte(pid, tarih){
  const p = per(pid); if(!p) return 0;
  const bas = p.izinKidem || p.kidem || p.giris;
  if(!bas) return 0;
  const ref = d(tarih), g = d(bas);
  let y = ref.getFullYear() - g.getFullYear();
  const ay = ref.getMonth() - g.getMonth();
  if(ay < 0 || (ay === 0 && ref.getDate() < g.getDate())) y--;
  return Math.max(0, y);
}
function kidemYili(pid, yil){
  const bugunY = new Date().getFullYear();
  return kidemYiliTarihte(pid, yil === bugunY ? bugun() : iso(new Date(yil, 11, 31)));
}

/* Kıdem tablosundan gün karşılığı; 50 yaş üstü / 18 yaş altı için asgari 20 gün */
function hakEdisKidem(pid, k, tarih){
  const p = per(pid) || {};
  let g = 0;
  for(const r of S.ayar.kidem){ if(k >= r.minYil && k <= r.maxYil) g = r.gun; }
  if(k >= 1 && p.dogum){
    const yas = kidemYiliTarihteYas(p.dogum, tarih);
    if((yas >= 50 || yas < 18) && g < 20) g = 20;
  }
  return g;
}
function kidemYiliTarihteYas(dogum, tarih){
  const ref = d(tarih), g = d(dogum);
  let y = ref.getFullYear() - g.getFullYear();
  const ay = ref.getMonth() - g.getMonth();
  if(ay < 0 || (ay === 0 && ref.getDate() < g.getDate())) y--;
  return y;
}

/* Seçili dönemdeki güncel hak ediş (bilgi amaçlı) */
function hakEdis(pid, yil){
  const bugunY = new Date().getFullYear();
  const t = yil === bugunY ? bugun() : iso(new Date(yil, 11, 31));
  return hakEdisKidem(pid, kidemYiliTarihte(pid, t), t);
}

/* Kıdem yıldönümü: verilen yıldaki tarih */
function yildonumu(pid, yil){
  const p = per(pid); if(!p) return '';
  const bas = p.izinKidem || p.kidem || p.giris;
  if(!bas) return '';
  const g = d(bas);
  const ay = g.getMonth(), gun = g.getDate();
  const son = new Date(yil, ay + 1, 0).getDate();      // 29 Şubat güvenliği
  return iso(new Date(yil, ay, Math.min(gun, son)));
}

/* Bakiye tarihi: girilen devrin geçerli olduğu gün */
function bakiyeTarihi(pid){
  const p = per(pid) || {};
  return p.devirTarihi || S.ayar.varsayilanBakiyeTarihi || bugun();
}

/* (bakiyeTarihi, refTarih] aralığına düşen yıldönümlerinde kazanılan günler */
function hakEdisler(pid, refTarih){
  const p = per(pid); if(!p) return [];
  const bas = p.izinKidem || p.kidem || p.giris;
  if(!bas) return [];
  const bt = bakiyeTarihi(pid);
  const liste = [];
  for(let y = d(bt).getFullYear(); y <= d(refTarih).getFullYear(); y++){
    const t = yildonumu(pid, y);
    if(!t || t <= bt || t > refTarih) continue;
    const k = kidemYiliTarihte(pid, t);
    const gun = hakEdisKidem(pid, k, t);
    if(gun > 0) liste.push({tarih:t, kidem:k, gun});
  }
  return liste;
}

/* Bir sonraki hak ediş: tarih, kıdem ve gün */
function sonrakiHakEdis(pid, refTarih){
  const p = per(pid); if(!p || !(p.kidem || p.giris)) return null;
  const ref = refTarih || bugun();
  for(let y = d(ref).getFullYear(); y <= d(ref).getFullYear() + 2; y++){
    const t = yildonumu(pid, y);
    if(t && t > ref){
      const k = kidemYiliTarihte(pid, t);
      return {tarih:t, kidem:k, gun:hakEdisKidem(pid, k, t)};
    }
  }
  return null;
}

/* Bir tam iş günü kaç saat? (çalışma bitişi − başlangıcı) */
function gunlukCalismaSaati(){
  const dk = t => { const [h,m] = (t||'0:0').split(':').map(Number); return h*60+m; };

/* Saatlik izin sınırları: çalışma başlangıcı – çalışma bitişi */
function calismaBas(){ return S.ayar.isBaslangic || '08:30'; }
function calismaBit(){ return S.ayar.isBitis || '18:00'; }
const SAATLIK_ENAZ = 30;      // dakika

function saatlikSinirlar(sbas, sbit){
  const dk = t => { const [h,m] = (t||'0:0').split(':').map(Number); return h*60+m; };
  if(!sbas || !sbit) return {ok:false, sebep:'eksik'};
  if(dk(sbit) <= dk(sbas)) return {ok:false, sebep:'sira'};
  if(dk(sbit) - dk(sbas) < SAATLIK_ENAZ) return {ok:false, sebep:'kisa'};
  if(dk(sbas) < dk(calismaBas())) return {ok:false, sebep:'erken'};
  if(dk(sbit) > dk(calismaBit())) return {ok:false, sebep:'gec'};
  return {ok:true};
}
/* Çalışma saatleri arasındaki seçenekler (yarım saatlik adım) */
function saatSecenekleri(adim){
  const dk = t => { const [h,m] = (t||'0:0').split(':').map(Number); return h*60+m; };
  const yaz = v => String(Math.floor(v/60)).padStart(2,'0')+':'+String(v%60).padStart(2,'0');
  const b = dk(calismaBas()), s2 = dk(calismaBit()), a = adim || SAATLIK_ENAZ;
  const l = [];
  for(let v = b; v <= s2; v += a) l.push(yaz(v));
  if(l[l.length-1] !== calismaBit()) l.push(calismaBit());
  return l;
}
function saatSecici(id, secili, enErken){
  const dk = t => { const [h,m] = (t||'0:0').split(':').map(Number); return h*60+m; };
  const alt = enErken ? dk(enErken) : -1;
  return '<select id="'+id+'" onchange="izinHesapla()">'
    + saatSecenekleri().filter(t => dk(t) >= alt)
        .map(t => '<option value="'+t+'"'+(t===secili?' selected':'')+'>'+t+'</option>').join('')
    + '</select>';
}

/* Bir iznin yıllık izin hakkından (bakiyeden) düşen gün sayısı.
   - yillikDus türler tümüyle düşer (saatli izinlerde gun=0; saat bazlı ayrıca işlenir).
   - Düşmeyen türlerde (evlilik, doğum günü, babalık, ölüm…) yasal hak (hakGun) aşılırsa
     yalnızca AŞAN kısım düşer; limit içinde kalırsa hiç düşmez. */
function dusenGun(i){
  const t = turBul(i.tur), g = i.gun || 0;
  if(t.yillikDus) return g;
  if(t.hakGun && g > t.hakGun) return +(g - t.hakGun).toFixed(2);
  return 0;
}
/* Aya/aralığa kırpılmış payın bakiyeden düşen kısmı (döküm dip toplamı için) */
function dusenGunPay(i, payGun){
  const tam = i.gun || 0;
  if(!tam) return 0;
  return +(dusenGun(i) * (payGun / tam)).toFixed(2);
}
/* Bir talebin (henüz kaydedilmemiş) bakiyeden düşecek gün sayısı — form önizlemesi için */
function dusenGunTutar(tur, gun){
  const t = turBul(tur), g = gun || 0;
  if(t.yillikDus) return g;
  if(t.hakGun && g > t.hakGun) return +(g - t.hakGun).toFixed(2);
  return 0;
}

/* --- İzin bakiyesi --- */
function bakiye(pid, yil){
  const p = per(pid) || {};
  const bt = bakiyeTarihi(pid);
  const btYil = Number(bt.slice(0,4));
  const devir = Number(p.devir || 0);
  const bugunS = bugun();
  const yilSonuT = iso(new Date(yil, 11, 31));
  const dusenMi = i => turBul(i.tur).yillikDus;
  const sayilir = i => GECERLI.includes(i.durum) || BEKLEYEN.includes(i.durum);

  /* Bakiye tarihinden sonraki, verilen aralıktaki kullanım */
  const kullanimAralik = (basT, bitT) => {
    let t = 0;
    for(const i of S.izin){
      if(i.pid !== pid || !sayilir(i)) continue;
      const dg = dusenGun(i);
      if(!dg) continue;
      if(i.bas < bt || i.bas < basT || i.bas > bitT) continue;
      t += dg;
    }
    return t;
  };
  const kazanimAralik = bitT => hakEdisler(pid, bitT).reduce((a, x) => a + x.gun, 0);

  /* Dönem başı: bakiye tarihinin yılında girilen değer, sonraki yıllarda önceki yıldan devir */
  let donemBasi;
  if(yil <= btYil) donemBasi = devir;
  else {
    const oncekiSon = iso(new Date(yil - 1, 11, 31));
    donemBasi = devir + kazanimAralik(oncekiSon) - kullanimAralik(bt, oncekiSon);
  }

  /* Seçili yılın hareketleri */
  const yilBas = iso(new Date(yil, 0, 1));
  const yilKazanim = hakEdisler(pid, yilSonuT).filter(x => x.tarih >= yilBas);
  const yilSonuEk = yilKazanim.reduce((a, x) => a + x.gun, 0);
  const gerceklesenEk = yilKazanim.filter(x => x.tarih <= bugunS).reduce((a, x) => a + x.gun, 0);

  let kullanilan = 0, planlanan = 0, oncekiKullanim = 0, oncekiAdet = 0;
  for(const i of S.izin){
    if(i.pid !== pid) continue;
    const dg = dusenGun(i);                            // yalnızca bakiyeden düşen kısım
    if(!dg) continue;
    if(i.bas.slice(0,4) !== String(yil)) continue;
    if(i.bas < bt){                                    // dönem başı rakamının içinde sayılır
      if(GECERLI.includes(i.durum)){ oncekiKullanim += dg; oncekiAdet++; }
      continue;
    }
    if(!sayilir(i)) continue;
    if(GECERLI.includes(i.durum)) (i.bit < bugunS) ? kullanilan += dg : planlanan += dg;
    else planlanan += dg;
  }
  /* Saatlik izinler: biriken saatler tam güne ulaştıkça bakiyeden düşer */
  let saatlikSaat = 0, saatlikBekleyen = 0;
  for(const i of S.izin){
    if(i.pid !== pid || !saatliIzin(i)) continue;
    if(i.bas.slice(0,4) !== String(yil)) continue;
    if(GECERLI.includes(i.durum)) saatlikSaat += (i.saat || 0);
    else if(BEKLEYEN.includes(i.durum)) saatlikBekleyen += (i.saat || 0);
  }
  const gunSaat = gunlukCalismaSaati();
  const saatlikToplam = saatlikSaat + saatlikBekleyen;
  const saatlikGun = Math.floor(saatlikToplam / gunSaat);
  const saatlikArtan = +(saatlikToplam - saatlikGun * gunSaat).toFixed(2);

  planlanan += saatlikGun;
  const yilKullanim = kullanilan + planlanan;

  return {
    saatlikSaat, saatlikBekleyen, saatlikToplam, saatlikGun, saatlikArtan, gunSaat,
    devir: donemBasi, girilenDevir: devir, bakiyeTarihi: bt,
    kazanilan: gerceklesenEk, kazanilanlar: yilKazanim,
    toplam: donemBasi + yilSonuEk,
    kullanilan, planlanan, oncekiKullanim, oncekiAdet,
    yilToplamKullanim: yilKullanim + oncekiKullanim,
    kalan: donemBasi + gerceklesenEk - yilKullanim,
    yilSonuEk, yilSonuKazanim: yilKazanim, yilSonuKullanim: yilKullanim,
    yilSonuHak: donemBasi + yilSonuEk,
    yilSonuKalan: donemBasi + yilSonuEk - yilKullanim,
    hak: hakEdis(pid, yil),
    sonraki: sonrakiHakEdis(pid, yil === new Date().getFullYear() ? bugunS : yilSonuT)
  };
}

/* --- Mesai özeti --- */
function mesaiTutar(m){
  const t = mturBul(m.tur);
  return m.karsilik === 'ucret' ? m.sure * t.carpan * saatlikUcret(m.pid) : 0;
}
function mesaiOzet(pid, yil){
  let saat = 0, ucret = 0, izinKarsilik = 0, bekleyen = 0, tutar = 0,
      bekleyenTutar = 0, bekleyenUcret = 0, bekleyenIzin = 0;
  for(const m of S.mesai){
    if(m.pid !== pid || m.tarih.slice(0,4) !== String(yil)) continue;
    const t = mturBul(m.tur);
    if(m.durum === 'yonetici_bekliyor'){
      bekleyen += m.sure;
      if(m.karsilik === 'ucret'){ bekleyenTutar += mesaiTutar(m); bekleyenUcret += m.sure * t.carpan; }
      else bekleyenIzin += m.sure * t.carpan;
      continue;
    }
    if(!GECERLI.includes(m.durum)) continue;
    saat += m.sure;
    if(m.karsilik === 'ucret'){ ucret += m.sure * t.carpan; tutar += mesaiTutar(m); }
    else izinKarsilik += m.sure * t.carpan;
  }
  const toplamSaat = saat + bekleyen;
  return {saat, ucret, izinKarsilik, bekleyen, tutar, bekleyenTutar, bekleyenUcret, bekleyenIzin,
          toplamSaat,
          toplamUcret: ucret + bekleyenUcret,
          toplamIzin: izinKarsilik + bekleyenIzin,
          toplamTutar: tutar + bekleyenTutar,
          kalanKota: S.ayar.yillikMesaiSiniri - toplamSaat};
}

/* --- Yetki --- */
function aktif(){ return per(S.aktifId) || S.personel[0]; }
function ikMi(){ return seviye() === 3; }
/* Doğrudan bağlı olanlar — onay akışı bunu kullanır */
function ekibim(id){ return S.personel.filter(p => p.yonetici === id && p.aktif); }

/* Alt kadronun tamamı: doğrudan bağlılar + onların altındakiler */
function altKadro(id, gezilen){
  gezilen = gezilen || new Set();
  if(gezilen.has(id)) return [];
  gezilen.add(id);
  let liste = [];
  for(const p of S.personel.filter(x => x.yonetici === id && x.aktif)){
    liste.push(p);
    liste = liste.concat(altKadro(p.id, gezilen));
  }
  return liste;
}
function altKadroId(id){ return new Set(altKadro(id).map(p => p.id)); }

/* ---- Görünüm düzeyleri ----
   3 = İK / tam yetki, 2 = üst yönetim, 1 = yönetici, 0 = personel */
const GORUNUMLER = [
  {k:'oto',      ad:'Kişinin kendi yetkisi', sv:null},
  {k:'ik',       ad:'İK / tam yetki',        sv:3},
  {k:'ust',      ad:'Üst yönetim',           sv:2},
  {k:'yonetici', ad:'Yönetici',              sv:1},
  {k:'personel', ad:'Personel',              sv:0}
];
const SEVIYE_AD = {3:'İK / tam yetki', 2:'Üst yönetim', 1:'Yönetici', 0:'Personel'};

/* Kişinin kadro ve rolünden gelen gerçek yetki düzeyi */
function gercekSeviye(id){
  const p = per(id); if(!p) return 0;
  if(p.rol === 'ik') return 3;
  if(p.rol === 'ustyonetim') return 2;
  const alt = altKadro(id).length;
  if(!alt) return 0;
  return alt >= S.personel.filter(x => x.aktif).length - 1 ? 2 : 1;
}

/* Seçili görünümle sınırlanmış etkin düzey — gerçek yetkinin üstüne çıkamaz */
function seviye(){
  const g = gercekSeviye(S.aktifId);
  const sec = GORUNUMLER.find(x => x.k === (S.gorunum || 'oto'));
  return (!sec || sec.sv === null) ? g : Math.min(g, sec.sv);
}
function kisitliMi(){
  const sec = GORUNUMLER.find(x => x.k === (S.gorunum || 'oto'));
  return !!(sec && sec.sv !== null && sec.sv < gercekSeviye(S.aktifId));
}

/* Seçilen düzeyi temsil edebilecek bir kişi bul */
function seviyeTemsilcisi(sv){
  const aday = S.personel.filter(p => p.aktif && gercekSeviye(p.id) === sv);
  if(sv === 1) aday.sort((a,b) => altKadro(b.id).length - altKadro(a.id).length);
  return aday[0] || null;
}

function yoneticiMi(){ return seviye() >= 1; }

/* Kimin kaydını görebilirim */
function gorebilir(pid){
  if(seviye() >= 2) return true;              // İK ve üst yönetim herkesi
  if(pid === S.aktifId) return true;          // herkes kendini
  return seviye() >= 1 && altKadroId(S.aktifId).has(pid);
}

function rolAdi(){
  const p = aktif(); if(!p) return '';
  const sv = seviye();
  if(sv === 3) return 'İK / tam yetki';
  if(sv === 2) return 'Üst yönetim · tüm personel';
  if(sv === 1) return 'Yönetici · ' + altKadro(p.id).length + ' kişilik kadro';
  return 'Personel';
}

/* Bu kullanıcı bu kayda karar verebilir mi? */
function izinKararVerebilir(i){
  if(!i) return false;
  if(!BEKLEYEN.includes(i.durum)) return false;
  return per(i.pid)?.yonetici === S.aktifId || (ikMi() && !per(i.pid)?.yonetici);
}
function mesaiKararVerebilir(m){
  if(!m) return false;
  if(!BEKLEYEN.includes(m.durum)) return false;
  return per(m.pid)?.yonetici === S.aktifId || (ikMi() && !per(m.pid)?.yonetici);
}

/* Onay kuyruğu: bu kullanıcının karar vermesi gereken kayıtlar */
function onayKuyrugu(){
  if(seviye() < 1) return {izinler:[], mesailer:[], toplam:0};
  const izinler = S.izin.filter(izinKararVerebilir);
  const mesailer = S.mesai.filter(mesaiKararVerebilir);
  return {izinler, mesailer, toplam: izinler.length + mesailer.length};
}

/* --- Kişinin kendi izinleriyle tarih çakışması --- */
function kendiCakismasi(pid, bas, bit, haricId){
  if(!bas || !bit) return [];
  return S.izin.filter(i => i.pid === pid && i.id !== haricId
    && (GECERLI.includes(i.durum) || BEKLEYEN.includes(i.durum))
    && !(i.bit < bas || i.bas > bit))
    .sort((a,b) => a.bas.localeCompare(b.bas));
}
function cakismaMetni(liste){
  return liste.map(i => esc(turBul(i.tur).ad)+' · '+trTarih(i.bas)+' – '+trTarih(i.bit)
    + ' · '+sayi(i.gun)+' gün · '+DURUM_AD[i.durum]).join('<br>');
}

/* --- Çakışma kontrolü: aynı ekipten aynı tarihlerde izinli olanlar --- */
function cakisan(pid, bas, bit, hariçId){
  const p = per(pid); if(!p) return [];
  return S.izin.filter(i => i.id !== hariçId && i.pid !== pid
    && (GECERLI.includes(i.durum) || BEKLEYEN.includes(i.durum))
    && per(i.pid) && per(i.pid).dept === p.dept
    && !(d(i.bit) < d(bas) || d(i.bas) > d(bit)));
}

/* Ayarlarda tanımlı değerler ile kayıtlarda fiilen kullanılan değerlerin birleşimi */
/* Liste anahtarının personel kaydındaki alan adı (altdept listesi ↔ p.altDept alanı) */
function listeAlan(k){ return k === 'altdept' ? 'altDept' : k; }

  S.ayar.listeler = S.ayar.listeler || {dept:[], lokasyon:[], unvan:[], altdept:[]};
  const alan = listeAlan(k);
  const set = new Set([...(S.ayar.listeler[k] || []), ...S.personel.map(p => p[alan]).filter(Boolean)]);

function listeEkle(k, v){
  v = (v || '').trim(); if(!v) return;
  S.ayar.listeler = S.ayar.listeler || {dept:[], lokasyon:[], unvan:[], altdept:[]};
  const l = S.ayar.listeler[k] = S.ayar.listeler[k] || [];
  if(!l.some(x => x.toLocaleLowerCase('tr') === v.toLocaleLowerCase('tr'))) l.push(v);
}
function listeKullanim(k, v){ const alan = listeAlan(k); return S.personel.filter(p => p[alan] === v).length; }

/* ===================== ÜCRET ve KAYDIRMA ===================== */

function para(n){ return (Math.round((n||0)*100)/100).toLocaleString('tr-TR',{minimumFractionDigits:2, maximumFractionDigits:2}) + ' ₺'; }

/* Saatlik ücret = aylık ücret / (aylık çalışma günü × günlük çalışma saati) */
/* Aynı gün ve saatlerde başka mesai kaydı var mı? */
function dkAl(t){ const [h,m] = (t||'0:0').split(':').map(Number); return h*60 + m; }
function mesaiCakismasi(pid, tarih, bas, bit, haricId){
  if(!pid || !tarih || !bas || !bit) return [];
  let b1 = dkAl(bas), s1 = dkAl(bit);
  if(s1 <= b1) s1 += 24*60;                        // gece yarısını aşan mesai
  return S.mesai.filter(m => {
    if(m.pid !== pid || m.tarih !== tarih) return false;
    if(haricId && m.id === haricId) return false;
    if(!GECERLI.includes(m.durum) && !BEKLEYEN.includes(m.durum)) return false;
    let b2 = dkAl(m.bas), s2 = dkAl(m.bit);
    if(s2 <= b2) s2 += 24*60;
    return b1 < s2 && b2 < s1;
  });
}
function mesaiCakismaMetni(liste){
  return liste.map(m => trTarih(m.tarih)+' · '+m.bas+' – '+m.bit+' · '+sayi(m.sure)+' saat ('+DURUM_AD[m.durum]+')').join('<br>');
}

/* İki saat arasındaki süre (gece yarısını aşabilir) */
function saatFark(b, s){
  if(!b || !s) return 0;
  const [bh,bm] = b.split(':').map(Number), [sh,sm] = s.split(':').map(Number);
  let dk = (sh*60+sm) - (bh*60+bm);
  if(dk < 0) dk += 24*60;
  return Math.round(dk/60*100)/100;
}

/* --- Ücret --- */
/* Ücret kartta aylık ya da günlük (yevmiye) girilebilir. Kartta girilen tutar p.ucret,
   hangi birimde girildiği p.ucretTipi alanında durur. Raporlar aylık karşılık üzerinden
   çalıştığı için okurken aylikUcret() kullanılır. */
const UCRET_TIPLERI = [['aylik','Aylık ücret'],['gunluk','Günlük ücret (yevmiye)']];
function ucretTipi(p){ return (p && p.ucretTipi === 'gunluk') ? 'gunluk' : 'aylik'; }
function ucretTipiAd(p){ return ucretTipi(p) === 'gunluk' ? 'Günlük' : 'Aylık'; }
function ayGun(p){ return Number(p && p.aylikGun) || 30; }
/* pid ya da personel nesnesi (kaydedilmemiş kart taslağı da olabilir) alır */
function ucretKisi(pVeyaId){ return typeof pVeyaId === 'string' ? per(pVeyaId) : pVeyaId; }

function aylikUcret(pVeyaId){
  const p = ucretKisi(pVeyaId); if(!p || !p.ucret) return 0;
  return ucretTipi(p) === 'gunluk' ? p.ucret * ayGun(p) : p.ucret;
}
function gunlukUcret(pVeyaId){
  const p = ucretKisi(pVeyaId); if(!p || !p.ucret) return 0;
  return ucretTipi(p) === 'gunluk' ? p.ucret : p.ucret / ayGun(p);
}
function saatlikUcret(pVeyaId){
  const saat = Number(S.ayar.gunlukSaat) || 7.5;
  return saat > 0 ? gunlukUcret(pVeyaId) / saat : 0;
}

/* Geniş tabloların üstüne ikinci bir yatay kaydırma çubuğu koyar */
function ustKaydirmaBagla(){

  });
}
function ustCubuk(){ return '<div class="tw-top"><div></div></div>'; }

/* T.C. kimlik numarası algoritma kontrolü */
function tcGecerli(tc){
  tc = String(tc || '').trim();
  if(!/^[1-9][0-9]{10}$/.test(tc)) return false;
  const r = tc.split('').map(Number);
  const tek = r[0]+r[2]+r[4]+r[6]+r[8];
  const cift = r[1]+r[3]+r[5]+r[7];
  if(((tek*7 - cift) % 10 + 10) % 10 !== r[9]) return false;
  if(r.slice(0,10).reduce((a,b)=>a+b,0) % 10 !== r[10]) return false;
  return true;
}
function tcSahibi(tc, haricId){
  return S.personel.find(p => p.id !== haricId && p.tcno && p.tcno === String(tc).trim()) || null;
}

/* Tutar alanı: yazarken binlik ayracı koyar, imleci yerinde tutar */
function paraCoz(v){ return Number(String(v==null?'':v).replace(/\./g,'').replace(',','.')) || 0; }
function paraYaz(n){
  n = Number(n) || 0;
  return n.toLocaleString('tr-TR', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function tutarGir(el, sonra){
  const sagdaKalan = el.value.length - (el.selectionStart || 0);
  let v = el.value.replace(/[^0-9,]/g, '');
  const par = v.split(',');
  let tam = (par[0] || '').replace(/^0+(?=\d)/, '').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  el.value = tam + (par.length > 1 ? ',' + par[1].slice(0,2) : '');
  const imlec = Math.max(0, el.value.length - sagdaKalan);
  try{ el.setSelectionRange(imlec, imlec); }catch(e){}
  if(sonra) sonra();
}

/* ===================== UNVAN – DEPARTMAN BAĞI ===================== */

/* Boş bağ = unvan tüm departmanlarda kullanılabilir */
function unvanDepti(u){ return (S.ayar.unvanDept || {})[u] || ''; }

function unvanListesi(dept){
  const hepsi = listeAl('unvan');
  if(!dept) return hepsi;
  return hepsi.filter(u => !unvanDepti(u) || unvanDepti(u) === dept);
}
/* Mevcut kayıtlardan bağları türetir; yalnızca tanımsız olanları doldurur */
function unvanBaglariniKur(){
  S.ayar.unvanDept = S.ayar.unvanDept || {};
  const m = {};
  for(const p of S.personel){
    if(!p.unvan || !p.dept) continue;
    (m[p.unvan] = m[p.unvan] || new Set()).add(p.dept);
  }
  let n = 0;
  for(const u of Object.keys(m)){
    if(S.ayar.unvanDept[u] === undefined && m[u].size === 1){ S.ayar.unvanDept[u] = [...m[u]][0]; n++; }
  }
  return n;
}

/* Departman adı değişince ya da silinince unvan bağları da taşınır */
function unvanBagiTasi(eski, yeni){
  const m = S.ayar.unvanDept || {};
  for(const u of Object.keys(m)) if(m[u] === eski) m[u] = yeni;
}

/* ===================== ALT DEPARTMAN – DEPARTMAN BAĞI =====================
   Alt departman, ünvanla aynı kurguda bir departmana bağlıdır: personel kartında
   yalnızca kişinin departmanına ait alt departmanlar listelenir. */
function altDeptDepti(a){ return (S.ayar.altDeptDept || {})[a] || ''; }
function altDeptListesi(dept){
  const hepsi = listeAl('altdept');
  if(!dept) return hepsi;
  return hepsi.filter(a => !altDeptDepti(a) || altDeptDepti(a) === dept);
}
/* Departman adı değişince/silinince alt departman bağları da taşınır (migrasyon kancaları bunu çağırır) */
function altBagiTasi(eski, yeni){
  const m = S.ayar.altDeptDept || {};
  for(const a of Object.keys(m)) if(m[a] === eski) m[a] = yeni;
}

/* Departmana bağlı listeler (unvan, alt departman) için ortak yardımcılar */
function bagliListe(k){ return k === 'unvan' || k === 'altdept'; }
function bagMap(k){
  if(k === 'altdept') return (S.ayar.altDeptDept = S.ayar.altDeptDept || {});
  return (S.ayar.unvanDept = S.ayar.unvanDept || {});
}
function bagDepti(k, v){ return bagMap(k)[v] || ''; }

/* ===================== ÖZEL KURALLAR (GRUPLAR) ===================== */

function gruplar(){ return S.ayar.gruplar || (S.ayar.gruplar = []); }
function grupBul(id){ return gruplar().find(g => g.id === id) || null; }

/* Kuralın kapsadığı kişiler — kapsam türüne göre dinamik.
   kisiler: elle seçilen üyeler · dept/altdept/lokasyon: o gruptaki aktif personel · sirket: tüm aktif personel */
function grupUyeleri(g){
  if(g.kapsam === 'dept')     return S.personel.filter(p => p.aktif && p.dept === g.kapsamDeger).map(p => p.id);
  if(g.kapsam === 'altdept')  return S.personel.filter(p => p.aktif && (p.altDept||'') === g.kapsamDeger).map(p => p.id);
  if(g.kapsam === 'lokasyon') return S.personel.filter(p => p.aktif && (p.lokasyon||'') === g.kapsamDeger).map(p => p.id);
  if(g.kapsam === 'sirket')   return S.personel.filter(p => p.aktif).map(p => p.id);
  return (g.uyeler || []);    // 'kisiler' (varsayılan)
}
function kisiGruplari(pid){ return gruplar().filter(g => grupUyeleri(g).includes(pid)); }

/* Kuralın izin verdiği eşzamanlı izinli sayısı (üst sınır) */
function grupSiniri(g){
  const n = grupUyeleri(g).length;
  if(g.tip === 'maxIzinli') return Math.max(0, Number(g.deger) || 0);
  if(g.tip === 'yuzdeCalisan'){                              // en az %deger işbaşında
    const minCalisan = Math.ceil(n * (Number(g.deger) || 0) / 100);
    return Math.max(0, n - minCalisan);
  }
  return Math.max(0, n - (Number(g.deger) || 0));            // minCalisan
}
function grupKuralMetni(g){
  const n = grupUyeleri(g).length, s = grupSiniri(g);
  if(g.tip === 'maxIzinli')
    return 'Aynı anda en çok ' + g.deger + ' kişi izinli' + (n ? ' · en az ' + (n - s) + ' kişi işbaşında' : '');
  if(g.tip === 'yuzdeCalisan')
    return 'En az %' + g.deger + ' işbaşında' + (n ? ' · en az ' + (n - s) + '/' + n + ' kişi · en çok ' + s + ' izinli' : '');
  return 'En az ' + g.deger + ' kişi işbaşında' + (n ? ' · aynı anda en çok ' + s + ' kişi izinli' : '');
}

function grupKapsamMetni(g){
  if(g.kapsam === 'dept')     return 'Departman: ' + g.kapsamDeger;
  if(g.kapsam === 'altdept')  return 'Alt departman: ' + g.kapsamDeger;
  if(g.kapsam === 'lokasyon') return 'Lokasyon: ' + g.kapsamDeger;
  if(g.kapsam === 'sirket')   return 'Tüm şirket';
  return 'Belirli kişiler';
}

/* Belirli bir günde gruptan izinli olanlar */
function grupIzinliler(g, tarih, haricIzinId, haricPid){
  return grupUyeleri(g).filter(u => u !== haricPid && S.izin.some(i =>
    i.id !== haricIzinId && i.pid === u &&
    (GECERLI.includes(i.durum) || BEKLEYEN.includes(i.durum)) &&
    i.bas <= tarih && i.bit >= tarih));
}

/* Talep kuralı aşıyor mu — gün gün bakar, en yoğun günü döndürür */
function grupIhlali(pid, bas, bit, haricIzinId){
  const sonuc = [];
  if(!bas || !bit) return sonuc;
  for(const g of kisiGruplari(pid)){
    const sinir = grupSiniri(g);
    let enKotu = null, gunSayisi = 0;
    let a = d(bas); const b = d(bit);
    while(a <= b){
      const t = iso(a);
      if(calismaGunuMu(t)){
        const izinli = grupIzinliler(g, t, haricIzinId, pid);
        if(izinli.length + 1 > sinir){
          gunSayisi++;
          if(!enKotu || izinli.length > enKotu.izinli.length) enKotu = {tarih:t, izinli};
        }
      }
      a.setDate(a.getDate() + 1);
    }
    if(enKotu) sonuc.push({grup:g, sinir, tarih:enKotu.tarih, izinli:enKotu.izinli, gunSayisi});
  }
  return sonuc;
}
function grupGerekceGerekli(ihlaller){ return ihlaller.some(x => x.grup.gerekce); }

function grupIhlalMetni(ihlaller){
  return ihlaller.map(x => {
    const kim = x.izinli.map(u => esc(adSoyad(u))).join(', ');
    return '<div style="margin-top:6px"><b>' + esc(x.grup.ad) + '</b>'
      + '<div class="hint">' + esc(grupKuralMetni(x.grup)) + ' · ' + x.gunSayisi + ' iş gününde aşılıyor.'
      + ' En yoğun gün ' + trTarih(x.tarih) + (kim ? ': ' + kim + ' izinli.' : '.') + '</div></div>';
  }).join('');
}
function grupNotMetni(ihlaller){
  return ihlaller.map(x => x.grup.ad + ' · ' + grupKuralMetni(x.grup) + ' · ' + x.gunSayisi + ' iş gününde aşılıyor').join(' | ');
}

/* Belirli bir günde bu kişi izin alırsa özel kural ihlal olur mu — takvimde renklendirme için.
   Döner: null (ihlal yok) ya da {grup, izinli} (en yoğun kuralın bilgisi) */
function gunKuralIhlali(pid, t){
  if(!calismaGunuMu(t)) return null;
  let enKotu = null;
  for(const g of kisiGruplari(pid)){
    const sinir = grupSiniri(g);
    const izinli = grupIzinliler(g, t, null, pid);
    if(izinli.length + 1 > sinir && (!enKotu || izinli.length > enKotu.izinli.length))
      enKotu = {grup:g, izinli};
  }
  return enKotu;
}


/* İzin kaydı, kişinin bakiye tarihinden önce mi? (bakiyeye zaten dahil) */
function izinBakiyeOncesi(i){ return !!i && i.bas < bakiyeTarihi(i.pid); }


/* ===================== TARİH GİRİŞİ (GG.AA.YYYY) ===================== */

function isoToTr(v){
  if(!v || !/^\d{4}-\d{2}-\d{2}$/.test(v)) return '';
  const [y,a,g] = v.split('-');
  return g+'.'+a+'.'+y;
}
function trToIso(v){
  v = String(v || '').trim();
  const m = v.match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})$/);
  if(!m) return '';
  const g = Number(m[1]), a = Number(m[2]), y = Number(m[3]);
  if(a < 1 || a > 12 || g < 1) return '';
  if(g > new Date(y, a, 0).getDate()) return '';
  return y+'-'+String(a).padStart(2,'0')+'-'+String(g).padStart(2,'0');
}

/* Yazarken noktaları kendiliğinden koyar; takvim seçicisini de günceller */
function tarihGir(el, sonra){
  let v = el.value.replace(/[^0-9]/g, '').slice(0,8);
  let out = v.slice(0,2);
  if(v.length > 2) out += '.' + v.slice(2,4);
  if(v.length > 4) out += '.' + v.slice(4,8);
  el.value = out;
  try{ el.setSelectionRange(out.length, out.length); }catch(e){}
  const iso = trToIso(out);
  el.classList.toggle('hatali', out.length === 10 && !iso);
  const dp = document.getElementById(el.id + '_dp');
  if(dp) dp.value = iso || '';
  if(iso && typeof sonra === 'function') sonra();
}

/* Alana girildiğinde içeriği seçer — üzerine yazmak için */
function tarihSecTumu(el){

/* Alandan çıkıldığında eksik girişi işaretler */
function tarihBitti(el){

}

/* Takvimden seçilince metin alanına yazar */
function tarihSec(id, sonra){

  el.value = isoToTr(dp.value);

    + (ozelAcici ? ozelAcici+'(\''+id+'\')' : 'tarihTakvimAc(\''+id+'\')')+'">'
    + '<svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">'

    + '<path d="M1.5 6.5h13M5 1.5v3M11 1.5v3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>'
    + '</svg>'
    + (ozelAcici ? '' :
        '<input type="date" id="'+id+'_dp" tabindex="-1" value="'+esc(iso)+'"'

}
function tarihAl(id){

/* ---- Enter ve ok tuşlarıyla alanlar arası geçiş ---- */

function odakKapsayici(el){
  return (el.closest && (el.closest('.modal') || el.closest('.page') || el.closest('.oturum'))) || document.body;
}
function odaklanabilirler(kap){
  const liste = [];
  for(const el of kap.querySelectorAll('input, select, textarea, button.btn')){
    if(el.disabled || el.type === 'hidden') continue;
    if(el.tabIndex === -1) continue;
    if(el.offsetWidth === 0 && el.offsetHeight === 0) continue;   // gizli
    liste.push(el);
  }
  return liste;
}
function alanGec(el, yon){
  const liste = odaklanabilirler(odakKapsayici(el));
  const ix = liste.indexOf(el);
  if(ix < 0) return false;
  const hedef = liste[ix + yon];
  if(!hedef) return false;
  hedef.focus();
  if(hedef.select) { try{ hedef.select(); }catch(x){} }
  return true;
}

/* İmleç metnin başında / sonunda mı? */
function imlecBasta(el){
  if(el.selectionStart == null) return true;
  return el.selectionStart === 0 && el.selectionEnd === 0;
}
function imlecSonda(el){
  if(el.selectionStart == null) return true;
  return el.selectionStart === el.value.length && el.selectionEnd === el.value.length;
}
function tumuSecili(el){
  return el.selectionStart === 0 && el.selectionEnd === (el.value || '').length && (el.value || '').length > 0;
}

function formTuslari(e){
  const el = e.target;
  if(!el || !el.tagName) return;
  const tag = el.tagName.toLowerCase();
  const tip = (el.type || '').toLowerCase();
  const metinMi = tag === 'input' && ['text','email','tel','password','search','url','number'].includes(tip);

  // Enter: her yerde sonraki alana
  if(e.key === 'Enter'){
    if(tag === 'textarea' || tag === 'button') return;
    if(alanGec(el, 1)) e.preventDefault();
    return;
  }

  if(tag === 'textarea') return;

  // Aşağı / yukarı: alanlar arası
  if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){
    if(tag === 'select') return;                 // listede değer seçer
    if(tip === 'number') return;                 // sayıyı artırır / azaltır
    if(alanGec(el, e.key === 'ArrowDown' ? 1 : -1)) e.preventDefault();
    return;
  }

  // Sağ / sol: imleç uçtaysa alanlar arası, değilse metin içinde gezinir
  if(e.key === 'ArrowRight' || e.key === 'ArrowLeft'){
    if(e.shiftKey) return;                       // seçim yapılıyor
    const ileri = e.key === 'ArrowRight';
    if(metinMi && !tumuSecili(el)){
      if(ileri ? !imlecSonda(el) : !imlecBasta(el)) return;
    }
    if(alanGec(el, ileri ? 1 : -1)) e.preventDefault();
  }
}


/* ===================== ORTAK AY SEÇİMİ =====================
   Boş liste = tüm yıl. Seçilen aylar bitişik olmak zorunda değil. */

let ayFiltre = {takvim:[new Date().getMonth()], liste:[], mesai:[]};

function ayFiltreAc(hangi, ix){
  const l = ayFiltre[hangi];
  const yer = l.indexOf(ix);
  if(yer < 0) l.push(ix); else l.splice(yer, 1);
  l.sort((a,b) => a - b);
  ciz();
}
function ayFiltreTumu(hangi){ ayFiltre[hangi] = []; ciz(); }
function ayFiltreBuAy(hangi){
  const d0 = new Date();
  ayFiltre[hangi] = (d0.getFullYear() === S.yil) ? [d0.getMonth()] : [0];
  ciz();
}
function ayListesi(hangi){
  const l = ayFiltre[hangi];
  return l.length ? [...l].sort((a,b) => a - b) : [...Array(12).keys()];
}
function ayAraliklari(yil, hangi){
  return ayListesi(hangi).map(a => ({ay:a, bas: iso(new Date(yil, a, 1)), bit: iso(new Date(yil, a + 1, 0))}));
}
function ayKapsar(t, yil, hangi){
  if(!t || t.slice(0,4) !== String(yil)) return false;
  const l = ayFiltre[hangi];
  return !l.length || l.includes(d(t).getMonth());
}
function ayEtiketi(yil, hangi){
  const l = ayFiltre[hangi];
  if(!l.length) return String(yil);
  if(l.length === 1) return AY[l[0]] + ' ' + yil;
  if(l.length === 12) return String(yil);
  const bitisik = l.every((x, i) => i === 0 || x === l[i-1] + 1);
  return bitisik ? AY[l[0]]+' – '+AY[l[l.length-1]]+' '+yil
                 : l.map(x => AY[x].slice(0,3)).join(', ')+' '+yil;
}
function ayStrip(hangi){
  const l = ayFiltre[hangi];
  return '<div class="aysec">'
    + '<button class="'+(l.length?'':'on')+'" onclick="ayFiltreTumu(\''+hangi+'\')">Tüm yıl</button>'
    + AY.map((a,ix) => '<button class="'+(l.includes(ix)?'on':'')+'" title="'+a+'"'
        + ' onclick="ayFiltreAc(\''+hangi+'\','+ix+')">'+a.slice(0,3)+'</button>').join('')
    + '<button class="ayb2" onclick="ayFiltreBuAy(\''+hangi+'\')">Bu ay</button>'
    + '</div>';
}

/* Bir iznin seçili aylara düşen kısmı */
function izinPayi(i, yil, hangi){
  let gun = 0, bas = '', bit = '';
  for(const a of ayAraliklari(yil, hangi)){
    if(i.bit < a.bas || i.bas > a.bit) continue;
    const b = i.bas < a.bas ? a.bas : i.bas;
    const s = i.bit > a.bit ? a.bit : i.bit;
    gun += isGunu(b, s);
    if(!bas || b < bas) bas = b;
    if(!bit || s > bit) bit = s;
  }
  return {gun, bas, bit, var: !!bas, kirpik: bas !== i.bas || bit !== i.bit, tamBitis: bit === i.bit};
}


/* ===================== ÇOKLU SEÇİM SÜZGECİ =====================

/* ===================== MOBİL: TABLOLARI KARTA ÇEVİR =====================
   Her .ptbl tablosunun başlık metinlerini satır hücrelerine etiket olarak yazar.
   Kart görünümü CSS ile yalnızca dar ekranda devreye girer. */
function tabloEtiketle(){
  if(!document.querySelectorAll) return;
  /* içinde yalnız boş-durum yazısı olan gövdeleri işaretle */
  for(const bos of document.querySelectorAll('.card .bd > .empty')){
    if(bos.parentNode && bos.parentNode.children.length === 1) bos.parentNode.classList.add('bosgovde');
  }
  for(const tablo of document.querySelectorAll('table.ptbl')){
    const bas = tablo.querySelector('thead tr');
    if(!bas) continue;
    const etiketler = [...bas.children].map(th => {
      const t = [...th.childNodes].find(n => n.nodeType === 3 && n.textContent.trim());
      return t ? t.textContent.trim() : '';
    });
    for(const satir of tablo.querySelectorAll('tbody tr')){
      if(satir.classList.contains('detaysatir')) continue;   // açılır detay/hikâye satırı: kart/etiket uygulanmaz
      satir.classList.add('kart');
      [...satir.children].forEach((td, i) => {
        if(!td.getAttribute('data-e')){
          const e = etiketler[i] || '';
          if(e) td.setAttribute('data-e', e);
        }
        if(td.classList.contains('str')) td.classList.add('islem');
      });
      const ilk = satir.children[0];
      if(ilk && !ilk.classList.contains('bas')) ilk.classList.add('bas');
    }
    const sar = tablo.closest && tablo.closest('.twpair');
    if(sar) sar.classList.add('kartli');
  }
}

/* Dar ekranda menü şeridinde yalnız bu ikisi kalır */
const BIRINCIL = ['izinlerim','mesailerim'];

function navCiz(){
  const kuy = onayKuyrugu();
  let html = '', digerHtml = '', sonGrup = '';
  for(const s of SAYFALAR){
    if(s.ik && !ikMi()) continue;
    if(s.yonetici && !yoneticiMi()) continue;
    if(s.kosul && !s.kosul()) continue;
    if(s.grup !== sonGrup){ html += '<div class="grp">'+s.grup+'</div>'; sonGrup = s.grup; }
    const rozet = (s.k === 'onay' && kuy.toplam) ? '<span class="cnt">'+kuy.toplam+'</span>' : '';
    const birincil = BIRINCIL.includes(s.k);
    html += '<button class="'+(S.sayfa===s.k?'on ':'')+(birincil?'birincil':'ikincil')
          + (s.k==='izinlerim'?' navizin':s.k==='mesailerim'?' navmesai':'')+'"'
          + ' onclick="git(\''+s.k+'\')"><span class="ic">'+s.ic+'</span>'+s.ad+rozet+'</button>';
    if(!birincil)
      digerHtml += '<button class="'+(S.sayfa===s.k?'on':'')+'" onclick="hesapKapat();git(\''+s.k+'\')">'
        + '<span class="ic">'+s.ic+'</span>'+s.ad+rozet+'</button>';
  }
  $('#nav').innerHTML = html;
  const dg = document.getElementById('digernav');
  if(dg) dg.innerHTML = digerHtml;
}

function ustCiz(){
  const p = aktif();
  const gsv = gercekSeviye(p.id);
  $('#viewSel').innerHTML = GORUNUMLER.map(g =>
    '<option value="'+g.k+'"'+(g.k===(S.gorunum||'oto')?' selected':'')+'>'
    + (g.k==='oto' ? 'Görünüm: kişinin yetkisi' : 'Görünüm: '+g.ad)
    + ((g.sv !== null && g.sv > gsv) ? ' ↗' : '') + '</option>').join('');

  const w = document.getElementById('vbarWrap');
  w.innerHTML = kisitliMi()
    ? '<div class="vbar"><b>'+SEVIYE_AD[seviye()]+'</b> görünümündesiniz — menü ve veriler bu düzeye göre kısıtlandı. '
      + esc(adSoyad(p.id))+' aslında '+SEVIYE_AD[gsv]+' yetkisine sahip.'
      + '<button class="btn sm" onclick="gorunumSec(\'oto\')">Tam yetkiye dön</button></div>'
    : '';

  $('#avatar').textContent = bas(p.id);
  $('#whoName').textContent = adSoyad(p.id);
  $('#whoRole').textContent = rolAdi() + ' · ' + p.dept;

  const sirali = [...S.personel].filter(x=>x.aktif).sort((a,b)=>a.ad.localeCompare(b.ad,'tr'));
  const userEl = document.getElementById('userSel');
  if(userEl) userEl.innerHTML = sirali.map(x =>
    '<option value="'+x.id+'"'+(x.id===S.aktifId?' selected':'')+'>'+esc(x.ad+' '+x.soyad)+' — '+esc(x.unvan)+'</option>').join('');

  const bugunY = new Date().getFullYear();
  const son = Math.max(S.yil, bugunY) + 1;
  const yillar = [];
  for(let y = ilkYil(); y <= son; y++) yillar.push(y);
  if(!yillar.includes(S.yil)) S.yil = yilSinirla(S.yil);
  const yilEl = document.getElementById('yearSel');
  if(yilEl) yilEl.innerHTML = yillar.map(y => '<option value="'+y+'"'+(y===S.yil?' selected':'')+'>'+y+'</option>').join('');
}

function git(k){ S.sayfa = k; S.takvimSecim = null; ciz(); window.scrollTo(0,0); }

function ciz(){
  try{ cizGovde(); }
  catch(e){
    /* çerçeve içinde hatalar "Script error." olarak görünür; gerçek mesajı burada gösteririz */
    if(typeof bildir === 'function') bildir('Hata: ' + (e && e.message ? e.message : e));
    if(typeof console !== 'undefined' && console.error) console.error(e);
  }
}

function cizGovde(){
  const p = aktif();
  if(!p) return;
  if(!SAYFALAR.some(s=>s.k===S.sayfa)) S.sayfa = 'izinlerim';
  if(SAYFALAR.find(s=>s.k===S.sayfa)?.ik && !ikMi()) S.sayfa = 'izinlerim';
  if(SAYFALAR.find(s=>s.k===S.sayfa)?.yonetici && !yoneticiMi()) S.sayfa = 'izinlerim';
  const kos = SAYFALAR.find(s=>s.k===S.sayfa)?.kosul;
  if(kos && !kos()) S.sayfa = 'izinlerim';
  navCiz(); ustCiz();
  const fn = {izinlerim:vIzinlerim, liste:vListe, mesailiste:vMesaiListe, izinde:vIzinde, mesailerim:vMesailerim, onay:vOnay,
              takvim:vTakvim, personel:vPersonel, rapor:vRapor, kadro:vKadro,
              ayar_org:vAyar, ayar_izin:vAyar, ayar_mesai:vAyar, ayar_genel:vAyar}[S.sayfa];
  $('#page').innerHTML = fn ? fn() : '';
  if(S.sayfa === 'takvim') takvimBoya();
  guvenli(ustKaydirmaBagla);
  guvenli(tabloEtiketle);
  guvenli(aySelCiz);
}

/* Yardımcı işlevlerdeki hata sayfayı düşürmesin */
function guvenli(fn){
  try{ fn(); }
  catch(e){ if(typeof console !== 'undefined' && console.error) console.error(fn.name, e); }
}

/* Görünüm seçimi: gerekiyorsa o düzeyi temsil eden kişiye geçer */
function gorunumSec(k){
  const g = GORUNUMLER.find(x => x.k === k);
  S.gorunum = k;
  takvimFiltre.kuruldu = '';
  // seçilen düzeyi fiilen temsil eden bir kişiye geç
  if(g && g.sv !== null && gercekSeviye(S.aktifId) !== g.sv){
    const t = seviyeTemsilcisi(g.sv);
    if(t){ S.aktifId = t.id; bildir(g.ad + ' görünümü — ' + adSoyad(t.id) + ' üzerinden gösteriliyor.'); }
    else bildir('Bu düzeyde aktif personel bulunamadı.');
  }
  S.sayfa = 'izinlerim';
  kaydet();
}


/* Dar ekranda kişi/görünüm/dönem seçicilerini açıp kapatır */
function hesapAc(){
  const el = document.getElementById('oturum');
  if(el) el.classList.toggle('acik');
}
function hesapKapat(){
  const el = document.getElementById('oturum');
  if(el) el.classList.remove('acik');
}


/* ---- Dar ekrandaki ay seçimi ----
   Bulunulan sayfanın ay süzgecini yönetir; boş değer = tüm aylar. */
function aySayfaAnahtari(){
  return {izinlerim:'izin', mesailerim:'mesai', takvim:'takvim',
          liste:'liste', mesailiste:'mesai_r'}[S.sayfa] || '';
}
function aySecimiOku(){
  const k = aySayfaAnahtari();
  if(k === 'izin')   return izinAyF;
  if(k === 'mesai')  return mesaiAyF;
  if(k === 'takvim') return ayFiltre.takvim;
  if(k === 'liste')  return ayFiltre.liste;
  if(k === 'mesai_r')return ayFiltre.mesai;
  return null;
}
function aySecimiYaz(deger){
  const k = aySayfaAnahtari();
  const l = deger === '' ? [] : [Number(deger)];
  if(k === 'izin')   izinAyF = l;
  else if(k === 'mesai')  mesaiAyF = l;
  else if(k === 'takvim') ayFiltre.takvim = l;
  else if(k === 'liste')  ayFiltre.liste = l;
  else if(k === 'mesai_r')ayFiltre.mesai = l;
  ciz();
}
function aySelCiz(){
  const el = document.getElementById('aySel');
  if(!el) return;
  const l = aySecimiOku();
  if(!l){ el.style.display = 'none'; return; }
  el.style.display = '';
  const secili = l.length === 1 ? String(l[0]) : '';
  el.innerHTML = '<option value="">Tüm aylar</option>'
    + AY.map((a,ix) => '<option value="'+ix+'"'+(String(ix)===secili?' selected':'')+'>'+a+'</option>').join('');
  el.onchange = e => aySecimiYaz(e.target.value);
}

function stat(k, v, birim, s, renk, tik, sinif){

    + '<div class="k">'+k+'</div>'

    + '<div class="s">'+s+'</div>'

        + '<path d="M4.4 6.2h7.2M4.4 9h7.2M4.4 11.6h4.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>'
        + '</svg><span>Raporu aç</span><i>›</i></div>' : '')+'</div>';
}

/* Bir kişinin 5'li izin özeti kartları (İzinlerim ve İzin hakları raporu > Kayıtlar).
   KULLANIM kartı tıklanınca kullanım dökümü açılır ("Raporu aç"). */
function izinOzetKartlari(p, b){
  const donemAlt = Number(b.bakiyeTarihi.slice(0,4)) >= S.yil
      ? trTarih(b.bakiyeTarihi)+' itibarıyla'
      : (S.yil-1)+' yılından devir';
  const toplam = b.yilToplamKullanim;               // planlanan dahil toplam
  const gerc   = toplam - b.planlanan;              // gerçekleşen
  const oncekiIp = b.oncekiKullanim ? sayi(b.oncekiKullanim)+' günü dönem başı rakamına dahil' : '';
  let kullAlt;
  if(!toplam){
    kullAlt = oncekiIp || 'Henüz izin kullanılmadı';
  } else {
    kullAlt = '<span style="font-size:14px;color:var(--ink)"'+(oncekiIp?' title="'+esc(oncekiIp)+'"':'')+'>Kullanılan <b>'+sayi(gerc)+'</b></span>'
        + ' <span style="font-size:14px;color:var(--bekle)">· Planlanan <b>'+sayi(b.planlanan)+'</b></span>';
    if(oncekiIp) kullAlt += '<br><span class="hint">'+oncekiIp+'</span>';
  }
  return stat('Dönem başı izin hakkı', sayi(b.devir), 'gün', donemAlt)
    + stat('Kullanım', (toplam ? '−' : '') + sayi(toplam), 'gün', kullAlt,
        toplam ? 'var(--red)' : '', "izinDokum('"+p.id+"')", 'raporlu')
    + stat('Güncel kalan izin hakkı', sayi(b.kalan), 'gün',
        S.yil === new Date().getFullYear() ? 'Bugün kullanılabilir' : S.yil+' içinde kullanılabilir')
    + stat(S.yil+' hak edişinden gelecek', sayi(b.yilSonuEk), 'gün',
        b.yilSonuKazanim.length
          ? b.yilSonuKazanim.map(x => trTarih(x.tarih)).join(', ')+' tarihinde eklenir'
          : (b.sonraki ? 'Bu yıl yok · sonraki '+trTarih(b.sonraki.tarih) : 'Hak ediş tarihi yok'))
    + stat('Hak ediş sonrası kalan', sayi(b.yilSonuKalan), 'gün', '31 Ara '+S.yil+' itibarıyla');
}
/* ===================== 6. İZİNLERİM ve MESAİLERİM ===================== */

function izinSatiri(i, yonetimGorunumu){
  const t = turBul(i.tur), p = per(i.pid);
  let ops = '';
  if(izinKararVerebilir(i))
    ops += '<button class="btn sm ok" onclick="izinKarar(\''+i.id+'\',true)">Onayla</button> '
         + '<button class="btn sm no" onclick="izinRedAc(\''+i.id+'\')">Reddet</button> ';
  // Revize yalnızca talep sahibine (personel) gösterilir; onaylayan yönetici görmez.
  // Geri çekme/iptal Revize ekranının içinde (ayrı buton yok). Sil butonu yok.
  if(izinRevizeEdilebilir(i) && i.pid === S.aktifId) ops += '<button class="btn sm" onclick="izinRevizeAc(\''+i.id+'\')">Revize</button> ';
  ops += '<button class="btn sm" onclick="izinDetay(\''+i.id+'\')">Detay</button>';

  // Revize geçmişi varsa: talebin altında "Neydi / Ne oldu" hikâyesi
  const revizeler = (i.gecmis||[]).filter(g => g.rol === 'Revize' && g.eski && g.yeni);
  let hikaye = '';
  if(revizeler.length){
    hikaye = '<tr class="detaysatir"><td colspan="'+(yonetimGorunumu ? 7 : 6)+'">'
      + '<div style="padding:9px 13px;font-size:12.5px;line-height:1.55">'
      + '<div class="hint" style="margin-bottom:5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em">Revize geçmişi</div>'
      + revizeler.map(r =>
          '<div style="padding:4px 0;border-top:1px solid var(--line2)">'
          + '<div style="color:var(--ink2)"><b style="display:inline-block;min-width:56px;font-weight:600">Neydi</b>'+esc(r.eski)+'</div>'
          + '<div><b style="display:inline-block;min-width:56px;font-weight:600;color:var(--brand)">Ne oldu</b><b>'+esc(r.yeni)+'</b></div>'
          + '<div class="hint" style="margin-left:56px;margin-top:1px">'
            + (r.gerekce ? esc(r.gerekce)+' · ' : '') + esc(r.kisi||'') + ' · ' + trTarih(r.tarih)
          + '</div></div>'
        ).join('')
      + '</div></td></tr>';
  }

  return '<tr class="kart">'
    + (yonetimGorunumu ? '<td data-e="Personel"><div style="font-weight:600">'+esc(adSoyad(i.pid))+'</div><div class="hint">'+esc(p?p.dept:'')+'</div></td>' : '')
    + '<td data-e="Tür" class="bas"><span class="tag n" style="border-color:'+t.renk+'55;color:'+t.renk+'"><i class="dot"></i>'+esc(t.ad)+'</span></td>'
    + '<td data-e="Tarih" class="mono" style="font-size:12.5px;white-space:nowrap">'
      + (saatliIzin(i) ? trTarih(i.bas)+' · '+i.saatBas+' – '+i.saatBit
                       : trTarih(i.bas)+' – '+trTarih(i.bit))+'</td>'
    + '<td data-e="İşe başlama" class="mono hint" style="font-size:12.5px;white-space:nowrap">'
      + (saatliIzin(i)
          ? (saatlikGunSonu(i.saatBit)
              ? trTarih(sonrakiIsGunu(i.bit))+' · '+calismaBas()
              : '<span class="hint">'+i.saatBit+' · aynı gün</span>')
          : trTarih(sonrakiIsGunu(i.bit)))+'</td>'
    + '<td data-e="Gün" class="num">'+izinSuresiYazi(i)+'</td>'
    + '<td data-e="Durum">'+durumTag(i.durum)
      + (i.revizeliOnay ? ' <span class="pill" style="background:var(--bekle-soft);border-color:var(--bekle-line);color:var(--bekle)" title="'+esc((i.revizeEden||'Yönetici')+' tarafından revize edildi'+(i.revizeNot?': '+i.revizeNot:''))+'">Revize edildi</span>' : '')
      + (izinBakiyeOncesi(i) ? ' <span class="pill" title="Bakiye tarihinden önce — girdiğiniz bakiyenin içinde sayılır">Bakiyede</span>' : '')
      + '</td>'
    + '<td class="str islem">'+ops+'</td></tr>' + hikaye;
}

/* Listelerdeki ay süzgeci — birden çok ay seçilebilir; boş liste = tüm yıl */
let izinAyF = [], mesaiAyF = [];
function ayAc(hangi, ix){
  const l = hangi === 'izin' ? izinAyF : mesaiAyF;
  const yer = l.indexOf(ix);
  if(yer < 0) l.push(ix); else l.splice(yer, 1);
  ciz();
}
function ayTumu(hangi){
  if(hangi === 'izin') izinAyF = []; else mesaiAyF = [];
  ciz();
}
function ayUyar(l, ...aylar){ return !l.length || aylar.some(a => l.includes(a)); }
function aySecici(secili, hangi){
  return '<div class="aysec">'
    + '<button class="'+(secili.length?'':'on')+'" onclick="ayTumu(\''+hangi+'\')">Tüm yıl</button>'
    + AY.map((a,ix) => '<button class="'+(secili.includes(ix)?'on':'')+'" title="'+a+'"'
        + ' onclick="ayAc(\''+hangi+'\','+ix+')">'+a.slice(0,3)+'</button>').join('')
    + '</div>';
}

function vIzinlerim(){
  const p = aktif(), b = bakiye(p.id, S.yil);
  const liste = S.izin.filter(i => i.pid === p.id && BEKLEYEN.includes(i.durum))
                      .sort((a,c) => c.bas.localeCompare(a.bas)
                                  || c.bit.localeCompare(a.bit)
                                  || String(c.olusturma||'').localeCompare(String(a.olusturma||'')));
  const kuy = onayKuyrugu();
  let h = '<div class="row" style="justify-content:space-between;margin-bottom:16px">'
    + '<div><h1 style="font-size:20px" class="yalnizgenis">İzinlerim</h1>'
    + '<div class="hint yalnizgenis">'+esc(p.ad+' '+p.soyad)+' · '+S.yil+' dönemi · '+kidemYiliTarihte(p.id,bugun())+' yıl kıdem</div></div>'
    + '<button class="btn pri anabtn izinbtn" onclick="izinFormu()">+ İzin talebi</button></div>';

  if(yoneticiMi() && kuy.toplam) h += '<div class="card" style="margin-bottom:14px;border-color:var(--bekle-line);background:var(--bekle-soft)">'
    + '<div class="bd row"><div><b>'+kuy.toplam+' kayıt onayınızı bekliyor.</b> '
    + '<span class="hint">'+kuy.izinler.length+' izin talebi, '+kuy.mesailer.length+' mesai kaydı.</span></div>'
    + '<button class="btn pri" style="margin-left:auto" onclick="git(\'onay\')">Bekleyen onayları aç</button></div></div>';

  // Talep sahibine: yöneticinin revize ettiği / reddettiği izinler — "İzin Taleplerim" altında derli toplu gösterilir
  const bildirimler = (p.id === S.aktifId)
    ? S.izin.filter(i => i.pid === p.id && ((i.revizeliOnay && !i.revizeGoruldu) || (i.durum === 'reddedildi' && !i.redGoruldu)))
        .map(i => ({ i, ret: (i.durum === 'reddedildi'),
                     zaman: (i.durum === 'reddedildi') ? (i.redTarih||'') : (i.revizeTarih||'') }))
        .sort((a,c) => String(c.zaman).localeCompare(String(a.zaman)))
    : [];

  h += '<div class="grid g5" style="margin-bottom:14px">'
    + izinOzetKartlari(p, b)
    + stat('Kimler izinde', izindeKisiSayisi(), 'kişi', 'Bugün izinde', '', 'izindeAc()', 'yalnizdar raporlu mavi')
    + '</div>';

  const bekGun = liste.reduce((a,x) => a + x.gun, 0);
  h += '<div class="card"><div class="hd"><h3>İzin Taleplerim</h3>'
    + '<div class="sp hint">'
      + (liste.length ? liste.length+' talep onay bekliyor · '+sayi(bekGun)+' gün' : 'Onay bekleyen talep yok')
      + '</div></div>'
    + '<div class="bd flush">';
  if(!liste.length) h += '<div class="empty"><div class="e1">Onay bekleyen talebiniz yok</div>Yeni talep için üstteki düğmeyi kullanın.</div>';
  else h += '<div class="twpair kartli">'+ustCubuk()+'<div class="tw"><table class="ptbl"><thead><tr>'
    + '<th>Tür</th><th>Tarih aralığı</th><th>İşe başlama</th><th class="num">Gün</th><th>Durum</th><th class="str">İşlem</th></tr></thead><tbody>'
    + liste.map(i => izinSatiri(i,false)).join('') + '</tbody></table></div></div>';
  h += '</div>';   // .bd.flush kapanır

  // Yönetici işlemleri (revize / ret) — derli toplu, tek satır
  if(bildirimler.length) h += '<div class="bd" style="border-top:1px solid var(--line)">'
    + '<div class="hint" style="margin-bottom:4px">Yönetici işlemleri</div>'
    + bildirimler.map(({i, ret}) =>
        '<div class="row" style="justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)">'
        + '<div style="display:flex;align-items:center;gap:9px;min-width:0;flex-wrap:wrap">'
          + '<span class="tag '+(ret?'r':'b')+'"><i class="dot"></i>'+(ret?'Reddedildi':'Revize edildi')+'</span>'
          + '<span style="font-size:13px">'+esc(turBul(i.tur).ad)+' · '+trTarih(i.bas)+' – '+trTarih(i.bit)+' · '+izinSuresiYazi(i)+'</span>'
