        + '</div></div>').join('')
    + '</div>';

  h += '</div>';   // .card kapanır
  return h;
}

/* Tablonun altındaki toplam satırı */
function mesaiDipToplam(liste){
  const sayilan = liste.filter(x => x.durum !== 'reddedildi' && x.durum !== 'iptal');
  if(!sayilan.length) return '';
  const saat = sayilan.reduce((a,x) => a + x.sure, 0);
  const tutar = sayilan.filter(x => x.karsilik === 'ucret').reduce((a,x) => a + mesaiTutar(x), 0);
  const bekleyen = sayilan.filter(x => BEKLEYEN.includes(x.durum));
  const bekSaat = bekleyen.reduce((a,x) => a + x.sure, 0);
  const bekTutar = bekleyen.filter(x => x.karsilik === 'ucret').reduce((a,x) => a + mesaiTutar(x), 0);

  return '<tr class="dip"><td data-e="Toplam" colspan="2"><b>Toplam · '+sayilan.length+' kayıt</b></td>'
    + '<td data-e="Süre"><b>'+sayi(saat)+' saat</b>'
      + (bekSaat ? '<div class="hint" style="font-size:11px">'+sayi(bekSaat)+' saat onay bekliyor</div>' : '')+'</td>'
    + '<td data-e="Tutar" class="num mono"><b>'+sayi(tutar)+' ₺</b>'
      + (bekTutar ? '<div class="hint" style="font-size:11px">'+sayi(bekTutar)+' ₺ bekliyor</div>' : '')+'</td>'
    + '<td colspan="2"></td></tr>';
}

/* Tutarın nasıl bulunduğunu satırda gösterir */
function mesaiHesapMetni(m){
  const t = mturBul(m.tur);
  const ust = m.karsilik === 'ucret'
    ? sayi(saatlikUcret(m.pid))+' ₺ × '+sayi(m.sure)+' sa × '+t.carpan.toFixed(2).replace('.',',')
    : sayi(m.sure)+' sa × '+t.carpan.toFixed(2).replace('.',',')+' = '+sayi(m.sure*t.carpan)+' sa izin';
  return '<div class="mono" style="font-size:12px;white-space:nowrap">'+ust+'</div>'
    + '<div class="hint" style="font-size:11px">'+esc(t.ad)
    + (m.karsilik === 'ucret' ? '' : ' · serbest zaman')+'</div>';
}

function mesaiSatiri(m, yonetimGorunumu, dokum){
  const t = mturBul(m.tur);
  let ops = '';
  if(!dokum){                                    // döküm görünümünde yalnız Detay; aksiyonlar Detay ekranından
    if(mesaiKararVerebilir(m))
      ops += '<button class="btn sm ok" onclick="mesaiKarar(\''+m.id+'\',true)">Onayla</button> '
           + '<button class="btn sm no" onclick="mesaiRedAc(\''+m.id+'\')">Reddet</button> ';
    if(m.durum === 'yonetici_bekliyor' && m.pid === S.aktifId) ops += '<button class="btn sm" onclick="mesaiIptal(\''+m.id+'\')">Geri çek</button> ';
    if(mesaiRevizeEdilebilir(m)) ops += '<button class="btn sm" onclick="mesaiRevizeAc(\''+m.id+'\')">Revize</button> ';
    if(mesaiIptalTalebi(m)) ops += '<button class="btn sm no" onclick="mesaiIptal(\''+m.id+'\')">İptal talebi</button> ';
    if(mesaiSilinebilir(m)) ops += '<button class="btn sm no" onclick="mesaiSil(\''+m.id+'\')">Sil</button> ';
  }
  ops += '<button class="btn sm" onclick="mesaiDetay(\''+m.id+'\')">Detay</button>';
  return '<tr class="kart">'
    + (yonetimGorunumu ? '<td data-e="Personel"><div style="font-weight:600">'+esc(adSoyad(m.pid))+'</div><div class="hint">'+esc(per(m.pid)?.dept||'')+'</div></td>' : '')
    + '<td data-e="Tarih" class="mono bas" style="font-size:12.5px;white-space:nowrap">'+trTarih(m.tarih)+'</td>'
    + '<td data-e="Saat" class="mono" style="font-size:12.5px">'+m.bas+' – '+m.bit+'</td>'
    + '<td data-e="Hesaplama">'+mesaiHesapMetni(m)+'</td>'
    + '<td data-e="Tutar" class="num mono" style="font-size:12.5px">'
      + (m.karsilik==='ucret' ? sayi(mesaiTutar(m))+' ₺'
         : '<span class="hint">'+sayi(m.sure*t.carpan)+' sa izin</span>')+'</td>'
    + '<td data-e="Durum">'+durumTag(m.durum)+'</td>'
    + '<td class="str islem">'+ops+'</td></tr>';
}

/* ===================== KULLANIM DÖKÜMÜ =====================
   Kullanılan ve onay bekleyen izinler; yıl ve ay seçilebilir. */

function izinDokum(pid, yil){
  if(!gorebilir(pid)){ bildir('Bu kişinin kayıtlarını görme yetkiniz yok.'); return; }
  // Kayıtlar penceresinden açıldıysa (S.kayitKisi dolu), döküm kapanınca oraya dönülsün
  S.dokumGeri = S.kayitKisi ? {kisi:S.kayitKisi, tip:S.kayitTip, aralik:S.kayitAralik} : null;
  S.dokumKisi = pid;
  if(yil !== undefined) S.dokumYil = Number(yil);
  if(S.dokumYil === undefined) S.dokumYil = S.yil;
  S.dokumAylar = []; S.dokumAyAcik = false;
  izinDokumCiz();
}
/* Döküm penceresini kapat: Kayıtlar'dan açıldıysa oraya geri dön, değilse tamamen kapat */
function dokumKapat(){
  const g = S.dokumGeri;
  S.dokumGeri = null;
  if(g){
    kisiKayitlari(g.kisi, g.tip, g.aralik ? g.aralik.bas : undefined, g.aralik ? g.aralik.bit : undefined);
  } else {
    modalKapat();
  }
}
function dokumYilSec(y){ S.dokumYil = Number(y); izinDokumCiz(); }
function dokumAyToggle(){ S.dokumAyAcik = !S.dokumAyAcik; izinDokumCiz(); }
function dokumAyKapat(){ S.dokumAyAcik = false; izinDokumCiz(); }
function dokumAySec(ix){ S.dokumAylar = S.dokumAylar || []; if(ix===null){ S.dokumAylar=tumunuSecToggle(S.dokumAylar,[...Array(12).keys()]); } else { const j=S.dokumAylar.indexOf(ix); if(j<0) S.dokumAylar.push(ix); else S.dokumAylar.splice(j,1); } izinDokumCiz(); }

/* İznin seçili aya (ya da yıla) düşen kısmı */
function dokumPayi(i, yil, ay){
  const bas = ay === '' ? iso(new Date(yil, 0, 1))  : iso(new Date(yil, Number(ay), 1));
  const bit = ay === '' ? iso(new Date(yil, 11, 31)): iso(new Date(yil, Number(ay) + 1, 0));
  if(i.bit < bas || i.bas > bit) return null;
  const b = i.bas < bas ? bas : i.bas;
  const s = i.bit > bit ? bit : i.bit;
  return {bas:b, bit:s, gun: isGunu(b, s), kirpik: b !== i.bas || s !== i.bit};
}

function izinDokumCiz(){
  const pid = S.dokumKisi, yil = S.dokumYil;

          + '<button type="button" onclick="dokumAySec(null)">'+((S.dokumAylar&&S.dokumAylar.length>=12) ? 'Temizle' : 'Tümünü seç')+'</button></div>'
          + '<div class="coklist aygrid">'+AY.map((a,ix)=>'<label><input type="checkbox" '+((S.dokumAylar||[]).includes(ix)?'checked':'')+' onchange="dokumAySec('+ix+')"><span>'+esc(a)+'</span></label>').join('')+'</div></div>' : '')
    + '</div>'
  + '</div>'
  + '<div class="mt"><table class="dtbl dokum"><thead><tr>'
    + '<th>İzin türü</th><th>Başlangıç</th>'

        }).join('')
      + '<tr class="dip"><td colspan="3"><b>Bakiyeden düşen</b></td><td class="num"><b>'+sayi(toplam)+'</b></td><td></td></tr>'
    : '<tr><td colspan="5"><div class="hint" style="padding:14px 0">Bu dönemde kayıt yok.</div></td></tr>')
  + '</tbody></table></div>'
  + (ozelVar ? '<div class="hint dokumnot">Toplam yalnızca yıllık izin hakkından düşen günleri kapsar. Evlilik, doğum günü, babalık, ölüm gibi izinler listede görünür; yasal hakkı aşmadıkça bakiyeden düşmez.</div>' : '')
  + (S.dokumAyAcik ? '<div style="height:210px"></div>' : '')   // ay paneli açıkken kırpılmaması için yer aç
  + '</div>'
  + '<div class="mf"><button class="btn" onclick="dokumKapat()">Kapat</button></div>');
}

/* ===================== 7. TALEP FORMLARI ===================== */

function izinFormu(pid, basTarih, bitTarih){
  const hedef = pid || S.aktifId;
  const secilebilir = S.personel.filter(x => x.aktif && izinGirebilir(x.id));
  if(!secilebilir.some(x => x.id === hedef)) return bildir('Bu kişi adına izin talebi giremezsiniz.');
  const b = bakiye(hedef, S.yil);
  const gecerliTarih = t => !!t && /^\d{4}-\d{2}-\d{2}$/.test(t);
  const basS = gecerliTarih(basTarih) ? basTarih : '';
  const bitisS = (gecerliTarih(bitTarih) && bitTarih >= basS) ? bitTarih : '';

  modalAc('<div class="mh"><h3 class="mbaslik">'
  + (darEkran() ? 'İZİN TALEBİ' : 'İzin talebi oluştur')
  + '</h3><button class="x" onclick="modalKapat()">×</button></div>'
  + '<div class="mb">'
  + '<div class="grid g2 izingrid">'
  + '<div class="fld yalnizgenis"><label class="lb">Personel</label><select id="f_pid" onchange="izinHesapla()">'
      + secilebilir.map(x=>'<option value="'+x.id+'"'+(x.id===hedef?' selected':'')+'>'+esc(x.ad+' '+x.soyad)+'</option>').join('')
      + '</select></div>'
  + '<div class="fld"><label class="lb">İzin türü</label><select id="f_tur" onchange="turDegisti()">'
      + S.ayar.izinTurleri.map(t=>'<option value="'+t.kod+'">'+esc(t.ad)+(t.hakGun?' ('+t.hakGun+' gün)':'')+'</option>').join('')
      + '</select></div>'
  + '<div class="fld"><label class="lb">Tarih</label>'
    + '<button type="button" class="tarihsec" id="f_tarihbtn" onclick="formTakvimAc(\'f_bas\')">'
    + '<span id="f_tarihyazi">Takvimden seçin</span>'
    + '<svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">'
    + '<rect x="1.5" y="3" width="13" height="11.5" rx="1.8" fill="none" stroke="currentColor" stroke-width="1.3"/>'
    + '<path d="M1.5 6.5h13M5 1.5v3M11 1.5v3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>'
    + '</svg></button></div>'
  + '</div>'
  + '<div id="f_saatalan" class="ikili" style="display:none">'
    + '<div class="fld"><label class="lb">Başlangıç saati</label>'
      + saatSecici('f_sbas', calismaBas()).replace('onchange="izinHesapla()"',
          'onchange="bitisSaatiTazele(\'f_sbas\',\'f_sbit\');izinHesapla()"')+'</div>'
    + '<div class="fld"><label class="lb">Bitiş saati</label>'
      + saatSecici('f_sbit', saatEkle(calismaBas(),2), saatEkle(calismaBas(),0.5))+'</div>'
    + '<div class="hint tamsat" style="margin-top:-4px">Çalışma saatleri '+calismaBas()+' – '+calismaBit()+' · en az yarım saat</div>'
  + '</div>'
  + '<input type="hidden" id="f_bas" value="'+esc(isoToTr(basS))+'">'
  + '<input type="hidden" id="f_bit" value="'+esc(isoToTr(bitisS))+'">'
  + '<div id="f_takvim"></div>'
  + '<div id="f_ozet" class="mt"></div>'
  + '<div class="fld mt"><label class="lb">Açıklama</label><textarea id="f_ack" placeholder="Talebin gerekçesi, iletişim bilgisi, vekâlet bırakılan kişi…"></textarea></div>'
  + '<div id="f_uyari" class="mt"></div>'
  + '</div>'
  + '<div class="mf"><button class="btn" onclick="modalKapat()">Vazgeç</button>'
  + '<button class="btn pri" onclick="izinKaydet()">Talebi gönder</button></div>');
  const ilk = basS || bugun();
  S.formYil = yilSinirla(d(ilk).getFullYear());
  S.formAy  = d(ilk).getMonth();
  S.formTakvimAcik = '';
  izinHesapla();
}

/* ---- Form içi mini takvim: tarih alanının takvim düğmesinden açılır ---- */
function formTakvimAc(id){
  if(S.formTakvimAcik === id){ S.formTakvimAcik = ''; formTakvimCiz(); return; }
  S.formTakvimAcik = id;
  const mevcut = tarihAl(id) || tarihAl('f_bas') || bugun();
  S.formYil = yilSinirla(d(mevcut).getFullYear());
  S.formAy  = d(mevcut).getMonth();
  formTakvimCiz();
}
function formTakvimKapat(){ S.formTakvimAcik = ''; formTakvimCiz(); }

function formAyDegis(n){
  let ay = (S.formAy || 0) + n, yil = S.formYil || new Date().getFullYear();
  while(ay < 0){ ay += 12; yil--; }
  while(ay > 11){ ay -= 12; yil++; }
  if(yil < ilkYil()){ yil = ilkYil(); ay = 0; }
  S.formAy = ay; S.formYil = yil;
  formTakvimCiz();
}

function formGunSec(t){
  const pid = $('#f_pid').value;
  if(gecmisTarihMi(t)){ bildir(trTarih(sistemBaslangic())+' tarihinden önceye izin girilemez.'); return; }
  if(cikisSonrasiMi(pid, t)){ bildir('İşten çıkış tarihinden ('+trTarih(per(pid).cikis)+') sonrasına izin girilemez.'); return; }
  if(kendiCakismasi(pid, t, t, null).length){ bildir(trTarih(t)+' tarihinde zaten izin kaydınız var.'); return; }

  /* saatlik izin tek gün: bir tık yeter, takvim kapanır */
  if(saatliTur($('#f_tur').value)){
    $('#f_bas').value = isoToTr(t);
    $('#f_bit').value = isoToTr(t);
    S.formTakvimAcik = '';
    izinHesapla();
    return;
  }

  const hedef = S.formTakvimAcik || 'f_bas';
  const bas = tarihAl('f_bas'), bit = tarihAl('f_bit');

  if(hedef === 'f_bit'){
    if(bas && t < bas){ bildir('Bitiş, başlangıçtan önce olamaz.'); return; }
    if(bas && kendiCakismasi(pid, bas, t, null).length){ bildir('Seçtiğiniz aralık mevcut bir izinle çakışıyor.'); return; }
    $('#f_bit').value = isoToTr(t);
    S.formTakvimAcik = '';
  } else {
    $('#f_bas').value = isoToTr(t);
    if(!bit || bit < t) $('#f_bit').value = '';
    S.formTakvimAcik = 'f_bit';          // sıra bitiş gününde
  }
  izinHesapla();
}

function formTakvimCiz(){
  const el = document.getElementById('f_takvim');
  if(!el) return;
  if(!S.formTakvimAcik){ el.innerHTML = ''; return; }
  const pid = $('#f_pid').value;
  const yil = S.formYil, ay = S.formAy;
  const bas = tarihAl('f_bas'), bit = tarihAl('f_bit');
  const gunSayisi = new Date(yil, ay + 1, 0).getDate();
  const bosluk = (new Date(yil, ay, 1).getDay() + 6) % 7;
  const bugunS = bugun();

  let hucre = '';
  for(let i = 0; i < bosluk; i++) hucre += '<div class="fb"></div>';
  for(let g = 1; g <= gunSayisi; g++){
    const dt = new Date(yil, ay, g), t = iso(dt);
    const tat = tatilBul(t);
    const we = !S.ayar.calismaGunleri.includes(dt.getDay());
    const iz = kendiCakismasi(pid, t, t, null)[0];
    const gecmis = gecmisTarihMi(t);
    const cikisSonra = cikisSonrasiMi(pid, t);
    const secilemez = !!iz || gecmis || cikisSonra;

    const kuralIhlal = (!secilemez && !we && !tat) ? gunKuralIhlali(pid, t) : null;

    let c = 'fg';
    if(tat) c += ' ft'; else if(we) c += ' fw';
    if(iz) c += ' fizin';
    if(gecmis || cikisSonra) c += ' fpas';
    if(kuralIhlal) c += ' fkural';
    if(bas && bit && t >= bas && t <= bit) c += ' fara';
    if(t === bas || (t === bit && bit)) c += ' fuc';
    if(t === bugunS) c += ' fbugun';

    const ip = iz ? trTarih(t)+' · zaten izinlisiniz: '+turBul(iz.tur).ad+' ('+DURUM_AD[iz.durum]+')'
      : gecmis ? trTarih(t)+' · sistem başlangıcından önce'
      : cikisSonra ? trTarih(t)+' · işten çıkış tarihinden sonra'
      : trTarih(t)+(tat ? ' · '+tat.ad+', izinden düşmez'
          : we ? ' · hafta tatili, izinden düşmez'
          : kuralIhlal ? ' · ⚠ '+kuralIhlal.grup.ad+' kuralı aşılıyor'
              + (kuralIhlal.izinli.length ? ' · izinli: '+kuralIhlal.izinli.map(u=>adSoyad(u)).join(', ') : '')
          : '');

    hucre += '<div class="'+c+'" title="'+esc(ip)+'"'
      + (secilemez ? '' : ' onclick="formGunSec(\''+t+'\')"')+'>'+g+'</div>';
  }

  el.innerHTML = '<div class="ftak mt">'
    + '<div class="fth"><button type="button" onclick="formAyDegis(-1)"'
      + ((yil < ilkYil() || (yil === ilkYil() && ay === 0)) ? ' disabled' : '')+'>‹</button>'
    + '<b>'+AY[ay]+' '+yil+'</b>'
    + '<button type="button" onclick="formAyDegis(1)">›</button>'
    + '<span class="hint">'+(saatliTur($('#f_tur').value) ? 'Günü seçin'
        : S.formTakvimAcik === 'f_bit' ? 'Bitiş gününü seçin' : 'Başlangıç gününü seçin')+'</span>'
    + '<button type="button" class="fkapat" title="Kapat" onclick="formTakvimKapat()">×</button></div>'
    + '<div class="fgun">'+['Pt','Sa','Ça','Pe','Cu','Ct','Pa'].map(x=>'<div class="fgb">'+x+'</div>').join('')+'</div>'
    + '<div class="fgun">'+hucre+'</div>'
    + '<div class="fleg"><span><i class="fs fizin"></i>İzinli olduğunuz gün</span>'
    + '<span><i class="fs fkural"></i>Kural ihlali</span>'
    + '<span><i class="fs fw"></i>Hafta tatili</span><span><i class="fs ft"></i>Resmî tatil</span></div>'
    + '</div>';
}

/* İzin türü değişince tek gün / aralık düzeni yeniden kurulur */
function turDegisti(){
  if(saatliTur($('#f_tur').value)){
    const b = tarihAl('f_bas');
    if(b) $('#f_bit').value = isoToTr(b);
    if(S.formTakvimAcik === 'f_bit') S.formTakvimAcik = 'f_bas';
  }
  izinHesapla();
}

/* Tarih düğmesinin üzerindeki yazıyı seçime göre günceller */
function tarihBtnYaz(){
  const el = document.getElementById('f_tarihyazi');
  if(!el) return;
  const b = tarihAl('f_bas'), s2 = tarihAl('f_bit');
  /* dar ekranda yıl iki haneli: 03 Ağu 26 */
  const yaz = t => darEkran() ? trTarih(t).replace(/(\d{2})(\d{2})$/, '$2') : trTarih(t);
  if(saatliTur($('#f_tur').value)){
    el.textContent = b ? yaz(b) : 'Takvimden seçin';
  } else
  el.textContent = (b && s2) ? yaz(b)+' – '+yaz(s2)
    : b ? yaz(b)+' – …'
    : 'Takvimden seçin';
  const btn = document.getElementById('f_tarihbtn');
  if(btn){ if(b && s2) btn.classList.add('dolu'); else btn.classList.remove('dolu'); }
}

function izinHesapla(){
  const saatli = saatliTur($('#f_tur').value);
  const saatAlan = document.getElementById('f_saatalan');
  if(saatAlan) saatAlan.style.display = saatli ? '' : 'none';
  if(saatli){
    const b0 = tarihAl('f_bas');
    if(b0) $('#f_bit').value = isoToTr(b0);     // saatlik izin tek gündür
  }
  tarihBtnYaz();
  const pid = $('#f_pid').value, tur = $('#f_tur').value;
  const bas0 = tarihAl('f_bas'), bit0 = tarihAl('f_bit');

  formTakvimCiz();

  /* Tarihler tamamlanmadan uyarı gösterme */
  if(!bas0 || !bit0){
    $('#f_ozet').innerHTML = '<div class="ozet renkli">'
      + '<div class="ozet-h o-tarih"><div class="lb">İşbaşı</div>'
      + '<div class="v-ad">—</div><div class="s">Takvimden gün seçin</div></div>'
      + '<div class="ozet-h o-gun">'
      + '<div class="lb">İzin günü</div><div class="v">—</div>'
      + '<div class="s">'+(bas0 ? 'Bitiş tarihini girin' : 'Başlangıç ve bitiş tarihini girin')+'</div></div>'
      + '<div class="ozet-h o-kalan"><div class="lb">Talep sonrası kalan</div>'
      + '<div class="v">'+sayi(bakiye(pid, S.yil).kalan)+'<small>gün</small></div>'
      + '<div class="s">Şu anki bakiye</div></div>'
      + '<div class="ozet-h o-onay"><div class="lb">Onay verecek kişi</div>'
      + '<div class="v-ad">'+esc(per(pid)?.yonetici ? adSoyad(per(pid).yonetici) : 'İnsan Kaynakları')+'</div>'
      + '<div class="s">'+esc(per(pid)?.yonetici ? ((per(per(pid).yonetici)||{}).unvan || '') : 'Yöneticisi tanımlı değil')+'</div></div>'
      + '</div>';
    $('#f_uyari').innerHTML = '';
    S.gerekceTaslak = '';
    return;
  }

  const bas = tarihAl('f_bas');
  let bit = saatli ? bas : tarihAl('f_bit');
  if(bas && bit && bit < bas){ bit = bas; $('#f_bit').value = isoToTr(bas); }
  const gun = saatli ? 0 : isGunu(bas, bit);
  const t = turBul(tur), b = bakiye(pid, S.yil);
  const cak = cakisan(pid, bas, bit, null);
  const ihlal = grupIhlali(pid, bas, bit, null);
  const kendi = kendiCakismasi(pid, bas, bit, null);

  let uyari = '';
  if(saatli){
    const sn = saatlikSinirlar($('#f_sbas').value, $('#f_sbit').value);
    if(!sn.ok){
      if(sn.sebep === 'sira')
        uyari += kutu('r','Saat aralığı hatalı','Bitiş saati başlangıçtan sonra olmalı.');
      else if(sn.sebep === 'kisa')
        uyari += kutu('r','Süre çok kısa','Saatlik izin en az yarım saat olmalı.');
      else if(sn.sebep === 'erken')
        uyari += kutu('r','Çalışma saatinden önce','Saatlik izin en erken '+calismaBas()+' itibarıyla başlayabilir.');
      else if(sn.sebep === 'gec')
        uyari += kutu('r','Çalışma saatinden sonra','Saatlik izin en geç '+calismaBit()+' itibarıyla biter.');
    }
  }
  if(tur === 'dogumgunu'){
    const dg = dogumGunuUygun(pid, bas, bit);
    const hedefTarih = dogumGunuTarihi(pid, d(bas).getFullYear());
    if(!dg.ok){
      if(dg.sebep === 'dogumyok')
        uyari += kutu('r','Doğum tarihi tanımlı değil',
          'Bu izin için personel kartında doğum tarihi bulunmalı. İnsan Kaynakları ile görüşün.');
      else if(dg.sebep === 'tekgun')
        uyari += kutu('r','Doğum günü izni tek gündür',
          'Yalnızca '+trTarih(hedefTarih)+' günü için tek günlük seçim yapın.');
      else
        uyari += kutu('r','Yalnızca doğum gününüzde kullanılabilir',
          'Bu izin '+trTarih(hedefTarih)+' günü kullanılabilir. Takvimden o günü seçin.');
    }
  }
  if(gecmisTarihMi(bas))
    uyari += kutu('r','Sistem başlangıcından önce',
      'Sistem '+trTarih(sistemBaslangic())+' tarihinde başlıyor. Daha önceki tarihlere izin girilemez.'
      + '<div class="hint" style="margin-top:6px">Geçmiş izinler kişinin dönem başı izin hakkına dahil edilmiştir.</div>');
  if(kendi.length)
    uyari += kutu('r','Bu tarihlerde zaten izin kaydı var',
      cakismaMetni(kendi)
      + '<div class="hint" style="margin-top:6px">Aynı güne ikinci bir talep girilemez. '
      + 'Tarihleri değiştirin ya da mevcut kaydı revize edin.</div>');
  if(ihlal.length){
    const gerekli = grupGerekceGerekli(ihlal);
    const eski = (document.getElementById('f_gerekce') || {}).value || S.gerekceTaslak || '';
    uyari += kutu('b', 'Yedeklilik kuralı aşılıyor',
      grupIhlalMetni(ihlal)
      + (gerekli
        ? '<div class="fld" style="margin-top:10px"><label class="lb">Gerekçe (zorunlu)</label>'
          + '<textarea id="f_gerekce" style="min-height:56px" placeholder="Bu tarihlerin neden zorunlu olduğunu yazın; yöneticiniz buna göre karar verecek."'
          + ' oninput="S.gerekceTaslak=this.value">'+esc(eski)+'</textarea>'
          + '<div class="hint" style="margin-top:4px">Talep normal akışla yöneticinize gider; kural aşımı ve gerekçeniz onay ekranında görünür.</div></div>'
        : '<div class="hint" style="margin-top:6px">Talebiniz gönderilebilir, kararı yöneticiniz verir.</div>'));
  } else S.gerekceTaslak = '';

  const dusenSimdi = dusenGunTutar(tur, gun);          // bu talebin bakiyeden düşecek kısmı
  if(dusenSimdi > b.kalan)
    uyari += kutu('r','Bakiye yetersiz','Bakiyeden düşecek '+sayi(dusenSimdi)+' gün, kullanılabilir bakiye '+sayi(b.kalan)+' gün. Talep yine de gönderilebilir, İK karar verir.');
  if(t.hakGun && gun > t.hakGun)
    uyari += kutu('b','Yasal hak aşılıyor',esc(t.ad)+' için kanuni süre '+t.hakGun+' gün. Aşan '+sayi(gun - t.hakGun)+' gün yıllık izin bakiyesinden düşülür.');
  if(cak.length)
    uyari += kutu('b','Aynı departmanda çakışma', cak.map(c=>esc(adSoyad(c.pid))+' ('+trTarih(c.bas)+' – '+trTarih(c.bit)+')').join(', '));
  if(!saatli && gun === 0)
    uyari += kutu('b','İş günü bulunamadı','Seçilen aralık tamamen hafta sonu veya resmî tatile denk geliyor.');

  const dk = isGunuDokum(bas, bit);
  const dusen = [];
  if(dk.haftaSonu) dusen.push(dk.haftaSonu+' hafta tatili');
  if(dk.tatil) dusen.push(dk.tatil+' resmî tatil');
  if(dk.arife) dusen.push(dk.arife+' arife'+(S.ayar.arifeYarim?' (yarım gün)':''));

  const kalanSonra = b.kalan - dusenSimdi;
  const donus = bit ? sonrakiIsGunu(bit) : '';
  const p = per(pid) || {};
  const onaylayan = p.yonetici ? adSoyad(p.yonetici) : 'İnsan Kaynakları';
  const onayUnvan = p.yonetici ? ((per(p.yonetici) || {}).unvan || '') : 'Yöneticisi tanımlı değil';

  $('#f_ozet').innerHTML =
    '<div class="ozet renkli">'
    + '<div class="ozet-h o-tarih">'
      + '<div class="lb">İşbaşı</div>'
      + (saatli
          ? (saatlikGunSonu($('#f_sbit').value)
              ? '<div class="v-ad">'+(donus ? trTarih(donus)+' · '+calismaBas() : '—')+'</div>'
                + '<div class="s">'+(donus ? GUN_TAM[d(donus).getDay()] : '')+'</div>'
              : '<div class="v-ad">'+esc($('#f_sbit').value || '—')+'</div>'
                + '<div class="s">'+trTarih(bas)+' · aynı gün</div>')
          : '<div class="v-ad">'+(donus ? trTarih(donus) : '—')+'</div>'
            + '<div class="s">'+(donus ? GUN_TAM[d(donus).getDay()] : 'Bitiş tarihini seçin')+'</div>')
    + '</div>'
    + '<div class="ozet-h o-gun">'
      + '<div class="lb">'+(saatli ? 'İzin süresi' : 'İzin günü')+'</div>'
      + (saatli
          ? '<div class="v">'+sayi(saatFark($('#f_sbas').value, $('#f_sbit').value))+'<small>saat</small></div>'
          : '<div class="v">'+sayi(gun)+'<small>gün</small></div>')
      + '<div class="s">'
      + (saatli
          ? trTarih(bas)+' · '+esc($('#f_sbas').value)+' – '+esc($('#f_sbit').value)
          : dk.takvim+' takvim günü' + (dusen.length ? ' · '+dusen.join(', ')+' düşüldü' : ''))
      + '</div>'
    + '</div>'
    + '<div class="ozet-h o-kalan'+(kalanSonra < 0 ? ' eksi' : '')+'">'
      + '<div class="lb">Talep sonrası kalan</div>'
      + '<div class="v">'+sayi(kalanSonra)+'<small>gün</small></div>'
      + '<div class="s">'
      + (saatli
          ? sayi(b.gunSaat)+' saat = 1 gün · biriken '+sayi(b.saatlikToplam)+' saat'
          : t.yillikDus
              ? 'Şu anki bakiye '+sayi(b.kalan)+' gün'
              : (dusenSimdi > 0
                  ? 'Aşan '+sayi(dusenSimdi)+' gün bakiyeden düşer · şu an '+sayi(b.kalan)+' gün'
                  : esc(t.ad)+' bakiyeden düşmez'))
      + '</div>'
    + '</div>'
    + '<div class="ozet-h o-onay">'
      + '<div class="lb">Onay verecek kişi</div>'
      + '<div class="v-ad">'+esc(onaylayan)+'</div>'
      + '<div class="s">'+esc(onayUnvan)+'</div>'
    + '</div>'
    + '</div>';

  $('#f_uyari').innerHTML = uyari;
}
function kutu(tip, baslik, metin){
  const c = tip==='r' ? 'border-color:var(--red-line);background:var(--red-soft)' : 'border-color:var(--bekle-line);background:var(--bekle-soft)';
  return '<div class="card mt" style="box-shadow:none;'+c+'"><div class="bd" style="padding:11px 14px"><b style="font-size:13px">'+baslik+'</b><div class="hint" style="margin-top:2px">'+metin+'</div></div></div>';
}

/* İzin bitiş tarihine kadar kazanılacak hak ediş dahil projeksiyon bakiye.
   haricId: hariç tutulacak kayıt (revizede kendisi). ekGun: eklenmek istenen yeni izin (gün). */
function projeksiyonBakiye(pid, bit, haricId, ekGun){
  const p = per(pid) || {};
  const bt = bakiyeTarihi(pid);
  const devir = Number(p.devir || 0);
  const gunSaat = gunlukCalismaSaati();
  let kullanim = 0;
  for(const i of S.izin){
    if(i.pid !== pid || i.id === haricId) continue;
    if(!(GECERLI.includes(i.durum) || BEKLEYEN.includes(i.durum))) continue;
    if(i.bas < bt || i.bas > bit) continue;                 // devir öncesi ve izin bitişinden sonrası hariç
    kullanim += saatliIzin(i) ? (i.saat || 0) / gunSaat : dusenGun(i);   // düşmeyen türlerde yalnız aşan kısım
  }
  const kazanim = hakEdisler(pid, bit).reduce((a, x) => a + x.gun, 0);
  return devir + kazanim - kullanim - (ekGun || 0);
}
/* Eksiye düşme sınırı kontrolü — geçerse null, aşarsa uyarı metni döner */
function eksiSinirUyari(pid, tur, bit, ekGun, haricId){
  if(!S.ayar.eksiKuraliAktif) return null;                  // kural kapalıyken hiç uygulanmaz
  const t = turBul(tur);
  // Bu talebin bakiyeden düşecek kısmı (düşmeyen türlerde yalnız yasal hakkı aşan gün)
  const ekDusen = t.yillikDus ? (ekGun || 0)
                : (t.hakGun && (ekGun || 0) > t.hakGun ? (ekGun - t.hakGun) : 0);
  if(ekDusen <= 0) return null;                             // hiç düşmüyorsa sınır uygulanmaz
  const sinir = Math.max(0, Number(S.ayar.eksiSiniri) || 0);
  const proj = projeksiyonBakiye(pid, bit, haricId || null, ekDusen);
  if(proj >= -sinir - 1e-9) return null;
  return adSoyad(pid)+' için bu izin bakiyeyi '+sayi(Math.round((-proj)*10)/10)+' gün eksiye düşürüyor; '
    + (sinir > 0 ? 'izin verilen eksi sınırı '+sayi(sinir)+' gün.' : 'eksiye izin verilmiyor.')
    + ' (İzin bitişine kadar kazanılacak hak ediş hesaba katıldı.)';
}

function izinKaydet(){
  const pid = $('#f_pid').value, tur = $('#f_tur').value;
  const saatli = saatliTur(tur);
  const bas = tarihAl('f_bas');
  const bit = saatli ? bas : tarihAl('f_bit');
  const sbas = saatli ? $('#f_sbas').value : '';
  const sbit = saatli ? $('#f_sbit').value : '';
  const saat = saatli ? saatFark(sbas, sbit) : 0;
  const gun = saatli ? 0 : isGunu(bas, bit);
  if(!bas || !bit){ bildir(saatli ? 'Tarih seçin.' : 'Tarih aralığını seçin.'); return; }
  if(saatli){
    const sn = saatlikSinirlar(sbas, sbit);
    if(!sn.ok){
      bildir(sn.sebep === 'sira' ? 'Bitiş saati başlangıçtan sonra olmalı.'
        : sn.sebep === 'kisa' ? 'Saatlik izin en az yarım saat olmalı.'
        : sn.sebep === 'erken' ? 'Saatlik izin en erken '+calismaBas()+' itibarıyla başlayabilir.'
        : sn.sebep === 'gec' ? 'Saatlik izin en geç '+calismaBit()+' itibarıyla biter.'
        : 'Saat aralığını girin.');
      return;
    }
  }
  if(!saatli && gun === 0){ bildir('Seçilen aralıkta iş günü yok.'); return; }
  if(gecmisTarihMi(bas)){
    bildir(trTarih(sistemBaslangic())+' tarihinden önceye izin girilemez.');
    return;
  }
  if(cikisSonrasiMi(pid, bit)){
    bildir(adSoyad(pid)+' işten çıkış tarihinden ('+trTarih(per(pid).cikis)+') sonrasına izin girilemez.');
    return;
  }
  if(tur === 'dogumgunu'){
    const dg = dogumGunuUygun(pid, bas, bit);
    if(!dg.ok){
      const hedef = dogumGunuTarihi(pid, d(bas).getFullYear());
      bildir(dg.sebep === 'dogumyok'
        ? 'Personel kartında doğum tarihi tanımlı değil.'
        : dg.sebep === 'tekgun'
          ? 'Doğum günü izni tek gün olmalıdır: '+trTarih(hedef)
          : 'Doğum günü izni yalnızca '+trTarih(hedef)+' günü kullanılabilir.');
      return;
    }
  }
  const kendi = kendiCakismasi(pid, bas, bit, null);
  if(kendi.length){
    bildir(adSoyad(pid)+' için '+trTarih(kendi[0].bas)+' – '+trTarih(kendi[0].bit)+' tarihlerinde kayıt var, çakışıyor.');
    return;
  }
  const eksiUyari = eksiSinirUyari(pid, tur, bit, saatli ? (saat / gunlukCalismaSaati()) : gun, null);
  if(eksiUyari){ bildir(eksiUyari); return; }
  const ihlal = grupIhlali(pid, bas, bit, null);
  const gerekceEl = document.getElementById('f_gerekce');
  const gerekce = gerekceEl ? gerekceEl.value.trim() : '';
  if(grupGerekceGerekli(ihlal) && !gerekce){
    bildir('Yedeklilik kuralı aşılıyor. Gerekçe yazmadan talep gönderilemez.');
    if(gerekceEl) gerekceEl.focus();
    return;
  }
  const grupNot = ihlal.length ? grupNotMetni(ihlal) : '';
  const yonetici = per(pid)?.yonetici;
  // Talebi giren bu kişinin onaylayıcısı ise (kendisi değil) doğrudan onaylanır; aksi halde onaya düşer.
  const onayciGirdi = pid !== S.aktifId && (yonetici === S.aktifId || (ikMi() && !yonetici));
  const ilkDurum = onayciGirdi ? 'onaylandi' : 'yonetici_bekliyor';
  const gecmis = onayciGirdi
    ? [{rol:'Yönetici', kisi:adSoyad(S.aktifId), karar:'Onaylandı', tarih:bugun(), not:'Personel adına yönetici tarafından girildi ve onaylandı'}]
    : [];
  S.izin.push({id:yeniId('i'), pid, tur, bas, bit, gun,
    saatBas:sbas, saatBit:sbit, saat,
    aciklama:$('#f_ack').value.trim(),
    durum:ilkDurum, olusturma:bugun(), gecmis, grupNot, grupGerekce:gerekce});
  S.gerekceTaslak = '';
  kaydet(); modalKapat();
  bildir(onayciGirdi
    ? adSoyad(pid)+' için izin girildi ve onaylandı.'
    : (saatli ? sayi(saat)+' saatlik izin talebi gönderildi. ' : 'İzin talebi gönderildi. ')
      + (yonetici ? adSoyad(yonetici)+' onayına düştü.' : 'İK onayına düştü.')
      + (grupNot ? ' Kural aşımı' + (gerekce ? ' ve gerekçeniz' : '') + ' onay ekranında görünecek.' : ''));
}

/* Fazla mesai, ayarlardaki çalışma bitiş saatinde başlar */
function mesaiVarsayilanBas(){ return S.ayar.isBitis || '18:00'; }
function saatEkle(saat, ekSaat){
  const [h,m] = (saat||'18:00').split(':').map(Number);
  const dk = ((h*60 + m + ekSaat*60) % (24*60) + 24*60) % (24*60);
  return String(Math.floor(dk/60)).padStart(2,'0')+':'+String(dk%60).padStart(2,'0');
}

/* ---- Mesai saati: yarım saatlik açılır menü (başlangıç / bitiş) ---- */
function mesaiSaatSecenekleri(){
  const bas = mesaiVarsayilanBas();          // normal çalışma bitişi (ör. 18:00)
  const arr = [];
  for(let i = 0; i <= 16; i++) arr.push(saatEkle(bas, i * 0.5));   // 8 saat, 30 dk adım
  return arr;
}
function mesaiSaatSecici(id, secili){
  return '<select id="'+id+'" onchange="mesaiHesapla()">'
    + mesaiSaatSecenekleri().map(t => '<option'+(t===secili?' selected':'')+'>'+t+'</option>').join('')
    + '</select>';
}

/* ---- Mesai form-içi tek gün takvimi (izin talebindeki takvimle aynı) ---- */
function mtakvimAc(){
  if(S.mTakvimAcik){ S.mTakvimAcik = false; mtakvimCiz(); return; }
  const iso = trToIso((document.getElementById('m_tarih')||{}).value) || bugun();
  S.mTakvimYil = yilSinirla(d(iso).getFullYear());
  S.mTakvimAy  = d(iso).getMonth();
  S.mTakvimAcik = true;
  mtakvimCiz();
}
function mtakvimKapat(){ S.mTakvimAcik = false; mtakvimCiz(); }
function mtakvimAyDegis(n){
  let ay = (S.mTakvimAy||0)+n, yil = S.mTakvimYil || new Date().getFullYear();
  while(ay<0){ ay+=12; yil--; } while(ay>11){ ay-=12; yil++; }
  if(yil < ilkYil()){ yil = ilkYil(); ay = 0; }
  S.mTakvimAy = ay; S.mTakvimYil = yil; mtakvimCiz();
}
function mtakvimGunSec(t){
  const pid = (document.getElementById('m_pid')||{}).value || S.aktifId;
  if(gecmisTarihMi(t)){ bildir(trTarih(sistemBaslangic())+' tarihinden önceye mesai girilemez.'); return; }
  if(cikisSonrasiMi(pid, t)){ bildir('İşten çıkış tarihinden ('+trTarih(per(pid).cikis)+') sonrasına mesai girilemez.'); return; }
  document.getElementById('m_tarih').value = isoToTr(t);
  const yaz = document.getElementById('m_tarihyazi'); if(yaz) yaz.textContent = trTarih(t);
  S.mTakvimAcik = false;
  mtakvimCiz();
  mesaiHesapla();
}
function mtakvimCiz(){
  const el = document.getElementById('m_takvim'); if(!el) return;
  if(!S.mTakvimAcik){ el.innerHTML = ''; return; }
  const yil = S.mTakvimYil, ay = S.mTakvimAy;
  const secili = trToIso((document.getElementById('m_tarih')||{}).value);
  const pid = (document.getElementById('m_pid')||{}).value || S.aktifId;
  const gunSayisi = new Date(yil, ay+1, 0).getDate();
  const bosluk = (new Date(yil, ay, 1).getDay() + 6) % 7;
  const bugunS = bugun();
  let hucre = '';
  for(let i=0;i<bosluk;i++) hucre += '<div class="fb"></div>';
  for(let g=1; g<=gunSayisi; g++){
    const dt = new Date(yil, ay, g), t = iso(dt);
    const tat = tatilBul(t), we = !S.ayar.calismaGunleri.includes(dt.getDay());
    const gecmis = gecmisTarihMi(t), cikisSonra = cikisSonrasiMi(pid, t);
    const secilemez = gecmis || cikisSonra;
    let c = 'fg';
    if(tat) c+=' ft'; else if(we) c+=' fw';
    if(secilemez) c+=' fpas';
    if(t===secili) c+=' fuc';
    if(t===bugunS) c+=' fbugun';
    const ip = gecmis ? trTarih(t)+' · sistem başlangıcından önce'
      : cikisSonra ? trTarih(t)+' · işten çıkış tarihinden sonra'
      : trTarih(t)+(tat?' · '+tat.ad:we?' · hafta tatili':'');
    hucre += '<div class="'+c+'" title="'+esc(ip)+'"'+(secilemez?'':' onclick="mtakvimGunSec(\''+t+'\')"')+'>'+g+'</div>';
  }
  el.innerHTML = '<div class="ftak mt">'
    + '<div class="fth"><button type="button" onclick="mtakvimAyDegis(-1)"'
      + ((yil<ilkYil()||(yil===ilkYil()&&ay===0))?' disabled':'')+'>‹</button>'
    + '<b>'+AY[ay]+' '+yil+'</b>'
    + '<button type="button" onclick="mtakvimAyDegis(1)">›</button>'
    + '<span class="hint">Mesai gününü seçin</span>'
    + '<button type="button" class="fkapat" title="Kapat" onclick="mtakvimKapat()">×</button></div>'
    + '<div class="fgun">'+['Pt','Sa','Ça','Pe','Cu','Ct','Pa'].map(x=>'<div class="fgb">'+x+'</div>').join('')+'</div>'
    + '<div class="fgun">'+hucre+'</div></div>';
}

/* Mesai türü tarihten belirlenir — kullanıcı seçmez */
function mesaiTurTespit(t){
  if(!t) return 'fazla';
  if(tatilBul(t)) return 'resmi';
  if(!S.ayar.calismaGunleri.includes(d(t).getDay())) return 'hafta';
  return 'fazla';
}

function mesaiSure(){
  return saatFark($('#m_bas').value, $('#m_bit').value);
}
function mesaiHesapla(){
  const sure = mesaiSure();
  const tarih = tarihAl('m_tarih') || bugun();
  const t = mturBul(mesaiTurTespit(tarih)), kar = 'ucret';
  const bilgi = document.getElementById('m_turbilgi');
  const sa = saatlikUcret($('#m_pid').value);
  if(bilgi) bilgi.innerHTML = '<div class="mozet">'
    + '<div class="mo-sol"><div class="lb">Mesai türü</div>'
    + '<div class="mo-ad">'+esc(t.ad)+'</div>'
    + '<div class="s">Tarihe göre belirlendi · çarpan ×'+t.carpan.toFixed(2).replace('.',',')+'</div></div>'
    + '<div class="mo-sag"><div class="lb">Hak edilen tutar</div>'
    + '<div class="mo-tutar">'+sayi(sure * t.carpan * sa)+'<small>₺</small></div>'
    + '<div class="s mono">'+sayi(sa)+' ₺ × '+sayi(sure)+' sa × '+t.carpan.toFixed(2).replace('.',',')+'</div></div>'
    + '</div>';
  const oz = mesaiOzet($('#m_pid').value, S.yil);
  const tat = tatilBul(tarih), hs = !S.ayar.calismaGunleri.includes(d(tarih).getDay());
  let uyari = '';
  if(gecmisTarihMi(tarih))
    uyari += kutu('r','Sistem başlangıcından önce',
      'Sistem '+trTarih(sistemBaslangic())+' tarihinde başlıyor. Daha önceki tarihlere mesai kaydı girilemez.');
  if(oz.saat + sure > S.ayar.yillikMesaiSiniri) uyari += kutu('r','Yıllık sınır aşılıyor','Bu kayıtla '+sayi(oz.saat+sure)+' saate ulaşılıyor. Yasal sınır '+S.ayar.yillikMesaiSiniri+' saat.');
  const cak = mesaiCakismasi($('#m_pid').value, tarih, $('#m_bas').value, $('#m_bit').value, null);
  if(cak.length) uyari += kutu('r','Bu saatlerde zaten mesai kaydı var',
    'Aynı saat aralığına ikinci kayıt girilemez:<br>'+mesaiCakismaMetni(cak));

  $('#m_ozet').innerHTML = uyari;
}
function mesaiKaydet(){
  const sure = mesaiSure();
  if(sure <= 0){ bildir('Saat aralığı geçersiz.'); return; }
  const pid = $('#m_pid').value;
  if(!mesaiGirebilir(pid)){
    bildir(mesaiAcik(pid) ? 'Bu kişi adına mesai kaydı giremezsiniz.'
                          : adSoyad(pid)+' için mesai girişi kapalı.');
    return;
  }
  const yonetici = per(pid)?.yonetici;
  const mTarih = tarihAl('m_tarih');
  if(!mTarih){ bildir('Tarihi GG.AA.YYYY biçiminde girin.'); return; }
  if(gecmisTarihMi(mTarih)){
    bildir(trTarih(sistemBaslangic())+' tarihinden önceye mesai kaydı girilemez.');
    return;
  }
  if(mesaiCakismasi(pid, mTarih, $('#m_bas').value, $('#m_bit').value, null).length){
    bildir('Bu saatlerde zaten mesai kaydı var.');
    return;
  }
  S.mesai.push({id:yeniId('m'), pid, tarih:mTarih, bas:$('#m_bas').value, bit:$('#m_bit').value,
    sure, tur:mesaiTurTespit(mTarih), karsilik:'ucret', aciklama:$('#m_ack').value.trim(),
    durum: yonetici ? 'yonetici_bekliyor' : 'onaylandi', gecmis:[]});
  kaydet(); modalKapat(); bildir('Mesai kaydı gönderildi.');
}

/* Onay verirken: talebin tarih aralığında departmanda kim izinli, kim çalışıyor */
function departmanDurumuHtml(i){
  const p = per(i.pid); if(!p) return '';
  const uyeler = S.personel.filter(x => x.aktif && x.dept === p.dept);
  const cak = cakisan(i.pid, i.bas, i.bit, i.id);        // aynı departman, o aralıkta izinli/bekleyen
  const izinliMap = {};
  cak.forEach(c => { if(!izinliMap[c.pid]) izinliMap[c.pid] = c; });
  const izinliler = [], calisanlar = [];
  for(const u of uyeler){
    if(u.id === i.pid) continue;                          // talep sahibi ayrıca gösterilir
    (izinliMap[u.id] ? izinliler : calisanlar).push(u);
  }
  const toplamUye = uyeler.length, toplamIzinli = izinliler.length + 1;   // +1: talep sahibi
  const izsatir = (adHtml, iz) => '<div style="padding:3px 0;font-size:12.5px">'+adHtml
    + (iz ? ' <span class="hint">· '+esc(turBul(iz.tur).ad)+' · '+trTarih(iz.bas)+' – '+trTarih(iz.bit)
            + (BEKLEYEN.includes(iz.durum) ? ' · onay bekliyor' : '') + '</span>' : '') + '</div>';

/* ---- Revize modalı: izin talebindeki gibi tıkla-seç takvim ---- */
function revizeTurDegisti(){
  if(saatliTur($('#rv_tur').value)){
    const b = tarihAl('rv_bas');
    if(b) $('#rv_bit').value = isoToTr(b);
    if(S.revAcik === 'rv_bit') S.revAcik = 'rv_bas';
  }
  revizeHesapla();
}
function revizeTakvimAc(id){
  if(S.revAcik === id){ S.revAcik = ''; revizeTakvimCiz(); return; }
  S.revAcik = id;
  const mevcut = tarihAl(id) || tarihAl('rv_bas') || bugun();
  S.revYil = yilSinirla(d(mevcut).getFullYear());
  S.revAy  = d(mevcut).getMonth();
  revizeTakvimCiz();
}
function revizeTakvimKapat(){ S.revAcik = ''; revizeTakvimCiz(); }
function revizeAyDegis(n){
  let ay = (S.revAy || 0) + n, yil = S.revYil || new Date().getFullYear();
  while(ay < 0){ ay += 12; yil--; }
  while(ay > 11){ ay -= 12; yil++; }
  if(yil < ilkYil()){ yil = ilkYil(); ay = 0; }
  S.revAy = ay; S.revYil = yil;
  revizeTakvimCiz();
}
function revizeGunSec(t){
  const pid = S.revizePid;
  if(gecmisTarihMi(t)){ bildir(trTarih(sistemBaslangic())+' tarihinden önceye izin girilemez.'); return; }
  if(kendiCakismasi(pid, t, t, S.revizeId).length){ bildir(trTarih(t)+' tarihinde başka bir izin kaydı var.'); return; }

  if(saatliTur($('#rv_tur').value)){          // saatlik izin tek gün
    $('#rv_bas').value = isoToTr(t);
    $('#rv_bit').value = isoToTr(t);
    S.revAcik = '';
    revizeHesapla();
    return;
  }
  const hedef = S.revAcik || 'rv_bas';
  const bas = tarihAl('rv_bas'), bit = tarihAl('rv_bit');
  if(hedef === 'rv_bit'){
    if(bas && t < bas){ bildir('Bitiş, başlangıçtan önce olamaz.'); return; }
    if(bas && kendiCakismasi(pid, bas, t, S.revizeId).length){ bildir('Seçtiğiniz aralık başka bir izinle çakışıyor.'); return; }
    $('#rv_bit').value = isoToTr(t);
    S.revAcik = '';
  } else {
    $('#rv_bas').value = isoToTr(t);
    if(!bit || bit < t) $('#rv_bit').value = '';
    S.revAcik = 'rv_bit';
  }
  revizeHesapla();
}
function revizeTakvimCiz(){
  const el = document.getElementById('rv_takvim');
  if(!el) return;
  if(!S.revAcik){ el.innerHTML = ''; return; }
  const pid = S.revizePid;
  const yil = S.revYil, ay = S.revAy;
  const bas = tarihAl('rv_bas'), bit = tarihAl('rv_bit');
  const gunSayisi = new Date(yil, ay + 1, 0).getDate();
  const bosluk = (new Date(yil, ay, 1).getDay() + 6) % 7;
  const bugunS = bugun();
  let hucre = '';
  for(let i = 0; i < bosluk; i++) hucre += '<div class="fb"></div>';
  for(let g = 1; g <= gunSayisi; g++){
    const dt = new Date(yil, ay, g), t = iso(dt);
    const tat = tatilBul(t);
    const we = !S.ayar.calismaGunleri.includes(dt.getDay());
    const iz = kendiCakismasi(pid, t, t, S.revizeId)[0];
    const gecmis = gecmisTarihMi(t);
    const secilemez = !!iz || gecmis;
    let c = 'fg';
    if(tat) c += ' ft'; else if(we) c += ' fw';
    if(iz) c += ' fizin';
    if(gecmis) c += ' fpas';
    if(bas && bit && t >= bas && t <= bit) c += ' fara';
    if(t === bas || (t === bit && bit)) c += ' fuc';
    if(t === bugunS) c += ' fbugun';
    const ip = iz ? trTarih(t)+' · zaten izinli: '+turBul(iz.tur).ad+' ('+DURUM_AD[iz.durum]+')'
      : gecmis ? trTarih(t)+' · sistem başlangıcından önce'
      : trTarih(t)+(tat ? ' · '+tat.ad+', izinden düşmez' : we ? ' · hafta tatili, izinden düşmez' : '');
    hucre += '<div class="'+c+'" title="'+esc(ip)+'"'
      + (secilemez ? '' : ' onclick="revizeGunSec(\''+t+'\')"')+'>'+g+'</div>';
  }
  el.innerHTML = '<div class="ftak mt">'
    + '<div class="fth"><button type="button" onclick="revizeAyDegis(-1)"'
      + ((yil < ilkYil() || (yil === ilkYil() && ay === 0)) ? ' disabled' : '')+'>‹</button>'
    + '<b>'+AY[ay]+' '+yil+'</b>'
    + '<button type="button" onclick="revizeAyDegis(1)">›</button>'
    + '<span class="hint">'+(saatliTur($('#rv_tur').value) ? 'Günü seçin'
        : S.revAcik === 'rv_bit' ? 'Bitiş gününü seçin' : 'Başlangıç gününü seçin')+'</span>'
    + '<button type="button" class="fkapat" title="Kapat" onclick="revizeTakvimKapat()">×</button></div>'
    + '<div class="fgun">'+['Pt','Sa','Ça','Pe','Cu','Ct','Pa'].map(x=>'<div class="fgb">'+x+'</div>').join('')+'</div>'
    + '<div class="fgun">'+hucre+'</div>'
    + '<div class="fleg"><span><i class="fs fizin"></i>İzinli gün</span>'
    + '<span><i class="fs fw"></i>Hafta tatili</span><span><i class="fs ft"></i>Resmî tatil</span></div>'
    + '</div>';
}

function revizeHesapla(){
  const el = document.getElementById('rv_ozet'); if(!el) return;
  // tarih düğmesi etiketi + takvim tazele
  const tb = document.getElementById('rv_tarihyazi');
  if(tb){
    const b0 = tarihAl('rv_bas'), s0 = tarihAl('rv_bit');
    tb.textContent = (b0 && s0) ? trTarih(b0)+' – '+trTarih(s0) : b0 ? trTarih(b0)+' – …' : 'Takvimden seçin';
    const btn = document.getElementById('rv_tarihbtn');
    if(btn){ if(b0 && s0) btn.classList.add('dolu'); else btn.classList.remove('dolu'); }
  }
  revizeTakvimCiz();
  const bas = tarihAl('rv_bas'), bit = tarihAl('rv_bit');
  const gun = isGunu(bas, bit);
  const donus = bit ? sonrakiIsGunu(bit) : '';
  const cak = S.revizeId ? kendiCakismasi(S.revizePid, bas, bit, S.revizeId) : [];
  el.innerHTML = (cak.length
      ? '<div class="card" style="box-shadow:none;border-color:var(--red-line);background:var(--red-soft);margin-bottom:10px">'
        + '<div class="bd" style="padding:10px 13px"><b style="font-size:13px">Başka bir izinle çakışıyor</b>'
        + '<div class="hint" style="margin-top:3px">'+cakismaMetni(cak)+'</div></div></div>'
      : '')
    + '<div class="ozet"><div class="ozet-h">'
    + '<div class="lb">Yeni izin günü</div><div class="v">'+sayi(gun)+'<small>gün</small></div>'
    + '<div class="s">'+(bas && bit ? trTarih(bas)+' – '+trTarih(bit) : 'Tarih girilmedi')+'</div></div>'
    + '<div class="ozet-h don"><div class="lb">İşe başlama</div>'
    + '<div class="v-ad">'+(donus ? trTarih(donus) : '—')+'</div>'
    + '<div class="s">'+(donus ? GUN_TAM[d(donus).getDay()] : 'Bitiş tarihi girilmedi')+'</div></div></div>';

  /* eski hâl – yeni hâl karşılaştırması */
  const kel = document.getElementById('rv_kiyas');
  const eski = S.izin.find(x => x.id === S.revizeId);
  if(kel && eski){
    const yeniTur = (document.getElementById('rv_tur') || {}).value || eski.tur;
    const satir = (ad, a, b) => {
      const degisti = String(a) !== String(b);
      return '<tr'+(degisti ? ' class="degisti"' : '')+'><th>'+ad+'</th>'
        + '<td class="eskideger">'+a+'</td>'
        + '<td class="yenideger">'+(degisti ? '<b>'+b+'</b>' : '<span class="hint">değişmedi</span>')+'</td></tr>';
    };
    kel.innerHTML = '<table class="dtbl kiyas"><thead><tr><th></th>'
      + '<th>Eski hâli</th><th>Yeni hâli</th></tr></thead><tbody>'
      + satir('İzin türü', esc(turBul(eski.tur).ad), esc(turBul(yeniTur).ad))
      + satir('Başlangıç', trTarih(eski.bas), bas ? trTarih(bas) : '—')
      + satir('Bitiş', trTarih(eski.bit), bit ? trTarih(bit) : '—')
      + satir('Gün', sayi(eski.gun)+' gün', sayi(gun)+' gün')
      + satir('İşe başlama', trTarih(sonrakiIsGunu(eski.bit)), donus ? trTarih(donus) : '—')
      + '</tbody></table>';
  }
}

function izinRevizeKaydet(id){
  const i = S.izin.find(x=>x.id===id); if(!i) return;
  const bas = tarihAl('rv_bas'), bit = tarihAl('rv_bit'), tur = document.getElementById('rv_tur').value;
  const notu = (document.getElementById('rv_not').value || '').trim();
  if(!bas || !bit){ bildir('Tarihleri GG.AA.YYYY biçiminde girin.'); return; }
  if(gecmisTarihMi(bas)){ bildir(trTarih(sistemBaslangic())+' tarihinden önceye izin girilemez.'); return; }
  if(cikisSonrasiMi(i.pid, bit)){ bildir('İşten çıkış tarihinden ('+trTarih(per(i.pid).cikis)+') sonrasına izin girilemez.'); return; }
  const gun = isGunu(bas, bit);
  if(gun === 0){ bildir('Seçilen aralıkta iş günü yok.'); return; }
  if(bas === i.bas && bit === i.bit && tur === i.tur){ bildir('Değişiklik yapılmadı.'); return; }
  const cak = kendiCakismasi(i.pid, bas, bit, i.id);
  if(cak.length){
    bildir(trTarih(cak[0].bas)+' – '+trTarih(cak[0].bit)+' tarihlerindeki kayıtla çakışıyor.');
    return;
  }
  const eksiUyari = eksiSinirUyari(i.pid, tur, bit, saatliTur(tur) ? ((i.saat||0)/gunlukCalismaSaati()) : gun, i.id);
  if(eksiUyari){ bildir(eksiUyari); return; }
  if(!notu){ bildir('Revize gerekçesi yazın.'); return; }

  const eski = turBul(i.tur).ad + ' · ' + trTarih(i.bas) + ' – ' + trTarih(i.bit) + ' · ' + sayi(i.gun) + ' gün';
  const yeni = turBul(tur).ad + ' · ' + trTarih(bas) + ' – ' + trTarih(bit) + ' · ' + sayi(gun) + ' gün';
  // Revizeyi yapan, bu talebin onaylayıcısı mı? (öyleyse revize onay yerine geçer; yeniden onaya düşürmek mantıksız)
  const onayciRevize = (per(i.pid)?.yonetici === S.aktifId) || (ikMi() && !per(i.pid)?.yonetici);

  i.gecmis.push({rol:'Revize', kisi:adSoyad(S.aktifId), karar:'Değiştirildi', tarih:bugun(),
    eski: eski, yeni: yeni, gerekce: notu,
    not: eski + '  →  ' + yeni + (notu ? ' · ' + notu : '')});   // not: eski render'lar için korunur
  i.tur = tur; i.bas = bas; i.bit = bit; i.gun = gun;
  i.revizeNot = notu;
  i.revizeEden = adSoyad(S.aktifId);
  i.revizeTarih = bugun();

  if(onayciRevize){
    i.durum = 'onaylandi';          // revizeyi yapan onaylayıcı; ayrıca onay satırı eklenmez (revize kaydı yeterli)
    i.revizeliOnay = true;          // talep sahibi "revize edilip onaylandı" bilgisini net görsün
    i.revizeGoruldu = false;        // sahibi görene kadar bilgilendirme kalsın
  } else {
    i.durum = 'yonetici_bekliyor';  // talep sahibinin kendi revizesi → yönetici onayına düşer
    i.revizeliOnay = false;
  }

  const kisi = S.revizeKisi;
  S.kayitKisi = kisi || null; S.revizeKisi = null;
  kaydet();
  if(kisi) kisiKayitlariCiz(); else modalKapat();
  bildir(onayciRevize ? 'Revize kaydedildi ve onaylandı. Talep sahibi revize edildiğini görecek.'
                      : 'Revize kaydedildi, yönetici onayına düştü.');
}

function mesaiRevizeKaydet(id){
  const m = S.mesai.find(x=>x.id===id); if(!m) return;
  const tarih = tarihAl('rm_tarih'), bas = $('#rm_bas').value, bit = $('#rm_bit').value;
  const tur = mesaiTurTespit(tarih), kar = 'ucret';
  const notu = ($('#rm_not').value || '').trim();
  if(!tarih){ bildir('Tarihi GG.AA.YYYY biçiminde girin.'); return; }
  if(gecmisTarihMi(tarih)){ bildir(trTarih(sistemBaslangic())+' tarihinden önceye mesai girilemez.'); return; }
  const sure = saatFark(bas, bit);
  if(sure <= 0){ bildir('Bitiş saati başlangıçtan sonra olmalı.'); return; }
  if(mesaiCakismasi(m.pid, tarih, bas, bit, id).length){
    bildir('Bu saatlerde zaten başka bir mesai kaydı var.'); return;
  }
  if(tarih === m.tarih && bas === m.bas && bit === m.bit && tur === m.tur && kar === m.karsilik){
    bildir('Değişiklik yapılmadı.'); return;
  }
  if(!notu){ bildir('Revize gerekçesi yazın.'); return; }

  const eski = trTarih(m.tarih)+' '+m.bas+'–'+m.bit+' · '+sayi(m.sure)+' saat · '+mturBul(m.tur).ad;
  const yeni = trTarih(tarih)+' '+bas+'–'+bit+' · '+sayi(sure)+' saat · '+mturBul(tur).ad;
  const onceki = m.durum;

  m.gecmis.push({rol:'Revize', kisi:adSoyad(S.aktifId), karar:'Değiştirildi', tarih:bugun(),
    eski: eski, yeni: yeni, gerekce: notu,
    not: eski + '  →  ' + yeni + ' · ' + notu});
  m.tarih = tarih; m.bas = bas; m.bit = bit; m.sure = sure; m.tur = tur; m.karsilik = kar;
  m.durum = 'yonetici_bekliyor';

  const kisi = S.revizeKisi;
  S.kayitKisi = kisi || null; S.revizeKisi = null;
  kaydet();
  if(kisi) kisiKayitlariCiz(); else modalKapat();
  bildir(onceki === 'onaylandi' ? 'Revize kaydedildi, yeniden yönetici onayına düştü.' : 'Kayıt güncellendi.');
}

    + '</div></div><div class="bd flush">';
  if(!k.izinler.length) h += '<div class="empty"><div class="e1">Bekleyen izin talebi yok</div>Ekibinizden gelen talepler burada görünür.</div>';
  else h += '<div class="twpair">'+ustCubuk()+'<div class="tw"><table class="ptbl"><thead><tr><th>Personel</th><th>Tür</th><th>Tarih aralığı</th><th>İşe başlama</th><th class="num">Gün</th><th>Durum</th><th class="str">İşlem</th></tr></thead><tbody>'
    + k.izinler.sort((a,b)=>a.bas.localeCompare(b.bas)).map(i=>izinSatiri(i,true)).join('') + '</tbody></table></div></div>';
  h += '</div></div>';

  h += '<div class="card"><div class="hd"><h3>Mesai kayıtları</h3>'
    + '<div class="sp"><span class="hint">'+k.mesailer.length+' kayıt</span>'
    + (k.mesailer.length > 1 ? '<button class="btn sm ok" onclick="topluOnay(\'mesai\')">Tümünü onayla</button>' : '')
    + '</div></div><div class="bd flush">';
  if(!k.mesailer.length) h += '<div class="empty"><div class="e1">Bekleyen mesai kaydı yok</div>Onaya düşen mesailer burada listelenir.</div>';
  else h += '<div class="twpair">'+ustCubuk()+'<div class="tw"><table class="ptbl"><thead><tr><th>Personel</th><th>Tarih</th><th>Saat</th><th>Hesaplama</th><th class="num">Tutar</th><th>Durum</th><th class="str">İşlem</th></tr></thead><tbody>'
    + k.mesailer.sort((a,b)=>a.tarih.localeCompare(b.tarih)).map(m=>mesaiSatiri(m,true)).join('') + '</tbody></table></div></div>';
  h += '</div></div>';
  return h;
}


/* Onay kuyruğundaki tüm kayıtları tek işlemde onaylar */
function topluOnay(tip){
  const k = onayKuyrugu();
  const liste = tip === 'izin' ? k.izinler : k.mesailer;
  if(!liste.length) return;
  const ad = tip === 'izin' ? 'izin talebi' : 'mesai kaydı';
  onayIste('Tümünü onayla',
    liste.length + ' ' + ad + ' onaylanacak.\n\n'
    + liste.slice(0,10).map(x => '· ' + esc(adSoyad(x.pid)) + ' — '
        + (tip === 'izin' ? trTarih(x.bas)+' – '+trTarih(x.bit) : trTarih(x.tarih)+' · '+sayi(x.sure)+' saat')).join('\n')
    + (liste.length > 10 ? '\n· ve ' + (liste.length - 10) + ' kayıt daha' : ''),
    'Hepsini onayla',
    () => {
      let n = 0;
      for(const x of [...liste]){
        const varMi = tip === 'izin' ? izinKararVerebilir(x) : mesaiKararVerebilir(x);
        if(!varMi) continue;
        const rol = 'Yönetici';
        x.gecmis.push({rol, kisi:adSoyad(S.aktifId), karar:'Onaylandı', tarih:bugun(), not:'Toplu onay'});
        x.durum = 'onaylandi';
        n++;
      }
      kaydet();
      bildir(n + ' kayıt onaylandı.');
    });
}

let takvimFiltre = {dept:[], altdept:[], lok:[], kuruldu:'', sadeceIzinli:true};

/* İzin takvimi filtre seçenekleri (çoklu seçim) — render ile handler aynı sırayı kullanır */
function takvimDeptOps(){ return [...new Set(S.personel.filter(p=>p.aktif).map(p=>p.dept).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'tr')); }
function takvimLokOps(){ return [...new Set(S.personel.filter(p=>p.aktif).map(p=>p.lokasyon).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'tr')); }
function takvimAltOps(){ return [...new Set(S.personel.filter(p=>p.aktif && (!takvimFiltre.dept.length || takvimFiltre.dept.includes(p.dept))).map(p=>p.altDept).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'tr')); }
function takvimCokSec(alan, ops, i){
  if(i === null){ takvimFiltre[alan] = tumunuSecToggle(takvimFiltre[alan], ops.slice()); ciz(); return; }
  const v = ops[i]; if(v === undefined) return;
  const j = takvimFiltre[alan].indexOf(v); if(j < 0) takvimFiltre[alan].push(v); else takvimFiltre[alan].splice(j,1);
  ciz();
}
function takvimDeptSec(i){ takvimCokSec('dept', takvimDeptOps(), i); }
function takvimAltSec(i){ takvimCokSec('altdept', takvimAltOps(), i); }
function takvimLokSec(i){ takvimCokSec('lok', takvimLokOps(), i); }

function takvimKisiler(){
  const sv = seviye();
  if(sv >= 2) return S.personel.filter(p=>p.aktif);
  if(sv === 1) return [aktif(), ...altKadro(S.aktifId)];
  return [aktif()];
}


/* Takvim ilk açıldığında ve kullanıcı değişince kişinin kendi birimi seçili gelir */
function takvimFiltreKur(){
  const p = aktif();
  if(!p) return;
  if(takvimFiltre.kuruldu === p.id) return;
  takvimFiltre = {dept: p.dept ? [p.dept] : [], altdept: [], lok: p.lokasyon ? [p.lokasyon] : [], kuruldu: p.id,
                  sadeceIzinli: takvimFiltre.sadeceIzinli};
}
function takvimKendiBirimi(){
  const p = aktif(); if(!p) return false;
  const d = takvimFiltre.dept, l = takvimFiltre.lok;
  const deptEsit = d.length === 1 && d[0] === (p.dept || '');
  const lokEsit = (p.lokasyon || '') ? (l.length === 1 && l[0] === p.lokasyon) : l.length === 0;
  return deptEsit && lokEsit && !takvimFiltre.altdept.length;
}
function takvimVarsayilan(){
  const p = aktif();
  takvimFiltre = {dept: p.dept ? [p.dept] : [], altdept: [], lok: p.lokasyon ? [p.lokasyon] : [], kuruldu: p.id,
                  sadeceIzinli: takvimFiltre.sadeceIzinli};
  ciz();
}

/* Dönem: kaç ay birden gösterilecek */
/* Takvim köşesindeki ay gezinme */
function takvimKose(){
  return '<div class="kosenav"><span style="cursor:default">'+esc(ayEtiketi(S.yil,'takvim'))+'</span></div>';
}

function takvimGunler(){
  const yil = S.yil, liste = [];
  for(const a of ayListesi('takvim')){
    const adet = new Date(yil, a + 1, 0).getDate();
    for(let g = 1; g <= adet; g++) liste.push({y:yil, a, g, s: iso(new Date(yil, a, g)), dt: new Date(yil, a, g)});
  }
  return liste;
}

function takvimTablo(kisiler){
  const gunler = takvimGunler();
  const ayAdedi = ayListesi('takvim').length;
  const dar = gunler.length > 62;
  const bugunS = bugun();

  let h = '<div class="twpair takvimtw">'+ustCubuk()+'<div class="calwrap"><table class="cal'
    + (dar?' dar':'') + (ayAdedi>1?' cok':'') + '"><thead>';

  // birden çok ay varsa üstte ay başlıkları
  if(ayAdedi > 1){
    h += '<tr><th class="pn kose" rowspan="2">'+takvimKose()+'</th>';
    let n = 0;
    while(n < gunler.length){
      const {y, a} = gunler[n];
      let adet = 0;
      while(n + adet < gunler.length && gunler[n+adet].y === y && gunler[n+adet].a === a) adet++;
      h += '<th colspan="'+adet+'" class="ayb">'+AY[a]+' '+y+'</th>';
      n += adet;
    }
    h += '</tr><tr>';
  } else {
    h += '<tr><th class="pn kose">'+takvimKose()+'</th>';
  }

  const kendiSecim = S.takvimSecim && S.takvimSecim.pid === S.aktifId;
  for(const x of gunler){
    const we = !S.ayar.calismaGunleri.includes(x.dt.getDay()), t = tatilBul(x.s);
    const kendiIzni = S.izin.find(i => i.pid === S.aktifId
      && (GECERLI.includes(i.durum) || BEKLEYEN.includes(i.durum))
      && i.bas <= x.s && i.bit >= x.s);
    const calisma = gunDegeri(x.s) > 0;
    const secilebilir = !gecmisTarihMi(x.s) && izinGirebilir(S.aktifId) && !kendiIzni;
    const secili = kendiSecim && x.s === S.takvimSecim.bas;
    const sinif = [x.s===bugunS?'bgn':'', secilebilir?'tikbas':'',
                   kendiIzni&&calisma?'izinli':'', secili?'secbas':''].filter(Boolean).join(' ');
    h += '<th'+(sinif?' class="'+sinif+'"':'')
      + (we||t?' style="color:'+(t?'#9C6B11':'var(--ink3)')+'"':'')
      + (secilebilir ? ' onclick="takvimGun(\''+S.aktifId+'\',\''+x.s+'\')"'
          + ' onmouseover="takvimOku(\''+x.s+'\',\''+S.aktifId+'\')"' : '')
      + ' title="'+(kendiIzni
          ? esc(trTarih(x.s)+' · zaten izinlisiniz: '+turBul(kendiIzni.tur).ad+' ('+DURUM_AD[kendiIzni.durum]+')')
          : secilebilir
            ? esc(trTarih(x.s)+' · kendi izin talebiniz için tıklayın'
                + (calisma ? '' : ' · '+(t ? t.ad : 'hafta tatili')+', izinden düşmez'))
            : esc(t ? t.ad : trTarih(x.s)))+'">'
      + '<div class="gn">'+x.g+'</div>'
      + (dar?'':'<div class="gh">'+GUN[x.dt.getDay()][0]+'</div>')+'</th>';
  }
  h += '</tr></thead><tbody>';

  for(const p of kisiler){
    const yetkili = izinGirebilir(p.id);
    h += '<tr'+(p.id===S.aktifId?' class="benim"':'')+'>'
      + '<td class="pn"'+(yetkili?' style="cursor:pointer" title="İzin talebi gir" onclick="izinFormu(\''+p.id+'\')"':'')+'>'
      + '<b>'+esc(p.ad+' '+p.soyad)+'</b>'+(p.id===S.aktifId?' <span class="pill">Siz</span>':'')
      + '<div class="hint" style="font-size:11px">'+esc(p.dept)+(p.altDept?' · '+esc(p.altDept):'')+'</div></td>';
    for(const x of gunler){
      const we = !S.ayar.calismaGunleri.includes(x.dt.getDay()), t = tatilBul(x.s);
      const iz = S.izin.find(i => i.pid===p.id && (GECERLI.includes(i.durum)||BEKLEYEN.includes(i.durum)) && i.bas<=x.s && i.bit>=x.s);
      let cls = 'cell', st = '', ttl = '';
      if(iz){
        const tur = turBul(iz.tur);
        cls += ' f';
        const onayli = iz.durum === 'onaylandi';
        st = 'background:'+tur.renk+(onayli?'':'55')+';'+(onayli?'':'border:1px dashed '+tur.renk+';');
        ttl = adSoyad(p.id)+' — '+tur.ad+' · '+trTarih(iz.bas)+' – '+trTarih(iz.bit)+' · '+DURUM_AD[iz.durum];
      }
      const sec = S.takvimSecim;
      const secili = sec && sec.pid === p.id && x.s === sec.bas;
      const aradaki = sec && sec.pid === p.id && x.s > sec.bas;
      let tik = '', hucreCls = (t?'ht':we?'we':'') + (x.s===bugunS?' bgn':'')
        + (secili?' sec':'') + (aradaki?' seca':'');
      if(iz && gorebilir(p.id)){
        tik = ' onclick="kayitDetay(\'izin\',\''+iz.id+'\')"';
        hucreCls += ' tik';
      } else if(!iz && yetkili && !gecmisTarihMi(x.s) && !cikisSonrasiMi(p.id, x.s)){
        tik = ' onclick="takvimGun(\''+p.id+'\',\''+x.s+'\')"';
        hucreCls += ' tik';
        const dusmez = gunDegeri(x.s) === 0 ? ' · '+(t ? t.ad : 'hafta tatili')+', izinden düşmez' : '';
        ttl = secili ? trTarih(x.s)+' · başlangıç seçildi, bitiş gününe tıklayın'
            : sec && sec.pid === p.id && x.s > sec.bas
              ? trTarih(sec.bas)+' – '+trTarih(x.s)+' · '+sayi(isGunu(sec.bas, x.s))+' iş günü'
              : trTarih(x.s)+' · '+adSoyad(p.id)+' için izin planla'+dusmez;
      }
      h += '<td class="'+hucreCls+'"'+tik
        + ' onmouseover="takvimOku(\''+x.s+'\',\''+p.id+'\')"'
        + ' title="'+esc(ttl)+'">'
        + '<span class="'+cls+'" style="'+st+'"></span></td>';
    }
    h += '</tr>';
  }
  h += '</tbody></table></div></div>';
  return h;
}

function vTakvim(){
  takvimFiltreKur();
  const hepsi = S.personel.filter(p => p.aktif);            // şirket geneli
  const depts = [...new Set(hepsi.map(p=>p.dept))].sort((a,b)=>a.localeCompare(b,'tr'));
  const loks  = [...new Set(hepsi.map(p=>p.lokasyon||'').filter(Boolean))].sort((a,b)=>a.localeCompare(b,'tr'));

  const gunler = takvimGunler();
  const donemBas = gunler[0].s, donemBit = gunler[gunler.length - 1].s;

  /* Sıralama: önce kullanıcının kendisi, sonra dönemde izinli olanlar, sonra diğerleri */
  const ilkIzin = {};
  for(const i of S.izin){
    if(!(GECERLI.includes(i.durum) || BEKLEYEN.includes(i.durum))) continue;
    if(i.bit < donemBas || i.bas > donemBit) continue;
    if(!ilkIzin[i.pid] || i.bas < ilkIzin[i.pid]) ilkIzin[i.pid] = i.bas;
  }
  const kisiler = hepsi
    .filter(p => (!takvimFiltre.dept.length || takvimFiltre.dept.includes(p.dept))
              && (!takvimFiltre.altdept.length || takvimFiltre.altdept.includes(p.altDept||''))
              && (!takvimFiltre.lok.length || takvimFiltre.lok.includes(p.lokasyon||'')))
    .filter(p => !takvimFiltre.sadeceIzinli || ilkIzin[p.id])
    .sort((a,b) => {
      if(a.id === S.aktifId) return -1;
      if(b.id === S.aktifId) return 1;
      const ai = ilkIzin[a.id], bi = ilkIzin[b.id];
      if(ai && !bi) return -1;
      if(!ai && bi) return 1;
      if(ai && bi && ai !== bi) return ai.localeCompare(bi);
      return a.dept.localeCompare(b.dept,'tr') || a.ad.localeCompare(b.ad,'tr');
    });
  const ayBas = donemBas, ayBit = donemBit;
  const kisiId = new Set(kisiler.map(p => p.id));
  const kayitlar = S.izin
    .filter(i => kisiId.has(i.pid) && (GECERLI.includes(i.durum) || BEKLEYEN.includes(i.durum))
              && i.bas <= ayBit && i.bit >= ayBas)
    .sort((a,b) => a.bas.localeCompare(b.bas) || adSoyad(a.pid).localeCompare(adSoyad(b.pid),'tr'));

  let h = '<div class="row" style="justify-content:space-between;margin-bottom:10px;gap:10px;flex-wrap:wrap">'
    + '<div><h1 style="font-size:20px">İzin takvimi</h1>'
    + '<div class="hint">'+esc(ayEtiketi(S.yil,'takvim'))+'</div></div></div>'
    + '<div style="margin-bottom:12px">'+ayStrip('takvim')+'</div>';

  h += '<div class="card takvimkart"><div class="hd yapisik">'
    + baslikSecici('tkDept','Departman', takvimDeptOps(), takvimFiltre.dept, 'takvimDeptSec')
    + baslikSecici('tkAlt','Alt departman', takvimAltOps(), takvimFiltre.altdept, 'takvimAltSec')
    + baslikSecici('tkLok','Lokasyon', takvimLokOps(), takvimFiltre.lok, 'takvimLokSec')
    + (takvimKendiBirimi()
        ? '<button class="btn sm" onclick="takvimFiltre.dept=[];takvimFiltre.altdept=[];takvimFiltre.lok=[];ciz()">Tüm şirketi göster</button>'
        : '<button class="btn sm" onclick="takvimVarsayilan()">Kendi birimim</button>')
    + '<label class="secim'+(takvimFiltre.sadeceIzinli?' secili':'')+'" title="Bu dönemde izni olmayan kişileri gizler">'
    + '<input type="checkbox"'+(takvimFiltre.sadeceIzinli?' checked':'')
    + ' onchange="takvimFiltre.sadeceIzinli=this.checked;ciz()"> Sadece izinliler</label>'
    + '<div class="sp"></div>'
    + '<span class="hint" style="margin-right:4px">'+kisiler.length+' kişi · '+kayitlar.length+' izin</span>'
    + '<button class="btn pri sm" onclick="izinFormu()">+ İzin talebi</button>'
    + '</div>';

  if(S.takvimSecim){
    const sec = S.takvimSecim;
    h += '<div class="card" style="margin-bottom:14px;border-color:var(--brand);background:var(--brand-soft)">'
      + '<div class="bd row" style="flex-wrap:wrap;gap:8px">'
      + '<div><b>'+esc(adSoyad(sec.pid))+' · '+trTarih(sec.bas)+' başlangıç olarak seçildi.</b><br>'
      + '<span class="hint">Bitiş gününe tıklayın; aynı güne tıklarsanız tek günlük izin olur. '
      + 'İzin sonraki aya taşıyorsa üstteki ay düğmelerinden o ayı da ekleyin, seçiminiz korunur.</span></div>'
      + '<div class="row" style="margin-left:auto;gap:6px">'
      + '<button class="btn pri sm" onclick="secimFormuAc()">Tarihleri elle gir</button>'
      + '<button class="btn sm" onclick="takvimSecimIptal()">Seçimi bırak</button>'
      + '</div></div></div>';
  }

  h += '<div class="bd okumaserit">'
    + '<div id="takvimOkuma" class="hint" style="font-size:12.5px;min-height:18px">'
    + 'Bir hücrenin üzerine gelin — gün, tarih ve kişi burada görünür.</div></div>'
    + '<div class="bd flush yalnizgenis">'+takvimTablo(kisiler)+'</div>'
    + '<div class="bd flush yalnizdar">'+takvimListesi(kayitlar)+'</div>';

  h += '</div>';


  return h;
}

function takvimBoya(){}


/* Bir kişinin izin ve mesai kayıtlarını kullanıcı değiştirmeden yönetme */
/* tip: 'izin' | 'mesai' | boş = ikisi birden
   basT/bitT verilirse yalnızca o aralıktaki kayıtlar listelenir */
function kisiKayitlari(pid, tip, basT, bitT){
  if(!gorebilir(pid)){ bildir('Bu kişinin kayıtlarını görme yetkiniz yok.'); return; }
  S.kayitKisi = pid;
  S.kayitTip = tip || '';
  S.kayitAralik = (basT && bitT) ? {bas:basT, bit:bitT} : null;
  kisiKayitlariCiz();
}

  const pid = S.kayitKisi, p = per(pid);
  if(!p) return;
  const b = bakiye(pid, S.yil);
  const ar = S.kayitAralik;
  const donemAd = ar
    ? (d(ar.bas).getMonth() === d(ar.bit).getMonth() && d(ar.bas).getFullYear() === d(ar.bit).getFullYear()
        ? AY[d(ar.bas).getMonth()]+' '+d(ar.bas).getFullYear()
        : trTarih(ar.bas)+' – '+trTarih(ar.bit))
    : String(S.yil);

                        && (ar ? (i.bit >= ar.bas && i.bas <= ar.bit) : i.bas.slice(0,4) === String(S.yil)))
                        .sort((a,c) => c.bas.localeCompare(a.bas));
  const mesailer = S.mesai.filter(m => m.pid === pid
                        && (ar ? (m.tarih >= ar.bas && m.tarih <= ar.bit) : m.tarih.slice(0,4) === String(S.yil)))

      + '<span class="mono" style="font-size:12.5px">'+sayi(i.gun)+' gün</span>'
      + durumTag(i.durum)
      + (izinBakiyeOncesi(i) ? '<span class="pill" title="Bakiye tarihinden önce">Bakiyede</span>' : '')
      + '<span style="margin-left:auto;white-space:nowrap">'

            + '<button class="btn sm no" onclick="izinRedAc(\''+i.id+'\')">Reddet</button> ' : '')
      + (izinRevizeEdilebilir(i) ? '<button class="btn sm" onclick="izinRevizeAc(\''+i.id+'\')">Revize</button> ' : '')
      + (izinIptalTalebi(i) ? '<button class="btn sm no" onclick="izinIptal(\''+i.id+'\')">İptal talebi</button> ' : '')
      + '<button class="btn sm" onclick="kayitDetay(\'izin\',\''+i.id+'\')">Detay</button> '
      + (izinSilinebilir(i) ? '<button class="btn sm no" onclick="kayitSil(\'izin\',\''+i.id+'\')">Sil</button>' : '')
      + '</span></div>';
  };
  const mesaiSatir = m => '<div class="row" style="gap:10px;padding:8px 10px;border-bottom:1px solid var(--line2)">'
      + '<span class="mono" style="font-size:12.5px">'+trTarih(m.tarih)+'</span>'
      + '<span class="mono" style="font-size:12.5px">'+m.bas+' – '+m.bit+'</span>'
      + '<span class="mono" style="font-size:12.5px">'+sayi(m.sure)+' saat</span>'
      + '<span class="hint" style="font-size:11.5px">'+esc(mturBul(m.tur).ad)+'</span>'
      + durumTag(m.durum)
      + '<span style="margin-left:auto;white-space:nowrap">'
      + (mesaiKararVerebilir(m)
          ? '<button class="btn sm ok" onclick="mesaiKarar(\''+m.id+'\',true)">Onayla</button> '
            + '<button class="btn sm no" onclick="mesaiRedAc(\''+m.id+'\')">Reddet</button> ' : '')
      + (mesaiRevizeEdilebilir(m) ? '<button class="btn sm" onclick="mesaiRevizeAc(\''+m.id+'\')">Revize</button> ' : '')
      + (mesaiIptalTalebi(m) ? '<button class="btn sm no" onclick="mesaiIptal(\''+m.id+'\')">İptal talebi</button> ' : '')

      + '</div>'

  + (mesaiGorunum ? '' : turler.length

        + '<div class="row" style="gap:10px;margin-top:8px;flex-wrap:wrap">'

/* Detay penceresi kapanınca kişi kayıtlarına geri döner */
function kayitDetay(tip, id){
  const kisi = S.kayitKisi;
  if(tip === 'izin') izinDetay(id); else mesaiDetay(id);
  S.kayitKisi = kisi;
}

/* Silme onayı sonrası pencere kendini yeniler */
function kayitSil(tip, id){
  if(tip === 'izin') izinSil(id); else mesaiSil(id);
}


/* Bu kişi adına izin talebi girilebilir mi?
   Herkes kendi talebini girer; yalnızca İK başkası adına giriş yapabilir. */
/* Kişi için mesai girişi açık mı? (varsayılan: açık) */
function mesaiAcik(pid){
  const p = per(pid);
  return !!p && p.mesaiKapali !== true;
}
function mesaiGirebilir(pid){
  return izinGirebilir(pid) && mesaiAcik(pid);
}

/* Doğum günü izni yalnızca kişinin doğum gününde kullanılabilir */
function dogumGunuMu(pid, tarih){
  const p = per(pid);
  if(!p || !p.dogum || !tarih) return false;
  return p.dogum.slice(5) === tarih.slice(5);       // AA-GG eşleşmesi
}
function dogumGunuUygun(pid, bas, bit){
  if(!bas || !bit) return {ok:false, sebep:'tarih'};
  if(bas !== bit) return {ok:false, sebep:'tekgun'};
  if(!per(pid) || !per(pid).dogum) return {ok:false, sebep:'dogumyok'};
  if(!dogumGunuMu(pid, bas)) return {ok:false, sebep:'baskagun'};
  return {ok:true};
}
function dogumGunuTarihi(pid, yil){
  const p = per(pid);
  if(!p || !p.dogum) return '';
  return yil + '-' + p.dogum.slice(5);
}

function izinGirebilir(pid){
  return pid === S.aktifId || ikMi() || per(pid)?.yonetici === S.aktifId;
}


/* ---- Takvimden izin planlama ----
   İlk tıklama başlangıcı seçer, ikinci tıklama bitişi belirleyip formu açar. */
function takvimGun(pid, tarih){
  if(gecmisTarihMi(tarih)){
    bildir(trTarih(sistemBaslangic())+' tarihinden önceye izin girilemez.');
    return;
  }
  if(cikisSonrasiMi(pid, tarih)){
    bildir(adSoyad(pid)+' işten çıkış tarihinden ('+trTarih(per(pid).cikis)+') sonrasına izin girilemez.');
    return;
  }
  const mevcut = S.izin.find(i => i.pid === pid && (GECERLI.includes(i.durum) || BEKLEYEN.includes(i.durum))
                                && i.bas <= tarih && i.bit >= tarih);
  if(mevcut){
    bildir(trTarih(tarih)+' tarihinde zaten izin kaydı var: '+turBul(mevcut.tur).ad+'.');
    return;
  }
  const sec = S.takvimSecim;
  /* seçilen aralık mevcut bir izne denk geliyorsa kabul etme */
  if(sec && sec.pid === pid && tarih >= sec.bas && kendiCakismasi(pid, sec.bas, tarih, null).length){
    bildir('Seçtiğiniz aralık mevcut bir izinle çakışıyor.');
    return;
  }
  if(sec && sec.pid === pid && tarih >= sec.bas){
    S.takvimSecim = null;
    izinFormu(pid, sec.bas, tarih);
    return;
  }
  S.takvimSecim = {pid, bas:tarih};
  ciz();
  bildir(trTarih(tarih)+' başlangıç olarak seçildi. Bitiş gününe tıklayın.');
}

function takvimSecimIptal(){ S.takvimSecim = null; ciz(); }

/* Seçili başlangıçla formu açar; bitişi kullanıcı yazar */
function secimFormuAc(){
  const sec = S.takvimSecim;
  if(!sec) return;
  S.takvimSecim = null;
  izinFormu(sec.pid, sec.bas);
}

/* Fare hücrenin üzerindeyken tarihi ve kişiyi yazar */
function takvimOku(tarih, pid){
  const el = document.getElementById('takvimOkuma');
  if(!el) return;
  const dt = d(tarih), t = tatilBul(tarih);
  const iz = S.izin.find(i => i.pid === pid && (GECERLI.includes(i.durum) || BEKLEYEN.includes(i.durum))
                            && i.bas <= tarih && i.bit >= tarih);
  let m = '<b>'+String(dt.getDate()).padStart(2,'0')+' '+AY[dt.getMonth()]+' '+dt.getFullYear()+'</b>'
    + ' · '+GUN_TAM[dt.getDay()]
    + ' · <b>'+esc(adSoyad(pid))+'</b>';
  const sayilmaz = gunDegeri(tarih) === 0;
  if(t) m += ' · <span style="color:var(--bekle)">'+esc(t.ad)+(t.yarim?' (yarım gün)':'')+'</span>';
  else if(!S.ayar.calismaGunleri.includes(dt.getDay())) m += ' · <span style="color:var(--ink3)">hafta tatili</span>';
  if(sayilmaz) m += ' <span class="pill">izinden düşmez</span>';
  if(iz){
    const tur = turBul(iz.tur);
    m += ' · <span style="color:'+tur.renk+'">'+esc(tur.ad)+'</span> '
      + trTarih(iz.bas)+' – '+trTarih(iz.bit)+' · '+DURUM_AD[iz.durum];
  } else if(S.takvimSecim && S.takvimSecim.pid === pid && tarih > S.takvimSecim.bas){
    m += ' · seçilen aralık '+sayi(isGunu(S.takvimSecim.bas, tarih))+' iş günü';
  }
  el.innerHTML = m;
}

let pFiltre = {q:'', dept:[], altdept:[], unvan:[], lok:[], yon:[], rol:[]};
function pTemizle(){ pFiltre = {q:'', dept:[], altdept:[], unvan:[], lok:[], yon:[], rol:[]}; ciz(); }

/* Başlık-içi çoklu seçim filtreleri için seçenek listeleri (render ile handler aynı sırayı kullanır) */
const ROL_ETIKET = {personel:'Personel', yonetici:'Yönetici', ustyonetim:'Üst yönetim', ik:'İK'};
function pDeptOps(){ return [...new Set(S.personel.map(p=>p.dept).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'tr')); }
function pAltOps(){ return [...new Set(S.personel.map(p=>p.altDept).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'tr')); }
function pUnvanOps(){ return [...new Set(S.personel.map(p=>p.unvan).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'tr')); }
function pLokOps(){ return [...new Set(S.personel.map(p=>p.lokasyon).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'tr')); }
function pYonOps(){ return [...new Set(S.personel.filter(p=>p.yonetici).map(p=>adSoyad(p.yonetici)))].sort((a,b)=>a.localeCompare(b,'tr')); }
function pRolOps(){ return ['Personel','Yönetici','Üst yönetim','İK','Mesai kapalı']; }
function pCokSec(alan, ops, i){
  if(i === null){ pFiltre[alan] = tumunuSecToggle(pFiltre[alan], ops.slice()); ciz(); return; }
  const v = ops[i]; if(v === undefined) return;
  const j = pFiltre[alan].indexOf(v); if(j < 0) pFiltre[alan].push(v); else pFiltre[alan].splice(j,1);
  ciz();
}
function pDeptSec(i){ pCokSec('dept', pDeptOps(), i); }
function pAltSec(i){ pCokSec('altdept', pAltOps(), i); }
function pUnvanSec(i){ pCokSec('unvan', pUnvanOps(), i); }
function pLokSec(i){ pCokSec('lok', pLokOps(), i); }
function pYonSec(i){ pCokSec('yon', pYonOps(), i); }
function pRolSec(i){ pCokSec('rol', pRolOps(), i); }

/* Personel listesinde satır-içi seçim: departman / alt departman / lokasyon / yönetici */
function pAltDeptSecici(p){
  const liste = altDeptListesi(p.dept);
  const disBagli = p.altDept && !liste.includes(p.altDept);   // başka departmana bağlı ama atanmış
  return '<select id="pAlt_'+p.id+'" onclick="event.stopPropagation()" onchange="pSatirGuncelle(\''+p.id+'\',\'altDept\',this.value)" '
    + 'style="width:100%;font-size:12.5px">'
    + '<option value="">— alt departman —</option>'
    + liste.map(x=>'<option'+(x===p.altDept?' selected':'')+'>'+esc(x)+'</option>').join('')
    + (disBagli ? '<option selected>'+esc(p.altDept)+'</option>' : '')
    + '<option value="__duzen__">⚙ Ekle / sil…</option>'
    + '</select>';
}
function pUnvanSecici(p){
  const liste = unvanListesi(p.dept);
  const disBagli = p.unvan && !liste.includes(p.unvan);
  return '<select id="pUnv_'+p.id+'" onclick="event.stopPropagation()" onchange="pSatirGuncelle(\''+p.id+'\',\'unvan\',this.value)" '
    + 'style="width:100%;font-size:12.5px">'
    + '<option value="">— unvan —</option>'
    + liste.map(x=>'<option'+(x===p.unvan?' selected':'')+'>'+esc(x)+'</option>').join('')
    + (disBagli ? '<option selected>'+esc(p.unvan)+'</option>' : '')
    + '<option value="__duzen__">⚙ Ekle / sil…</option>'
    + '</select>';
}
function pSatirGuncelle(pid, alan, deger){
  const p = per(pid); if(!p) return;
  if(deger === '__duzen__'){                                    // "Ekle / sil…" → liste tablosu açılır
    const key = {dept:'dept', altDept:'altdept', unvan:'unvan', lokasyon:'lokasyon'}[alan];
    ciz(); listeYonetAc(key); return;
  }
  p[alan] = deger;
  if(alan === 'dept'){
    // yeni departmana uymayan alt departman ve unvanı temizle, o satırın seçicilerini tazele
    if(p.altDept && altDeptDepti(p.altDept) && altDeptDepti(p.altDept) !== deger) p.altDept = '';
    if(p.unvan && unvanDepti(p.unvan) && unvanDepti(p.unvan) !== deger) p.unvan = '';
    const sa = document.getElementById('pAlt_'+pid);  if(sa) sa.outerHTML = pAltDeptSecici(p);
    const su = document.getElementById('pUnv_'+pid);   if(su) su.outerHTML = pUnvanSecici(p);
  }
  kaydet();
}

  const p = per(pid); if(!p) return;
  const ad = {dept:'Departman', altDept:'Alt departman', unvan:'Unvan', lokasyon:'Lokasyon'}[alan] || 'Değer';

function pYeniVazgec(){ modalKapat(); ciz(); }   // seçici gerçek değere dönsün diye yeniden çiz
function pYeniKaydet(pid, alan){
  const p = per(pid); if(!p) return;
  const v = (document.getElementById('pyeni_ad').value || '').trim();
  if(!v){ bildir('Bir ad yazın.'); return; }
  if(alan === 'dept'){
    listeEkle('dept', v); p.dept = v;
    if(p.altDept && altDeptDepti(p.altDept) && altDeptDepti(p.altDept) !== v) p.altDept = '';
  } else if(alan === 'altDept'){
    listeEkle('altdept', v);
    S.ayar.altDeptDept = S.ayar.altDeptDept || {};
    if(S.ayar.altDeptDept[v] === undefined) S.ayar.altDeptDept[v] = p.dept || '';
    p.altDept = v;
  } else if(alan === 'unvan'){
    listeEkle('unvan', v);
    S.ayar.unvanDept = S.ayar.unvanDept || {};
    if(S.ayar.unvanDept[v] === undefined) S.ayar.unvanDept[v] = p.dept || '';
    p.unvan = v;
  } else if(alan === 'lokasyon'){
    listeEkle('lokasyon', v); p.lokasyon = v;
  }
  modalKapat(); kaydet();
  bildir('“'+v+'” eklendi ve atandı.');
