/* Kıdem tarihi girilince İzin kıdem tarihi boşsa aynı değerle doldurur */
function izinKidemTazele(){
  const ik = document.getElementById('p_izinKidem'), kd = document.getElementById('p_kidem');
  if(ik && kd && !tarihAl('p_izinKidem')) ik.value = kd.value;
  devirOzet();
}

/* Bakiye ve bir sonraki hak ediş özeti */
function devirOzet(){
  const el = document.getElementById('p_devirOzet');
  if(!el) return;
  const id = S.duzenlenenId;
  const izinKidem = tarihAl('p_izinKidem') || tarihAl('p_kidem') || tarihAl('p_giris');
  if(!izinKidem){ el.innerHTML = '<div class="hint">İzin kıdem tarihi girilince bir sonraki hak ediş burada görünür.</div>'; return; }

  const sahte = {id:id||'__yeni__', izinKidem, kidem:tarihAl('p_kidem')||izinKidem, giris:tarihAl('p_giris')||izinKidem,
                 dogum:tarihAl('p_dogum'),
                 devir:Number((document.getElementById('p_devir')||{}).value) || 0,
                 devirTarihi:tarihAl('p_devirTarihi') || bugun()};
  const gercek = id ? per(id) : null;
  const yedek = gercek ? {izinKidem:gercek.izinKidem, kidem:gercek.kidem, giris:gercek.giris, dogum:gercek.dogum, devir:gercek.devir, devirTarihi:gercek.devirTarihi} : null;
  if(gercek) Object.assign(gercek, {izinKidem:sahte.izinKidem, kidem:sahte.kidem, giris:sahte.giris, dogum:sahte.dogum, devir:sahte.devir, devirTarihi:sahte.devirTarihi});
  else S.personel.push(sahte);

  const hedef = gercek ? id : '__yeni__';
  const k = kidemYiliTarihte(hedef, bugun());
  const sonraki = sonrakiHakEdis(hedef, bugun());
  const bk = bakiye(hedef, S.yil);

  if(gercek) Object.assign(gercek, yedek); else S.personel.pop();

  el.innerHTML = '<div class="card" style="box-shadow:none;background:var(--surface2)"><div class="bd row" style="gap:22px;padding:12px 14px">'
    + '<div><div class="lb" style="font-size:10px">Bugünkü kıdem</div><div style="font-weight:600;margin-top:4px" class="mono">'+k+' yıl</div></div>'
    + (sonraki
      ? '<div><div class="lb" style="font-size:10px">Sonraki hak ediş</div><div style="font-weight:600;margin-top:4px" class="mono">'+trTarih(sonraki.tarih)+'</div></div>'
        + '<div><div class="lb" style="font-size:10px">Eklenecek</div><div style="font-weight:600;margin-top:4px" class="mono">'+sonraki.gun+' gün</div></div>'
        + '<div style="margin-left:auto"><div class="lb" style="font-size:10px">O tarihte kıdem</div><div class="hint" style="margin-top:5px">'+sonraki.kidem+' yıl</div></div>'
      : '<div class="hint">Hak ediş tarihi hesaplanamadı.</div>')
    + '<div><div class="lb" style="font-size:10px">'+S.yil+' yıl sonu kalan</div>'
    + '<div style="font-weight:600;margin-top:4px" class="mono">'+sayi(bk.yilSonuKalan)+' gün</div></div>'
    + '</div></div>';
}

/* Ücret tipine göre etiketi günceller, aylık/günlük/saatlik karşılıkları gösterir */
function ucretOzet(){
  const el = document.getElementById('p_ucretOzet');
  if(!el) return;
  const tipEl = document.getElementById('p_ucretTipi');
  const tip = (tipEl && tipEl.value === 'gunluk') ? 'gunluk' : 'aylik';
  const taslak = {ucret: paraCoz(($('#p_ucret')||{}).value),
                  ucretTipi: tip,
                  aylikGun: Number(($('#p_agun')||{}).value) || 30};

  const lb = document.getElementById('p_ucretLb');
  if(lb) lb.textContent = 'Ücret (₺)';

  if(!taslak.ucret){
    el.innerHTML = '<div class="hint">Ücret girilince aylık, günlük ve saatlik karşılıkları burada görünür. '
      + 'Kadro raporu ve mesai tutarları aylık karşılık üzerinden hesaplanır.</div>';
    return;
  }

  const kutu = (etiket, deger, vurgu) =>
    '<div><div class="lb" style="font-size:10px">'+etiket+'</div>'
    + '<div class="mono" style="'+(vurgu?'font-weight:600':'')+';margin-top:4px'+(vurgu?'':';color:var(--ink3)')+'">'
    + sayi(deger)+' ₺</div></div>';

  el.innerHTML = '<div class="card" style="box-shadow:none;background:var(--surface2)"><div class="bd row" style="gap:22px;padding:12px 14px">'
    + kutu('Aylık karşılık', aylikUcret(taslak), tip === 'gunluk')
    + kutu('Günlük ücret', gunlukUcret(taslak), tip === 'aylik')
    + kutu('Saatlik ücret', saatlikUcret(taslak), false)
    + '<div style="margin-left:auto;max-width:290px"><div class="lb" style="font-size:10px">Kayda giren</div>'
    + '<div class="hint" style="margin-top:5px">'+ucretTipiAd(taslak).toLocaleLowerCase('tr')+' tutar · '
    + taslak.aylikGun+' gün × '+sayi(Number(S.ayar.gunlukSaat)||7.5)+' saat üzerinden</div></div>'
    + '</div></div>';
}

/* Çıkış tarihi girilince kayıt pasife alınır; kullanıcı isterse geri açabilir */
function cikisKontrol(){
  const el = document.getElementById('p_cikis'), msj = document.getElementById('p_cikismsj'),
        akt = document.getElementById('p_aktif');
  if(!el || !msj) return;
  const v = tarihAl('p_cikis');
  if(!v){ msj.textContent = 'Çalışmaya devam eden personelde boş bırakılır.'; msj.style.color = ''; return; }
  const gir = tarihAl('p_giris');
  if(gir && v < gir){ msj.textContent = 'Çıkış tarihi işe giriş tarihinden önce olamaz.'; msj.style.color = 'var(--red)'; return; }
  if(v <= bugun()){
    if(akt) akt.checked = false;
    msj.textContent = 'İşten ayrılmış · kayıt pasife alınacak.'; msj.style.color = 'var(--bekle)';
  } else {
    msj.textContent = 'Planlanan çıkış · bu tarihe kadar aktif kalır.'; msj.style.color = 'var(--bekle)';
  }
}

/* TC alanına yazdıkça biçim ve mükerrerlik kontrolü */
function tcKontrol(){
  const el = document.getElementById('p_tc'), msj = document.getElementById('p_tcmsj');
  if(!el || !msj) return;
  el.value = el.value.replace(/[^0-9]/g, '').slice(0,11);
  const v = el.value;
  if(!v){ msj.textContent = 'Boş bırakılabilir, ancak toplu aktarımda eşleştirme bu numaradan yapılır.'; msj.style.color = ''; return; }
  if(v.length < 11){ msj.textContent = v.length + '/11 hane'; msj.style.color = ''; return; }
  if(!tcGecerli(v)){ msj.textContent = 'Bu numara geçerli bir T.C. kimlik numarası değil.'; msj.style.color = 'var(--red)'; return; }
  const sahip = tcSahibi(v, S.duzenlenenId || '');
  if(sahip){ msj.textContent = 'Bu numara '+adSoyad(sahip.id)+' kaydında da var.'; msj.style.color = 'var(--red)'; return; }
  msj.textContent = 'Geçerli'; msj.style.color = 'var(--onay)';
}

function personelKaydet(id){
  const o = {tcno:$('#p_tc').value.trim(), ad:$('#p_ad').value.trim(), soyad:$('#p_soyad').value.trim(),
    dept:comboDeger('p_dept'), lokasyon:comboDeger('p_lok'), unvan:comboDeger('p_unvan'),
    altDept:comboDeger('p_altdept'),
    kidem:tarihAl('p_kidem'), izinKidem:tarihAl('p_izinKidem')||tarihAl('p_kidem')||tarihAl('p_giris'),
    giris:tarihAl('p_giris'), cikis:tarihAl('p_cikis'),
    devirTarihi:tarihAl('p_devirTarihi'),
    dogum:tarihAl('p_dogum'), devir:Number($('#p_devir').value)||0, email:$('#p_email').value.trim(),
    tel:$('#p_tel').value.trim(), ucret:paraCoz($('#p_ucret').value),
    netBrut: ($('#p_netBrut')||{}).value === 'brut' ? 'brut' : 'net',
    ucretTipi: $('#p_ucretTipi').value === 'gunluk' ? 'gunluk' : 'aylik',
    aylikGun:Number($('#p_agun').value)||30,
    yonetici:$('#p_yon').value, rol:$('#p_rol').value, aktif:$('#p_aktif').checked,
    mesaiKapali: !$('#p_mesai').checked};
  if(!o.ad || !o.soyad){ bildir('Ad ve soyad zorunlu.'); return; }
  if(!o.dept){ bildir('Departman seçin.'); return; }
  if(o.tcno && !tcGecerli(o.tcno)){ bildir('T.C. kimlik numarası geçersiz.'); return; }
  if(o.tcno && tcSahibi(o.tcno, id)){ bildir('Bu T.C. numarası başka bir kayıtta kullanılıyor.'); return; }
  if(o.cikis && o.giris && o.cikis < o.giris){ bildir('Çıkış tarihi işe giriş tarihinden önce olamaz.'); return; }
  listeEkle('dept', o.dept); listeEkle('lokasyon', o.lokasyon); listeEkle('unvan', o.unvan);
  listeEkle('altdept', o.altDept);
  S.ayar.unvanDept = S.ayar.unvanDept || {};
  if(o.unvan && S.ayar.unvanDept[o.unvan] === undefined) S.ayar.unvanDept[o.unvan] = o.dept || '';
  S.ayar.altDeptDept = S.ayar.altDeptDept || {};
  if(o.altDept && S.ayar.altDeptDept[o.altDept] === undefined) S.ayar.altDeptDept[o.altDept] = o.dept || '';
  if(id) Object.assign(per(id), o);
  else S.personel.push(Object.assign({id:yeniId('p')}, o));
  kaydet(); modalKapat(); bildir('Personel kaydedildi.');
}
function personelSil(id){
  const p = per(id); if(!p) return;
  const hareketli = S.izin.some(i=>i.pid===id) || S.mesai.some(m=>m.pid===id);
  onayIste(hareketli ? 'Personeli pasife al' : 'Personeli sil',
    '<b>'+esc(p.ad+' '+p.soyad)+'</b>\n'
    + (hareketli

function tarihCoz(s){
  if(!s) return '';
  s = String(s).trim();
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  const m = s.match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})$/);
  if(m) return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
  return '';
}
function iceAktarUygula(){
  const ham = $('#imp').value.trim();
  if(!ham){ bildir('Veri alanı boş.'); return; }
  const satirlar = ham.split(/\r?\n/).filter(x=>x.trim());
  const ayrac = satirlar[0].includes('\t') ? '\t' : satirlar[0].includes(';') ? ';' : ',';
  const bas = satirlar[0].split(ayrac).map(x=>x.trim().toLocaleLowerCase('tr').replace(/\s+/g,'_'));
  const idx = n => bas.findIndex(x => x === n || x.startsWith(n));
  /* Adayları sırayla dener, verilen başlıkları hiç dikkate almaz. Ücret sütunları
     birbirine benzediği için ("ucret_tipi", "aylik_net_ucret") gerekli. */
  const idxCok = (adlar, haric) => {
    for(const n of adlar){
      const i = bas.findIndex(x => !(haric||[]).includes(x) && (x === n || x.startsWith(n)));
      if(i >= 0) return i;
    }
    return -1;
  };
  const TUTAR_SUT = ['ucret_tipi','girilen_ucret','aylik_net_ucret','gunluk_net_ucret',
                     'net_ucret','saatlik_net_ucret'];

  const c = {tc:idx('tc'), ad:idx('ad'), soyad:idx('soyad'), dept:idx('depart'), lok:idx('lokasyon'),
             unvan:idx('unvan'), kidem:idx('kidem'), giris:idx('giris'), cikis:idx('cikis'), dogum:idx('dogum'),
             yon:idx('yonetici'), rol:idx('rol'), devir:idx('devir'), devirTarihi:idx('bakiye_tar')};
  c.ucretTipi = bas.indexOf('ucret_tipi');
  /* Tip sütunu varsa girilen tutar o tiptedir; yoksa aylık sütunu esas alınır */
  c.ucret = idxCok(c.ucretTipi >= 0
      ? ['girilen_ucret','aylik_net_ucret','net_ucret','ucret']
      : ['aylik_net_ucret','net_ucret','aylik_ucret','ucret','girilen_ucret'], ['ucret_tipi']);
  c.agun = idxCok(['aylik_gun','aylik_calisma','aylikgun','aylik'], TUTAR_SUT);
  if(c.tc < 0) c.tc = idx('kimlik');
  if(c.lok < 0) c.lok = idx('sgk');
  if(c.unvan < 0) c.unvan = idx('gorev');
  if(c.ad < 0 || c.soyad < 0){ bildir('Başlık satırında "ad" ve "soyad" sütunları bulunamadı.'); return; }

  const yeni = [];
  for(let i=1; i<satirlar.length; i++){
    const h = satirlar[i].split(ayrac).map(x=>x.trim());
    const al = k => c[k] >= 0 ? (h[c[k]] || '') : '';
    if(!al('ad')) continue;
    yeni.push({id:yeniId('p'), tcno:al('tc').replace(/[^0-9]/g,''), ad:al('ad'), soyad:al('soyad'), dept:al('dept')||'Tanımsız',
      lokasyon:al('lok'), unvan:al('unvan'), kidem:tarihCoz(al('kidem'))||tarihCoz(al('giris')),
      giris:tarihCoz(al('giris')), cikis:tarihCoz(al('cikis')), dogum:tarihCoz(al('dogum')),
      yoneticiTc:al('yon').replace(/[^0-9]/g,''), rol:(al('rol')||'personel').toLocaleLowerCase('tr'),
      devir:Number(String(al('devir')).replace(',','.'))||0,
      devirTarihi:tarihCoz(al('devirTarihi')),
      ucret:paraCoz(al('ucret')),
      ucretTipi:String(al('ucretTipi')).toLocaleLowerCase('tr').startsWith('g') ? 'gunluk' : 'aylik',
      aylikGun:Number(al('agun'))||30, email:'', tel:'', yonetici:'',
      aktif:!(tarihCoz(al('cikis')) && tarihCoz(al('cikis')) <= bugun())});
  }
  if(!yeni.length){ bildir('Okunabilir satır bulunamadı.'); return; }

  if($('#imp_temiz').checked){ S.personel = yeni; S.izin = []; S.mesai = []; }
  else S.personel = S.personel.concat(yeni);

  // yönetici eşleştirmesi (T.C. numarasına göre)
  for(const p of S.personel){
    if(p.yoneticiTc){
      const y = S.personel.find(x => x.tcno && x.tcno === p.yoneticiTc);
      if(y) p.yonetici = y.id;
      delete p.yoneticiTc;
    }
  }
  if(!per(S.aktifId)) S.aktifId = S.personel[0].id;
  unvanBaglariniKur();
  kaydet(); modalKapat(); bildir(yeni.length+' personel içe aktarıldı.');
}

function rapDeptSec(ix){
  const l = rapDeptler();
  if(ix === null){ rapF.dept = tumunuSecToggle(rapF.dept, l); ciz(); return; }
  const ad = l[ix]; if(ad === undefined) return;
  const yer = rapF.dept.indexOf(ad);
  if(yer < 0) rapF.dept.push(ad); else rapF.dept.splice(yer, 1);
  ciz();
}
function rapLokSec(ix){
  const l = rapLoklar();
  if(ix === null){ rapF.lok = tumunuSecToggle(rapF.lok, l); ciz(); return; }
  const ad = l[ix]; if(ad === undefined) return;
  const yer = rapF.lok.indexOf(ad);
  if(yer < 0) rapF.lok.push(ad); else rapF.lok.splice(yer, 1);
  ciz();
}
function rapDeptler(){
  return [...new Set(takvimKisiler().map(p => p.dept))].sort((a,b) => a.localeCompare(b,'tr'));
}
function rapLoklar(){
  return [...new Set(takvimKisiler().map(p => p.lokasyon || '').filter(Boolean))].sort((a,b) => a.localeCompare(b,'tr'));
}
function rapAra(v){
  rapF.q = v; ciz();
  const el = document.getElementById('rapAraKutu');
  if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }

/* Kapsam: kendisi ve alt kadrosu (İK'da tüm şirket) */
function rapKisiler(){
  const q = (rapF.q || '').toLocaleLowerCase('tr');
  let l = takvimKisiler().filter(p =>
    (!rapF.dept.length || rapF.dept.includes(p.dept)) &&
    (!rapF.lok.length || rapF.lok.includes(p.lokasyon || '')) &&
    (!q || (p.ad+' '+p.soyad+' '+p.unvan).toLocaleLowerCase('tr').includes(q)));

  const b = p => bakiye(p.id, S.yil);
  const sirala = {
    ad:    (a,c) => a.ad.localeCompare(c.ad,'tr'),
    dept:  (a,c) => a.dept.localeCompare(c.dept,'tr') || a.ad.localeCompare(c.ad,'tr'),
    kalan: (a,c) => b(c).kalan - b(a).kalan,
    azKalan:(a,c) => b(a).kalan - b(c).kalan,
    kullanim:(a,c) => b(c).yilToplamKullanim - b(a).yilToplamKullanim,
    kidem: (a,c) => kidemYiliTarihte(c.id,bugun()) - kidemYiliTarihte(a.id,bugun()),
    hakedis:(a,c) => {
      const x = b(a).sonraki, y = b(c).sonraki;
      if(!x) return 1; if(!y) return -1;
      return x.tarih.localeCompare(y.tarih);
    }
  };
  return l.sort(sirala[rapF.sirala] || sirala.ad);
}

function msLokSec(i){ if(i===null){ msF.lok=tumunuSecToggle(msF.lok,msLoklar()); ciz(); return; } const ad=msLoklar()[i]; if(ad===undefined) return; const j=msF.lok.indexOf(ad); if(j<0) msF.lok.push(ad); else msF.lok.splice(j,1); ciz(); }

/* Kapsam: üst yönetim ve İK tüm şirket, yönetici kendi kadrosu */
function msKayitlar(){
  const kapsam = takvimKisiler();
  const kisiId = new Set(kapsam.map(p => p.id));
  const q = (msF.q || '').toLocaleLowerCase('tr');

  return S.mesai.filter(m => {
    if(!kisiId.has(m.pid)) return false;
    const p = per(m.pid); if(!p) return false;
    if(!ayKapsar(m.tarih, S.yil, 'mesai')) return false;
    if(m.durum === 'reddedildi') return false;
    if(msF.dept.length && !msF.dept.includes(p.dept)) return false;
    if(msF.lok.length && !msF.lok.includes(p.lokasyon || '')) return false;
    if(msF.durum.length && !msF.durum.includes(DURUM_AD[m.durum])) return false;
    if(q && !((p.ad+' '+p.soyad+' '+p.unvan+' '+(m.aciklama||'')).toLocaleLowerCase('tr').includes(q))) return false;
    return true;
  }).sort((x,y) => y.tarih.localeCompare(x.tarih) || adSoyad(x.pid).localeCompare(adSoyad(y.pid),'tr'));
}

/* Mesai listesi detayının altındaki toplam satırı */
function msDipToplam(kayitlar){
  const sayilan = kayitlar.filter(m => m.durum !== 'reddedildi' && m.durum !== 'iptal');
  if(!sayilan.length) return '';
  const saat = sayilan.reduce((a,m) => a + m.sure, 0);
  const tutar = sayilan.filter(m => m.karsilik === 'ucret').reduce((a,m) => a + mesaiTutar(m), 0);
  const bekleyen = sayilan.filter(m => BEKLEYEN.includes(m.durum));
  const bekSaat = bekleyen.reduce((a,m) => a + m.sure, 0);
  const bekTutar = bekleyen.filter(m => m.karsilik === 'ucret').reduce((a,m) => a + mesaiTutar(m), 0);
  const kisi = new Set(sayilan.map(m => m.pid)).size;

  return '<tr class="dip"><td class="stl" colspan="3"><b>Toplam · '+sayilan.length+' kayıt · '+kisi+' kişi</b></td>'
    + '<td colspan="2"></td>'
    + '<td data-e="Süre" class="num"><b>'+sayi(saat)+'</b>'
      + (bekSaat ? '<div class="hint" style="font-size:11px">'+sayi(bekSaat)+' bekliyor</div>' : '')+'</td>'
    + '<td data-e="Tutar" class="num mono"><b>'+sayi(tutar)+' ₺</b>'
      + (bekTutar ? '<div class="hint" style="font-size:11px">'+sayi(bekTutar)+' ₺ bekliyor</div>' : '')+'</td>'
    + '<td colspan="2"></td></tr>';
}

/* İzinli Personel Listesi — kişi başına özet; detay tablosuyla aynı sütun düzeni */
function lstOzetTablo(kayitlar, depts, loks){
  const grup = {};
  for(const i of kayitlar){
    const pay = izinPayi(i, S.yil, 'liste');
    const g = grup[i.pid] = grup[i.pid] || {pid:i.pid, adet:0, gun:0, ilk:pay.bas, son:pay.bit,
                                           tamBitis:pay.tamBitis, durumlar:{}, turler:{}};
    g.adet++; g.gun += pay.gun;
    if(pay.bas < g.ilk) g.ilk = pay.bas;
    if(pay.bit > g.son){ g.son = pay.bit; g.tamBitis = pay.tamBitis; }
    g.durumlar[i.durum] = (g.durumlar[i.durum] || 0) + pay.gun;
    g.turler[i.tur] = (g.turler[i.tur] || 0) + pay.gun;

    + '<th>Lokasyon<div class="fsat"><select onchange="lstFiltre(\'lok\',this.value)"><option value="">Tümü</option>'
      + loks.map(x => '<option'+(x===lstF.lok?' selected':'')+'>'+esc(x)+'</option>').join('')+'</select></div></th>'
    + '<th class="num">Gün</th>'
    + '<th>Durum<div class="fsat"><select onchange="lstFiltre(\'durum\',this.value)"><option value="">Tümü</option>'
      + Object.entries(DURUM_AD).filter(x => x[0] !== 'taslak' && x[0] !== 'reddedildi')
          .map(x => '<option value="'+x[0]+'"'+(x[0]===lstF.durum?' selected':'')+'>'+esc(x[1])+'</option>').join('')+'</select></div></th>'
    + '<th class="str"></th></tr></thead><tbody>';

  for(const g of satirlar){
    const p = per(g.pid) || {};
    h += '<tr><td class="stl"><div style="font-weight:600">'+esc(adSoyad(g.pid))+'</div>'
      + '<div class="hint" style="font-size:11.5px">'+esc(p.unvan||'')+'</div></td>'
      + '<td class="hint">'+esc(p.dept||'')+'</td>'
      + '<td class="hint">'+esc(p.lokasyon||'—')+'</td>'
      + '<td class="num" style="font-weight:700">'+sayi(g.gun)+'</td>'
      + '<td><div style="display:flex;flex-direction:column;gap:4px;align-items:flex-start">'
        + Object.entries(g.durumlar).sort((a,b) => b[1] - a[1]).map(([k,v]) =>

        + '</div></td>'
      + '<td class="str"><button class="btn sm" onclick="kisiKayitlari(\''+g.pid+'\',\'izin\',\''+ayAraliklari(S.yil,'liste')[0].bas+'\',\''+ayAraliklari(S.yil,'liste').slice(-1)[0].bit+'\')">Kayıtlar</button></td></tr>';
  }
  h += '<tr style="border-top:2px solid var(--line)"><td class="stl" style="font-weight:700">Toplam · '+satirlar.length+' kişi</td>'

/* Mesai listesi — kişi başına özet */
function msOzetTablo(kayitlar, depts, loks){
  const grup = {};
  for(const m of kayitlar){
    const t = mturBul(m.tur);
    const g = grup[m.pid] = grup[m.pid] || {pid:m.pid, adet:0, saat:0, ucretSaat:0, tutar:0, izinSaat:0,
                                            bekleyen:0, durumlar:{}};
    g.adet++;
    g.durumlar[m.durum] = (g.durumlar[m.durum] || 0) + m.sure;
    if(BEKLEYEN.includes(m.durum)) g.bekleyen += m.sure;
    if(!GECERLI.includes(m.durum) && !BEKLEYEN.includes(m.durum)) continue;
    g.saat += m.sure;
    if(m.karsilik === 'ucret'){ g.ucretSaat += m.sure * t.carpan; g.tutar += mesaiTutar(m); }
    else g.izinSaat += m.sure * t.carpan;
  }
  const satirlar = Object.values(grup).sort((a,b) => b.saat - a.saat || adSoyad(a.pid).localeCompare(adSoyad(b.pid),'tr'));
  if(!satirlar.length) return '<div class="bd flush"><div class="empty"><div class="e1">Kayıt bulunamadı</div>Filtreleri ya da dönemi değiştirin.</div></div>';

  let h = '<div class="bd flush"><div class="twpair">'+ustCubuk()+'<div class="tw"><table class="ptbl"><thead><tr>'
    + '<th class="stl">Personel<div class="fsat">'
      + '<input type="text" id="msAraKutu" placeholder="Ara…" value="'+esc(msF.q)+'" oninput="msAra(this.value)"></div></th>'
    + '<th>'+baslikSecici('msDept_o','Departman', depts, msF.dept, 'msDeptSec')+'</th>'
    + '<th>'+baslikSecici('msLok_o','Lokasyon', loks, msF.lok, 'msLokSec')+'</th>'
    + '<th class="num">Toplam saat</th><th class="num">Tutar</th>'
    + '<th>'+baslikSecici('msDurum_o','Durum', msDurumlar(), msF.durum, 'msDurumSec', false, true)+'</th>'
    + '<th class="str"></th></tr></thead><tbody>';

  for(const g of satirlar){
    const p = per(g.pid) || {};
    h += '<tr><td class="stl"><div style="font-weight:600">'+esc(adSoyad(g.pid))+'</div>'
      + '<div class="hint" style="font-size:11.5px">'+esc(p.unvan||'')+'</div></td>'
      + '<td class="hint">'+esc(p.dept||'')+'</td>'
      + '<td class="hint">'+esc(p.lokasyon||'—')+'</td>'
      + '<td class="num" style="font-weight:700">'+sayi(g.saat)+'</td>'
      + '<td class="num mono" style="font-size:12.5px">'+sayi(g.tutar)+' ₺</td>'
      + '<td><div style="display:flex;flex-direction:column;gap:4px;align-items:flex-start">'
        + Object.entries(g.durumlar).sort((a,b) => b[1] - a[1]).map(([k,v]) =>
            '<span style="display:inline-flex;align-items:center;gap:6px;white-space:nowrap">'
            + durumTag(k) + '<b class="mono" style="font-size:12.5px">'+sayi(v)+' saat</b></span>').join('')
        + '</div></td>'
      + '<td class="str"><button class="btn sm" onclick="kisiKayitlari(\''+g.pid+'\',\'mesai\',\''+ayAraliklari(S.yil,'mesai')[0].bas+'\',\''+ayAraliklari(S.yil,'mesai').slice(-1)[0].bit+'\')">Kayıtlar</button></td></tr>';
  }
  h += '<tr style="border-top:2px solid var(--line)"><td class="stl" style="font-weight:700">Toplam · '+satirlar.length+' kişi</td>'
    + '<td></td><td></td>'
    + '<td class="num" style="font-weight:700">'+sayi(satirlar.reduce((a,g)=>a+g.saat,0))+'</td>'
    + '<td class="num mono" style="font-weight:700">'+sayi(satirlar.reduce((a,g)=>a+g.tutar,0))+' ₺</td>'
    + '<td></td><td class="str"></td></tr>';
  return h + '</tbody></table></div></div></div>';
}

let izindeDept = '', izindeLok = '';

  if(alan === 'dept') izindeDept = deger; else izindeLok = deger;
  S.izindeModal ? izindeAcCiz() : ciz();
}
function izindeTemizle(){
  izindeDept = ''; izindeLok = '';
  S.izindeModal ? izindeAcCiz() : ciz();
}

/* Dar ekranda pencere olarak açılır; içerik arttıkça pencere uzar */
function izindeAc(){
  S.izindeModal = true;
  izindeAcCiz();
}
function izindeAcCiz(){

  const kapsam = S.personel.filter(p => p.aktif);
  const depts = [...new Set(kapsam.map(p => p.dept))].sort((a,b) => a.localeCompare(b,'tr'));
  const loks = [...new Set(kapsam.map(p => p.lokasyon || '').filter(Boolean))].sort((a,b) => a.localeCompare(b,'tr'));

  modalAc('<div class="mh"><h3 class="mbaslik">KİMLER İZİNDE</h3>'

    + '<select class="tamsat" onchange="izindeFiltre(\'lok\',this.value)"><option value="">Tüm lokasyonlar</option>'
    + loks.map(x => '<option'+(x===izindeLok?' selected':'')+'>'+esc(x)+'</option>').join('')+'</select>'

        const p = per(x.i.pid) || {};
        return '<div class="izsatir">'
          + '<div style="flex:1;min-width:0">'

function izindeKapat(){ S.izindeModal = false; modalKapat(); }

/* Seçili tarihte (varsayılan bugün) izinde olanlar */
function izindeHedef(){ return S.izindeTarih || bugun(); }
function izindeGunKaydir(n){ const dt = d(izindeHedef()); dt.setDate(dt.getDate()+n); S.izindeTarih = iso(dt); ciz(); }
function izindeAyKaydir(n){ const dt = d(izindeHedef()); dt.setMonth(dt.getMonth()+n); S.izindeTarih = iso(dt); ciz(); }
function izindeBugune(){ S.izindeTarih = null; ciz(); }
function izindeSatirlar(hedef){
  const bg = hedef || bugun();
  const kisiId = new Set(S.personel.filter(p => p.aktif
      && (!izindeDept || p.dept === izindeDept)
      && (!izindeLok || (p.lokasyon || '') === izindeLok)).map(p => p.id));
  const l = [];
  for(const i of S.izin){
    if(!kisiId.has(i.pid)) continue;
    if(!GECERLI.includes(i.durum) && !BEKLEYEN.includes(i.durum)) continue;
    if(i.bas > bg || i.bit < bg) continue;                 // bugün izinde değil
    l.push({i, donus: sonrakiIsGunu(i.bit)});
  }
  return l.sort((x,y) => x.donus.localeCompare(y.donus) || adSoyad(x.i.pid).localeCompare(adSoyad(y.i.pid),'tr'));
}

/* Bugün izinde olan kişi sayısı (karttaki rakam) */
function izindeKisiSayisi(){
  const bg = bugun();
  const kisiId = new Set(S.personel.filter(p => p.aktif).map(p => p.id));
  const kume = new Set();
  for(const i of S.izin){
    if(!kisiId.has(i.pid)) continue;
    if(!GECERLI.includes(i.durum) && !BEKLEYEN.includes(i.durum)) continue;
    if(i.bas > bg || i.bit < bg) continue;
    kume.add(i.pid);
  }
  return kume.size;
}

function vIzinde(){
  const kapsam = takvimKisiler();        // yetki kapsamı: personel yalnız kendisi, yönetici kendi+altı, üst yönetim/İK tümü
  const depts = [...new Set(kapsam.map(p => p.dept))].sort((a,b) => a.localeCompare(b,'tr'));
  const loks  = [...new Set(kapsam.map(p => p.lokasyon || '').filter(Boolean))].sort((a,b) => a.localeCompare(b,'tr'));
  const seciliAy    = S.raporAy    || (S.raporAy = []);
  const seciliDept  = S.raporDept  || (S.raporDept = []);
  const seciliLok   = S.raporLok   || (S.raporLok = []);
  const seciliTur   = S.raporTur   || (S.raporTur = []);
  const seciliDurum = S.raporDurum || (S.raporDurum = []);
  const ara = (S.raporAra || '').toLocaleLowerCase('tr');
  const aktifId = new Set(kapsam.map(p => p.id));

  // Her başlık kendi filtresini taşır; boş seçim = o sütunda tümü.
  // Kullanım dökümü gibi: ay seçilince izin o aya kırpılır (yalnız o aya isabet eden kısım).
  const gecer = i =>
        aktifId.has(i.pid)
        && (GECERLI.includes(i.durum) || BEKLEYEN.includes(i.durum))
        && (!ara || adSoyad(i.pid).toLocaleLowerCase('tr').includes(ara))
        && (!seciliDept.length || seciliDept.includes(per(i.pid)?.dept))
        && (!seciliLok.length || seciliLok.includes(per(i.pid)?.lokasyon || ''))
        && (!seciliTur.length || seciliTur.includes(turBul(i.tur).ad))
        && (!seciliDurum.length || seciliDurum.includes(DURUM_AD[i.durum]));
  const secmece = (seciliAy.length && seciliAy.length < 12) ? seciliAy.slice().sort((a,b)=>a-b) : [''];   // hepsi/boş = tüm yıl (bölmeden)
  const satirlar = [];
  for(const i of S.izin){
    if(!gecer(i)) continue;
    for(const m of secmece){
      const pay = dokumPayi(i, S.yil, m);      // m='' → yıl geneli; sayı → yalnız o aya kırpılmış kısım
      if(pay) satirlar.push({i, pay});
    }
  }
  satirlar.sort((a,b) => a.pay.bas.localeCompare(b.pay.bas) || adSoyad(a.i.pid).localeCompare(adSoyad(b.i.pid),'tr'));

  const ayEtiket = seciliAy.length ? seciliAy.slice().sort((a,b)=>a-b).map(m=>AY[m]).join(', ') : 'Tüm yıl';
  const deptEtiket = seciliDept.length ? seciliDept.length+' departman' : 'Tüm departmanlar';
  const lokEtiket  = seciliLok.length ? seciliLok.length+' lokasyon' : 'Tüm lokasyonlar';
  const toplamGun = satirlar.reduce((a,x)=> a + x.pay.gun, 0);

  let h = '<h1 style="font-size:20px;margin-bottom:4px">İzin raporu</h1>'
    + '<div class="hint" style="margin-bottom:12px">'+S.yil+' · '+esc(ayEtiket)+' · '+esc(deptEtiket)+' · '+esc(lokEtiket)
    + ' · '+satirlar.length+' izin · '+sayi(toplamGun)+' gün</div>';

  // Filtreler ayrı satır değil; Departman/Lokasyon kendi başlıklarında, Ay ise Tarih başlığında seçilir.
  h += '<div class="card izindekart"><div class="bd flush">'
    + '<table class="ptbl" style="width:100%;table-layout:fixed"><thead><tr>'
      + '<th class="stl" style="width:16%">Personel<div class="fsat"><input type="text" id="raporAraKutu" style="min-width:0" placeholder="Ara…" value="'+esc(S.raporAra||'')+'" oninput="raporAraSet(this.value)"></div></th>'
      + '<th style="width:14%">'+baslikSecici('rapor_dept','Departman', depts, seciliDept, 'raporDeptSec')+'</th>'
      + '<th style="width:14%">'+(loks.length ? baslikSecici('rapor_lok','Lokasyon', loks, seciliLok, 'raporLokSec') : 'Lokasyon')+'</th>'
      + '<th style="width:15%">'+baslikSecici('rapor_tur','Tür', raporTurler(), seciliTur, 'raporTurSec')+'</th>'
      + '<th style="width:16%">'+baslikSecici('rapor_ay','Tarih', AY, seciliAy.map(ix=>AY[ix]), 'raporAySec', true)+'</th>'
      + '<th class="num" style="width:7%">Gün</th>'
      + '<th style="width:18%">'+baslikSecici('rapor_durum','Durum', raporDurumlar(), seciliDurum, 'raporDurumSec')+'</th></tr></thead><tbody>';
  if(!satirlar.length) h += '<tr><td colspan="7"><div class="empty"><div class="e1">Seçilen kapsamda izin kaydı yok</div>Başlıklardaki filtreleri (arama / Departman / Lokasyon / Tür / Tarih / Durum) değiştirin.</div></td></tr>';
  else for(const x of satirlar){
    const i = x.i, pay = x.pay, p = per(i.pid) || {}, t = turBul(i.tur);
    h += '<tr><td class="stl"><div style="font-weight:600">'+esc(adSoyad(i.pid))+'</div>'
      + '<div class="hint" style="font-size:11.5px">'+esc(p.unvan||'')+'</div></td>'
      + '<td class="hint">'+esc(p.dept||'')+'</td>'
      + '<td class="hint">'+esc(p.lokasyon||'—')+'</td>'
      + '<td><span class="tag n" style="border-color:'+t.renk+'55;color:'+t.renk+'"><i class="dot"></i>'+esc(t.ad)+'</span></td>'
      + '<td class="mono" style="font-size:12.5px">'
        + (saatliIzin(i) ? trTarih(pay.bas)+' · '+i.saatBas+'–'+i.saatBit : trTarih(pay.bas)+' – '+trTarih(pay.bit))
        + (pay.kirpik ? ' <span class="pill" title="Seçili aya kırpıldı">kısmi</span>' : '')+'</td>'
      + '<td class="num">'+(saatliIzin(i) ? sayi(i.saat)+' sa' : sayi(pay.gun))+'</td>'
      + '<td>'+durumTag(i.durum)+'</td></tr>';
  }
  h += '</tbody></table></div></div>';
  return h;
}

/* Tümünü seç / kaldır (Excel gibi): hepsi seçiliyse temizle, değilse tümünü seç */
function tumunuSecToggle(mevcut, tumListe){ return (mevcut && mevcut.length >= tumListe.length) ? [] : tumListe.slice(); }

/* İzin raporu filtreleri — cokSecici ile (indeksle çağrılır, null = Tümünü seç/kaldır; boş = hepsi) */
function raporDeptler(){ return [...new Set(S.personel.filter(p=>p.aktif).map(p=>p.dept))].sort((a,b)=>a.localeCompare(b,'tr')); }
function raporLoklar(){ return [...new Set(S.personel.filter(p=>p.aktif).map(p=>p.lokasyon||'').filter(Boolean))].sort((a,b)=>a.localeCompare(b,'tr')); }
function raporAySec(i){ if(i===null){ S.raporAy=tumunuSecToggle(S.raporAy,[...Array(12).keys()]); ciz(); return; } S.raporAy=S.raporAy||[]; const j=S.raporAy.indexOf(i); if(j<0) S.raporAy.push(i); else S.raporAy.splice(j,1); ciz(); }
function raporDeptSec(i){ if(i===null){ S.raporDept=tumunuSecToggle(S.raporDept,raporDeptler()); ciz(); return; } const ad=raporDeptler()[i]; if(ad===undefined) return; S.raporDept=S.raporDept||[]; const j=S.raporDept.indexOf(ad); if(j<0) S.raporDept.push(ad); else S.raporDept.splice(j,1); ciz(); }
function raporLokSec(i){ if(i===null){ S.raporLok=tumunuSecToggle(S.raporLok,raporLoklar()); ciz(); return; } const ad=raporLoklar()[i]; if(ad===undefined) return; S.raporLok=S.raporLok||[]; const j=S.raporLok.indexOf(ad); if(j<0) S.raporLok.push(ad); else S.raporLok.splice(j,1); ciz(); }
function raporTurler(){ return S.ayar.izinTurleri.map(t=>t.ad); }
function raporDurumlar(){ return ['onaylandi','yonetici_bekliyor','iptal_bekliyor'].map(k=>DURUM_AD[k]); }
function raporTurSec(i){ if(i===null){ S.raporTur=tumunuSecToggle(S.raporTur,raporTurler()); ciz(); return; } const ad=raporTurler()[i]; if(ad===undefined) return; S.raporTur=S.raporTur||[]; const j=S.raporTur.indexOf(ad); if(j<0) S.raporTur.push(ad); else S.raporTur.splice(j,1); ciz(); }
function raporDurumSec(i){ if(i===null){ S.raporDurum=tumunuSecToggle(S.raporDurum,raporDurumlar()); ciz(); return; } const ad=raporDurumlar()[i]; if(ad===undefined) return; S.raporDurum=S.raporDurum||[]; const j=S.raporDurum.indexOf(ad); if(j<0) S.raporDurum.push(ad); else S.raporDurum.splice(j,1); ciz(); }
function raporAraSet(v){ S.raporAra=v; ciz(); const el=document.getElementById('raporAraKutu'); if(el){ el.focus(); try{ el.setSelectionRange(el.value.length, el.value.length); }catch(e){} } }



/* ===================== KADRO VE ÜCRET RAPORU (İK) ===================== */

function kadroKisiler(){ return S.personel.filter(p => p.aktif); }

/* Tablolarda ücret hücresi: tutar aylık karşılık, günlük ücretlilerde yevmiye alt satırda */
function ucretHucre(p){
  if(!aylikUcret(p)) return '<span class="hint">tanımsız</span>';
  return sayi(aylikUcret(p))+' ₺'
    + (ucretTipi(p) === 'gunluk'
        ? '<div class="hint" style="font-family:\'Inter\';font-size:11px">günlük '+sayi(p.ucret)+' ₺ × '+ayGun(p)+' gün</div>'
        : '');
}

function kadroTopla(alan){
  const harita = new Map();
  for(const p of kadroKisiler()){
    const k = (alan === 'dept' ? p.dept : p.lokasyon) || '—';
    const g = harita.get(k) || {ad:k, kisi:0, ucret:0, ucretli:0};
    g.kisi++;
    const u = aylikUcret(p);
    if(u > 0){ g.ucret += u; g.ucretli++; }
    harita.set(k, g);
  }
  return [...harita.values()].sort((a,b) => b.kisi - a.kisi || a.ad.localeCompare(b.ad,'tr'));
}

function kadroTablo(baslik, satirlar){
  const toplamKisi = satirlar.reduce((a,x) => a + x.kisi, 0);
  const toplamUcret = satirlar.reduce((a,x) => a + x.ucret, 0);
  let h = '<div class="twpair"><div class="tw"><table class="ptbl"><thead><tr>'
    + '<th class="stl">'+baslik+'</th><th class="num">Kişi</th>'
    + '<th class="num">Toplam ücret</th><th class="num">Ortalama</th><th class="num">Pay</th>'
    + '</tr></thead><tbody>';
  for(const x of satirlar){
    const pay = toplamKisi ? Math.round(x.kisi / toplamKisi * 100) : 0;
    const alan = baslik === 'Lokasyon' ? 'lok' : 'dept';
    const anahtar = alan+'|'+x.ad;
    const acik = S.kadroAcik === anahtar;
    h += '<tr class="acilir'+(acik?' acikbas':'')+'" onclick="kadroAc(\''+kacir(anahtar)+'\')">'
      + '<td class="stl"><b>'+esc(x.ad)+'</b> <span class="acok">'+(acik?'⌄':'›')+'</span></td>'
      + '<td class="num">'+x.kisi+'</td>'
      + '<td class="num mono">'+(x.ucret ? sayi(x.ucret)+' ₺' : '<span class="hint">—</span>')+'</td>'
      + '<td class="num mono">'+(x.ucretli ? sayi(Math.round(x.ucret / x.ucretli))+' ₺'
          : '<span class="hint">—</span>')+'</td>'
      + '<td class="num"><span class="pill">%'+pay+'</span></td></tr>';
    if(acik) h += '<tr class="detaysatir"><td colspan="5">'+kadroDetayIc(alan, x.ad)+'</td></tr>';
  }
  h += '<tr class="dip"><td class="stl"><b>Toplam</b></td>'
    + '<td class="num"><b>'+toplamKisi+'</b></td>'
    + '<td class="num mono"><b>'+sayi(toplamUcret)+' ₺</b></td>'
    + '<td class="num mono"><b>'+(toplamKisi ? sayi(Math.round(toplamUcret / toplamKisi)) : 0)+' ₺</b></td>'
    + '<td></td></tr>';
  return h + '</tbody></table></div></div>';
}

function kadroCapraz(){
  const kisiler = kadroKisiler();
  const depts = [...new Set(kisiler.map(p => p.dept))].sort((a,b) => a.localeCompare(b,'tr'));
  const loks = [...new Set(kisiler.map(p => p.lokasyon || '—'))].sort((a,b) => a.localeCompare(b,'tr'));
  const say = (dp, lk) => kisiler.filter(p => p.dept === dp && (p.lokasyon || '—') === lk).length;

  let h = '<div class="twpair"><div class="tw"><table class="ptbl"><thead><tr><th class="stl">Departman</th>'
    + loks.map(l => '<th class="num">'+esc(l)+'</th>').join('')
    + '<th class="num">Toplam</th></tr></thead><tbody>';
  for(const dp of depts){
    const satir = loks.map(l => say(dp, l));
    h += '<tr><td class="stl"><b>'+esc(dp)+'</b></td>'
      + satir.map((v, ix) => {
          const ank = 'capraz|'+dp+'|'+loks[ix];
          const ac = S.kadroAcik === ank;
          return '<td class="num'+(v ? ' acilir' : '')+(ac?' acikbas':'')+'"'
            + (v ? ' title="'+esc(dp)+' · '+esc(loks[ix])+' — kişileri gör"'
                 + ' onclick="kadroAc(\''+kacir(ank)+'\')"' : '')
            + '>'+(v ? v+' <span class="acok">'+(ac?'⌄':'›')+'</span>' : '<span class="hint">·</span>')+'</td>';
        }).join('')
      + '<td class="num"><b>'+satir.reduce((a,v) => a + v, 0)+'</b></td></tr>';
    if(S.kadroAcik && S.kadroAcik.startsWith('capraz|'+dp+'|'))
      h += '<tr class="detaysatir"><td colspan="'+(loks.length+2)+'">'
        + kadroDetayIc('capraz', dp, S.kadroAcik.split('|')[2])+'</td></tr>';
  }
  h += '<tr class="dip"><td class="stl"><b>Toplam</b></td>'
    + loks.map(l => '<td class="num"><b>'+kisiler.filter(p => (p.lokasyon || '—') === l).length+'</b></td>').join('')
    + '<td class="num"><b>'+kisiler.length+'</b></td></tr>';
  return h + '</tbody></table></div></div>';
}

function vKadro(){
  const kisiler = kadroKisiler();
  const ucretli = kisiler.filter(p => aylikUcret(p) > 0);
  const toplamUcret = ucretli.reduce((a,p) => a + aylikUcret(p), 0);

        + [...new Set(kisiler.map(p => p.lokasyon || '—'))].length+' lokasyon')
    + stat('Aylık ücret toplamı', sayi(toplamUcret), '₺', 'Brüt · '+ucretli.length+' kişi üzerinden'
        + (gunlukSayisi ? ' · '+gunlukSayisi+' kişi günlük ücretli' : ''))
    + stat('Ortalama ücret', ucretli.length ? sayi(Math.round(toplamUcret / ucretli.length)) : 0, '₺',
        'Ücreti tanımlı personel')
    + stat('Ücreti tanımsız', kisiler.length - ucretli.length, 'kişi',
        (kisiler.length - ucretli.length) ? 'Personel kartından girilmeli' : 'Tüm kayıtlar tam')
    + '</div>';

  h += '<div class="card"><div class="hd"><div class="tabs">'
    + '<button class="'+(sekme==='liste'?'on':'')+'" onclick="S.sekme.kadro=\'liste\';ciz()">Liste</button>'
    + '<button class="'+(sekme==='dept'?'on':'')+'" onclick="S.sekme.kadro=\'dept\';ciz()">Departman</button>'
    + '<button class="'+(sekme==='lok'?'on':'')+'" onclick="S.sekme.kadro=\'lok\';ciz()">Lokasyon</button>'
    + '<button class="'+(sekme==='capraz'?'on':'')+'" onclick="S.sekme.kadro=\'capraz\';ciz()">Çapraz</button>'
    + '</div><div class="sp"><button class="btn sm" onclick="kadroDisaAktar()">CSV indir</button></div></div>'
    + '<div class="bd flush">'
    + (sekme === 'dept' ? kadroTablo('Departman', kadroTopla('dept'))
       : sekme === 'lok' ? kadroTablo('Lokasyon', kadroTopla('lok'))
       : sekme === 'capraz' ? kadroCapraz()
       : kadroListe())
    + '</div></div>';
  return h;
}

function kadroDisaAktar(){
  const sekme = S.sekme.kadro || 'liste';
  if(sekme === 'liste' || sekme === 'capraz'){
    const kisiler = kadroKisiler().sort((a,b) => adSoyad(a.id).localeCompare(adSoyad(b.id),'tr'));
    const bas = ['Ad Soyad','Unvan','Departman','Lokasyon','Yönetici','İşe giriş',
                 'Ücret tipi','Girilen ücret','Aylık ücret'];
    const satir = kisiler.map(p => [adSoyad(p.id), p.unvan||'', p.dept||'', p.lokasyon||'',
      p.yonetici ? adSoyad(p.yonetici) : '', trTarih(p.giris),
      ucretTipiAd(p), p.ucret||0, aylikUcret(p)].join(';'));
    indir('\uFEFF'+bas.join(';')+'\n'+satir.join('\n'), 'kadro-liste-'+bugun()+'.csv', 'text/csv;charset=utf-8');
    bildir(kisiler.length+' kayıt indirildi.');
    return;
  }
  const alan = sekme === 'lok' ? 'lok' : 'dept';
  const satirlar = kadroTopla(alan);
  const bas = [alan === 'lok' ? 'Lokasyon' : 'Departman', 'Kişi', 'Toplam ücret', 'Ortalama ücret'];
  const satir = satirlar.map(x =>
    [x.ad, x.kisi, x.ucret, x.ucretli ? Math.round(x.ucret / x.ucretli) : 0].join(';'));
  indir('\uFEFF'+bas.join(';')+'\n'+satir.join('\n'), 'kadro-'+alan+'-'+bugun()+'.csv', 'text/csv;charset=utf-8');
  bildir('CSV indirildi.');
}


/* Grup satırını açar/kapatır */
function kadroAc(anahtar){
  S.kadroAcik = (S.kadroAcik === anahtar) ? '' : anahtar;
  ciz();
}
/* Tırnak kaçışı */
function kacir(t){ return String(t).replace(/\\/g,'\\\\').replace(/'/g, "\\'"); }

function kadroKisileri(alan, ad, ikinci){
  const hepsi = kadroKisiler();
  const l = alan === 'capraz' ? hepsi.filter(p => p.dept === ad && (p.lokasyon || '—') === ikinci)
    : alan === 'lok' ? hepsi.filter(p => (p.lokasyon || '—') === ad)
    : hepsi.filter(p => p.dept === ad);
  return l.sort((a,b) => aylikUcret(b) - aylikUcret(a) || adSoyad(a.id).localeCompare(adSoyad(b.id),'tr'));
}

/* Satırın altında açılan kişi listesi */
function kadroDetayIc(alan, ad, ikinci){
  const kisiler = kadroKisileri(alan, ad, ikinci);
  const ucretli = kisiler.filter(p => aylikUcret(p) > 0);
  const toplam = ucretli.reduce((a,p) => a + aylikUcret(p), 0);
  const ikSut = alan === 'lok' ? 'Departman' : alan === 'dept' ? 'Lokasyon' : '';

  return '<div class="kadrodetay">'
  + '<div class="row" style="margin-bottom:8px;align-items:center">'
    + '<div class="hint">'+kisiler.length+' kişi · toplam '+sayi(toplam)+' ₺'
    + (ucretli.length ? ' · ortalama '+sayi(Math.round(toplam/ucretli.length))+' ₺' : '')+'</div>'
    + '<div class="sp"><button class="btn sm" onclick="event.stopPropagation();kadroDetayAktar(\''
      + kacir(alan)+'\',\''+kacir(ad)+'\',\''+kacir(ikinci||'')+'\')">Excel indir</button></div>'
  + '</div>'
  + '<table class="ictablo"><thead><tr><th>Personel</th><th>Unvan</th>'
  + (ikSut ? '<th>'+ikSut+'</th>' : '')
  + '<th>İşe giriş</th><th class="num">Aylık ücret</th></tr></thead><tbody>'
  + kisiler.map(p =>
      '<tr><td><b>'+esc(adSoyad(p.id))+'</b></td>'
      + '<td class="hint">'+esc(p.unvan||'')+'</td>'
      + (ikSut ? '<td class="hint">'+esc(alan === 'lok' ? (p.dept||'') : (p.lokasyon||'—'))+'</td>' : '')
      + '<td class="mono hint">'+trTarih(p.giris)+'</td>'
      + '<td class="num mono">'+ucretHucre(p)+'</td></tr>').join('')
  + '<tr class="ictoplam"><td colspan="'+(ikSut?3:2)+'"><b>Toplam</b></td><td></td>'
  + '<td class="num mono"><b>'+sayi(toplam)+' ₺</b></td></tr>'
  + '</tbody></table></div>';
}

/* Açılan listeyi Excel'e (CSV) aktarır */
function kadroDetayAktar(alan, ad, ikinci){
  const kisiler = kadroKisileri(alan, ad, ikinci || undefined);
  const bas = ['Ad Soyad','Unvan','Departman','Lokasyon','İşe giriş',
               'Ücret tipi','Girilen ücret','Aylık ücret'];
  const satir = kisiler.map(p => [adSoyad(p.id), p.unvan||'', p.dept||'', p.lokasyon||'',
    trTarih(p.giris), ucretTipiAd(p), p.ucret||0, aylikUcret(p)].join(';'));
  const dosya = 'kadro-'+(ad+(ikinci?'-'+ikinci:'')).replace(/[^A-Za-z0-9ĞÜŞİÖÇğüşıöç]+/g,'-')+'.csv';
  indir('\uFEFF'+bas.join(';')+'\n'+satir.join('\n'), dosya, 'text/csv;charset=utf-8');
  bildir(kisiler.length+' kayıt indirildi.');
}


/* Kadro raporu — tüm personel listesi; satıra tıklayınca personel kartı açılır */
let kadroAra = '', kadroSira = '';
let kadroSec = {dept:[], lok:[], yon:[], ucret:[]};      // çoklu seçim
let kadroLst = {dept:[], lok:[], yon:[], ucret:[]};      // seçenekler

/* ix null ise temizler; değilse seçeneği açar/kapatır */
function kadroSecim(alan, ix){
  if(ix === null) kadroSec[alan] = tumunuSecToggle(kadroSec[alan], kadroLst[alan] || []);
  else {
    const v = kadroLst[alan][ix];
    const l = kadroSec[alan], y = l.indexOf(v);
    if(y < 0) l.push(v); else l.splice(y, 1);
  }
  ciz();
}
function kadroSecDept(ix){ kadroSecim('dept', ix); }
function kadroSecLok(ix){ kadroSecim('lok', ix); }
function kadroSecYon(ix){ kadroSecim('yon', ix); }
function kadroSecUcret(ix){ kadroSecim('ucret', ix); }

/* Sütun adını taşıyan çoklu seçim düğmesi */
function kadroSecici(etiket, alan, fn){
  const secili = kadroSec[alan], secenekler = kadroLst[alan];
  const acik = S.acikSecici === 'kadro_'+alan;
  const et = !secili.length ? etiket
    : secili.length === 1 ? secili[0]
    : etiket+' · '+secili.length;
  return '<div class="coksec">'
    + '<button type="button" class="basliksec cokbtn'+(secili.length?' dolu':'')+'"'
    + ' title="'+esc(secili.length ? secili.join(', ') : etiket)+'"'
    + ' onclick="event.stopPropagation();seciciAc(\'kadro_'+alan+'\')">'
    + '<span>'+esc(et)+'</span><i>▾</i></button>'
    + (acik
      ? '<div class="cokpan" onclick="event.stopPropagation()">'
        + '<div class="cokust"><b>'+(secili.length || 'Tüm')+' '+(secili.length ? 'seçili' : 'kayıtlar')+'</b>'
        + '<button type="button" onclick="'+fn+'(null)">'+(secili.length >= secenekler.length ? 'Temizle' : 'Tümünü seç')+'</button></div>'
        + '<div class="coklist">'
        + secenekler.map((x,i) => '<label><input type="checkbox" '+(secili.includes(x)?'checked':'')
            + ' onchange="'+fn+'('+i+')"><span>'+esc(x)+'</span></label>').join('')
        + '</div></div>'
      : '')
    + '</div>';
}

function kadroSirala(){
  kadroSira = kadroSira === 'desc' ? 'asc' : kadroSira === 'asc' ? '' : 'desc';
  ciz();
}

function kadroFiltre(alan, deger){
  if(alan === 'ara'){ kadroAra = deger; ciz(); }
}
function kadroTemizle(){
  kadroAra = ''; kadroSira = '';
  kadroSec = {dept:[], lok:[], yon:[], ucret:[]};
  ciz();
}

function kadroListe(){
  const hepsi = kadroKisiler();
  const depts = [...new Set(hepsi.map(p => p.dept))].sort((a,b) => a.localeCompare(b,'tr'));
  const loks = [...new Set(hepsi.map(p => p.lokasyon || '—'))].sort((a,b) => a.localeCompare(b,'tr'));
  const ara = kadroAra.toLocaleLowerCase('tr');

  const yonler = [...new Set(hepsi.map(p => p.yonetici).filter(Boolean))]
    .sort((a,b) => adSoyad(a).localeCompare(adSoyad(b),'tr'));

  kadroLst.dept = depts;
  kadroLst.lok = loks;
  kadroLst.yon = yonler.map(y => adSoyad(y));
  kadroLst.ucret = [...new Set(hepsi.map(p => aylikUcret(p)).filter(v => v > 0))]
    .sort((a,b) => b - a).map(v => sayi(v)+' ₺').concat(['Ücreti tanımsız']);

  const ucretEt = p => aylikUcret(p) > 0 ? sayi(aylikUcret(p))+' ₺' : 'Ücreti tanımsız';

  const kisiler = hepsi.filter(p =>
      (!kadroSec.dept.length || kadroSec.dept.includes(p.dept))
   && (!kadroSec.lok.length || kadroSec.lok.includes(p.lokasyon || '—'))
   && (!kadroSec.yon.length || kadroSec.yon.includes(p.yonetici ? adSoyad(p.yonetici) : ''))
   && (!kadroSec.ucret.length || kadroSec.ucret.includes(ucretEt(p)))
   && (!ara || (adSoyad(p.id)+' '+(p.unvan||'')).toLocaleLowerCase('tr').includes(ara)))
    .sort((a,b) => kadroSira === 'desc' ? aylikUcret(b) - aylikUcret(a)
                 : kadroSira === 'asc'  ? aylikUcret(a) - aylikUcret(b)
                 : adSoyad(a.id).localeCompare(adSoyad(b.id),'tr'));

  const toplam = kisiler.reduce((a,p) => a + aylikUcret(p), 0);
  const filtreVar = kadroAra || kadroSira || kadroSec.dept.length || kadroSec.lok.length
    || kadroSec.yon.length || kadroSec.ucret.length;

  let h = '<div class="bd" style="border-bottom:1px solid var(--line2)">'
    + '<div class="grid g5">'
    + '<input type="text" class="basliksec'+(kadroAra?' dolu':'')+'" placeholder="Personel"'
      + ' value="'+esc(kadroAra)+'" oninput="kadroFiltre(\'ara\',this.value)">'
    + kadroSecici('Departman', 'dept', 'kadroSecDept')
    + kadroSecici('Lokasyon', 'lok', 'kadroSecLok')
    + kadroSecici('Yönetici', 'yon', 'kadroSecYon')
    + '<div class="ucretsut">'
      + kadroSecici('Aylık ücret', 'ucret', 'kadroSecUcret')
      + '<button type="button" class="sirabtn'+(kadroSira?' dolu':'')+'" onclick="kadroSirala()"'
      + ' title="'+(kadroSira === 'desc' ? 'Yüksekten düşüğe' : kadroSira === 'asc' ? 'Düşükten yükseğe' : 'Ada göre')+'">'
      + (kadroSira === 'desc' ? '↓' : kadroSira === 'asc' ? '↑' : '⇅')+'</button>'
    + '</div>'
    + '</div>'
    + (filtreVar
        ? '<div class="row mt" style="align-items:center"><div class="sp">'
          + '<button class="btn sm" onclick="kadroTemizle()">Filtreleri temizle</button></div></div>'
        : '')
    + '</div>';

  h += '<div class="twpair"><div class="tw"><table class="ptbl"><thead><tr>'
    + '<th class="stl">Personel</th><th>Departman</th><th>Lokasyon</th>'
    + '<th>Yönetici</th><th>İşe giriş</th><th class="num">Aylık ücret</th></tr></thead><tbody>';

  for(const p of kisiler){
    h += '<tr class="acilir" onclick="personelForm(\''+p.id+'\')">'
      + '<td class="stl"><div style="font-weight:600">'+esc(adSoyad(p.id))+' <span class="acok">›</span></div>'
      + '<div class="hint" style="font-size:11.5px">'+esc(p.unvan||'')+'</div></td>'
      + '<td class="hint">'+esc(p.dept||'')+'</td>'
      + '<td class="hint">'+esc(p.lokasyon||'—')+'</td>'
      + '<td class="hint">'+esc(p.yonetici ? adSoyad(p.yonetici) : '—')+'</td>'
      + '<td class="mono hint" style="font-size:12.5px">'+trTarih(p.giris)+'</td>'
      + '<td class="num mono">'+ucretHucre(p)+'</td></tr>';
  }
  if(!kisiler.length) h += '<tr><td colspan="6"><div class="empty"><div class="e1">Kayıt bulunamadı</div>Filtreleri değiştirin.</div></td></tr>';
  else h += '<tr class="dip"><td class="stl"><b>Toplam · '+kisiler.length+' kişi</b></td>'
    + '<td colspan="4"></td><td class="num mono"><b>'+sayi(toplam)+' ₺</b></td></tr>';
  return h + '</tbody></table></div></div>';
}

function ikListesi(){
  const l = S.personel.filter(p => p.rol === 'ik' && p.aktif);
  return l.length ? l.map(p => esc(p.ad+' '+p.soyad)).join(', ') : 'Tanımlı değil';
}
/* Departmanlar ve altlarındaki unvanlar tek tabloda — gruplar tıklayınca açılır */
const SERBEST = '__serbest__';

function deptAcikMi(k){ S.acikDept = S.acikDept || {}; return !!S.acikDept[k]; }
function deptAc(ix){
  const k = ix >= 0 ? listeAl('dept')[ix] : SERBEST;
  if(k === undefined) return;
  S.acikDept = S.acikDept || {};
  S.acikDept[k] = !S.acikDept[k];
  ciz();
}
function deptHepsi(ac){
  S.acikDept = {};
  if(ac){
    for(const d of listeAl('dept')) S.acikDept[d] = true;
    S.acikDept[SERBEST] = true;
  }
  ciz();
}
function deptAcikSayisi(){
  S.acikDept = S.acikDept || {};
  return Object.values(S.acikDept).filter(Boolean).length;
}

function deptUnvanTablo(){
  const depts = listeAl('dept');
  const unvanlar = listeAl('unvan');
  const uIx = u => unvanlar.indexOf(u);
  const altdeptler = listeAl('altdept');
  const aIx = a => altdeptler.indexOf(a);

  const unvanSatiri = u => '<tr><td style="padding-left:34px">'
    + '<span class="hint" style="margin-right:6px">└</span>'+esc(u)+'</td>'
    + '<td class="num">'+listeKullanim('unvan',u)+'</td>'
    + '<td class="str">'
    + '<button class="btn sm" onclick="listeAdlandirAc(\'unvan\','+uIx(u)+')">Düzenle</button> '
    + '<button class="btn sm no" onclick="listeSil(\'unvan\','+uIx(u)+')">Sil</button></td></tr>';

  const altSatiri = a => '<tr><td style="padding-left:34px">'
    + '<span class="hint" style="margin-right:6px">└</span>'
    + '<span class="pill" style="margin-right:7px">alt dep.</span><b style="font-weight:600">'+esc(a)+'</b></td>'
    + '<td class="num">'+listeKullanim('altdept',a)+'</td>'
    + '<td class="str">'
    + '<button class="btn sm" onclick="listeAdlandirAc(\'altdept\','+aIx(a)+')">Düzenle</button> '
    + '<button class="btn sm no" onclick="listeSil(\'altdept\','+aIx(a)+')">Sil</button></td></tr>';

  const grupSatiri = (anahtar, tikla, sol, orta, sag) =>
    '<tr class="dgrup" onclick="'+tikla+'" title="'+(deptAcikMi(anahtar)?'Kapat':'Aç')+'">'
    + '<td><span class="chev">'+(deptAcikMi(anahtar)?'▾':'▸')+'</span>'+sol+'</td>'
    + '<td class="num">'+orta+'</td>'
    + '<td class="str" onclick="event.stopPropagation()">'+sag+'</td></tr>';

  let h = '<div class="twpair">' + ustCubuk() + '<div class="tw"><table class="dtbl"><thead><tr>'
    + '<th>Departman / alt departman / unvan</th><th class="num">Personel</th><th class="str">İşlem</th>'
    + '</tr></thead><tbody>';

  for(let i = 0; i < depts.length; i++){
    const d = depts[i];
    const altD = altdeptler.filter(a => altDeptDepti(a) === d);
    const unv  = unvanlar.filter(u => unvanDepti(u) === d);
    h += grupSatiri(d, 'deptAc('+i+')',
      '<b>'+esc(d)+'</b> <span class="hint">· '+altD.length+' alt departman · '+unv.length+' unvan</span>',
      '<b>'+listeKullanim('dept',d)+'</b>',
        '<button class="btn sm" onclick="altDeptEkleAc('+i+')">+ Alt departman</button> '
      + '<button class="btn sm" onclick="unvanEkleAc('+i+')">+ Unvan</button> '
      + '<button class="btn sm" onclick="listeAdlandirAc(\'dept\','+i+')">Düzenle</button> '
      + '<button class="btn sm no" onclick="listeSil(\'dept\','+i+')">Sil</button>');
    if(deptAcikMi(d)){
      h += altD.map(altSatiri).join('') + unv.map(unvanSatiri).join('');
      if(!altD.length && !unv.length)
        h += '<tr><td colspan="3" class="hint" style="padding-left:34px">Bu departmana bağlı alt departman veya unvan yok</td></tr>';
    }
  }

  const serbestU = unvanlar.filter(u => !unvanDepti(u) || !depts.includes(unvanDepti(u)));
  const serbestA = altdeptler.filter(a => !altDeptDepti(a) || !depts.includes(altDeptDepti(a)));
  if(serbestU.length || serbestA.length){
    h += grupSatiri(SERBEST, 'deptAc(-1)',
      '<b>Tüm departmanlarda geçerli</b> <span class="hint">· '+serbestA.length+' alt departman · '+serbestU.length+' unvan</span>',
      serbestU.reduce((a,u)=>a+listeKullanim('unvan',u),0) + serbestA.reduce((a,x)=>a+listeKullanim('altdept',x),0),
        '<button class="btn sm" onclick="altDeptEkleAc(-1)">+ Alt departman</button> '
      + '<button class="btn sm" onclick="unvanEkleAc(-1)">+ Unvan</button>');
    if(deptAcikMi(SERBEST)) h += serbestA.map(altSatiri).join('') + serbestU.map(unvanSatiri).join('');
  }
  if(!depts.length && !serbestU.length && !serbestA.length)
    h += '<tr><td colspan="3" class="hint" style="padding:18px;text-align:center">Henüz departman tanımlı değil</td></tr>';

  return h + '</tbody></table></div></div>';
}

function deptEkleUygula(){
  const el = document.getElementById('yeniDept');
  const v = (el ? el.value : '').trim();
  if(!v){ bildir('Departman adı yazın.'); return; }
  if(listeAl('dept').some(x => x.toLocaleLowerCase('tr') === v.toLocaleLowerCase('tr'))){ bildir('Bu departman zaten listede.'); return; }
  listeEkle('dept', v); kaydet(); bildir('“'+v+'” departmanı eklendi.');
}

/* ix = departman sırası, -1 ise tüm departmanlarda geçerli unvan */
function unvanEkleAc(ix){
  const depts = listeAl('dept');
  const secili = ix >= 0 ? depts[ix] : '';
  modalAc('<div class="mh"><h3>Unvan ekle</h3><button class="x" onclick="modalKapat()">×</button></div>'
  + '<div class="mb"><div class="grid g2">'
  + '<div class="fld"><label class="lb">Unvan adı</label>'
  + '<input type="text" id="ue_ad" onkeydown="if(event.key===\'Enter\')unvanEkleUygula()"></div>'
  + '<div class="fld"><label class="lb">Bağlı departman</label><select id="ue_dept">'
  + '<option value="">Tüm departmanlar</option>'
  + depts.map(x => '<option'+(x===secili?' selected':'')+'>'+esc(x)+'</option>').join('')
  + '</select></div></div>'
  + '<div class="hint mt">Departmana bağlı bir unvan, personel kartında yalnızca o departman seçiliyken listelenir.</div>'
  + '</div><div class="mf"><button class="btn" onclick="modalKapat()">Vazgeç</button>'
  + '<button class="btn pri" onclick="unvanEkleUygula()">Ekle</button></div>');
}
function deptAcikYap(d){ if(!d) return; S.acikDept = S.acikDept || {}; S.acikDept[d] = true; }

function unvanEkleUygula(){
  const ad = (document.getElementById('ue_ad').value || '').trim();
  const dept = document.getElementById('ue_dept').value;
  if(!ad){ bildir('Unvan adı yazın.'); return; }
  if(listeAl('unvan').some(x => x.toLocaleLowerCase('tr') === ad.toLocaleLowerCase('tr'))){ bildir('Bu unvan zaten listede.'); return; }
  listeEkle('unvan', ad);
  S.ayar.unvanDept = S.ayar.unvanDept || {};
  S.ayar.unvanDept[ad] = dept || '';
  deptAcikYap(dept || SERBEST);
  kaydet(); modalKapat();
  bildir('“'+ad+'” eklendi' + (dept ? ' · '+dept : ' · tüm departmanlar') + '.');
}

/* ix = departman sırası, -1 ise tüm departmanlarda geçerli alt departman */
function altDeptEkleAc(ix){
  const depts = listeAl('dept');
  const secili = ix >= 0 ? depts[ix] : '';
  modalAc('<div class="mh"><h3>Alt departman ekle</h3><button class="x" onclick="modalKapat()">×</button></div>'
  + '<div class="mb"><div class="grid g2">'
  + '<div class="fld"><label class="lb">Alt departman adı</label>'
  + '<input type="text" id="ae_ad" onkeydown="if(event.key===\'Enter\')altDeptEkleUygula()"></div>'
  + '<div class="fld"><label class="lb">Bağlı departman</label><select id="ae_dept">'
  + '<option value="">Tüm departmanlar</option>'
  + depts.map(x => '<option'+(x===secili?' selected':'')+'>'+esc(x)+'</option>').join('')
  + '</select></div></div>'
  + '<div class="hint mt">Departmana bağlı bir alt departman, personel kartında yalnızca o departman seçiliyken listelenir.</div>'
  + '</div><div class="mf"><button class="btn" onclick="modalKapat()">Vazgeç</button>'
  + '<button class="btn pri" onclick="altDeptEkleUygula()">Ekle</button></div>');
}
function altDeptEkleUygula(){
  const ad = (document.getElementById('ae_ad').value || '').trim();
  const dept = document.getElementById('ae_dept').value;
  if(!ad){ bildir('Alt departman adı yazın.'); return; }
  if(listeAl('altdept').some(x => x.toLocaleLowerCase('tr') === ad.toLocaleLowerCase('tr'))){ bildir('Bu alt departman zaten listede.'); return; }
  listeEkle('altdept', ad);

  S.ayar.altDeptDept[ad] = dept || '';
  deptAcikYap(dept || SERBEST);
  kaydet(); modalKapat();
  bildir('“'+ad+'” eklendi' + (dept ? ' · '+dept : ' · tüm departmanlar') + '.');
