/* Ayarlardaki tarih alanı geçerli değer girilince kaydeder */
function ilkYilKaydet(v){
  const y = Number(v);
  if(!y || y < 2000 || y > 2100){ bildir('Geçerli bir yıl girin.'); return; }
  S.ayar.ilkYil = y;
  if(S.yil < y) S.yil = y;
  kaydet(); bildir('Sistemin ilk yılı '+y+' olarak ayarlandı.');
}

function sistemBasKaydet(){
  const v = tarihAl('a_sistemBas');
  if(!v || v === S.ayar.sistemBaslangic) return;
  S.ayar.sistemBaslangic = v;
  depoYaz();
  bildir('Sistem başlangıcı ' + trTarih(v) + ' olarak kaydedildi.');
}

function ayarTarihKaydet(){
  const v = tarihAl('a_bakiyeTarihi');
  if(!v || v === S.ayar.varsayilanBakiyeTarihi) return;
  S.ayar.varsayilanBakiyeTarihi = v;
  depoYaz();
  bildir('Varsayılan bakiye tarihi ' + trTarih(v) + ' olarak kaydedildi.');
}

function listeKutusu(baslik, k){
  const l = listeAl(k);
  return '<div><div class="lb">'+baslik+' <span class="hint" style="text-transform:none;letter-spacing:0">('+l.length+')</span></div>'
    + '<div style="max-height:210px;overflow:auto;border:1px solid var(--line);border-radius:8px;margin-top:6px">'
    + (l.length ? l.map(v => '<div class="row" style="gap:8px;padding:6px 10px;border-bottom:1px solid var(--line2)">'
        + '<span style="font-size:12.5px">'+esc(v)+'</span>'
        + (bagliListe(k) ? '<span class="hint" style="font-size:10.5px">'+(bagDepti(k,v)?esc(bagDepti(k,v)):'tüm dept.')+'</span>' : '')
        + '<span class="hint mono" style="margin-left:auto;font-size:11px">'+listeKullanim(k,v)+'</span>'
        + '</div>').join('') : '<div class="hint" style="padding:12px">Liste boş</div>')
    + '</div>'
    + '<button class="btn sm" style="margin-top:7px;width:100%;justify-content:center" onclick="listeYonetAc(\''+k+'\')">Ekle / sil</button>'
    + '</div>';
}

/* Ekleme ve silmenin yapıldığı yönetim tablosu */
function listeYonetAc(k){
  const l = listeAl(k);
  const tekil = LISTE_AD[k].toLocaleLowerCase('tr');
  modalAc('<div class="mh"><h3>'+LISTE_AD[k]+' listesi</h3><button class="x" onclick="modalKapat()">×</button></div>'
  + '<div class="mb">'
  + '<div class="row" style="gap:6px;flex-wrap:nowrap">'
  + '<input type="text" id="ln_'+k+'" placeholder="Yeni '+tekil+' adı" onkeydown="if(event.key===\'Enter\')listeYeni(\''+k+'\')">'
  + (bagliListe(k) ? '<select id="ln_'+k+'Dept" style="width:auto;min-width:170px"><option value="">Tüm departmanlar</option>'
      + listeAl('dept').map(x=>'<option>'+esc(x)+'</option>').join('')+'</select>' : '')
  + '<button class="btn pri" onclick="listeYeni(\''+k+'\')">Ekle</button></div>'
  + '<div class="card mt" style="box-shadow:none"><div class="bd flush"><div class="tw" style="max-height:340px">'
  + '<table><thead><tr><th>'+LISTE_AD[k]+'</th>'
  + (bagliListe(k) ? '<th>Bağlı departman</th>' : '')
  + '<th class="num">Kullanım</th><th></th></tr></thead><tbody>'
  + (l.length ? l.map((v,ix) => '<tr><td style="font-weight:600">'+esc(v)+'</td>'
      + (bagliListe(k) ? '<td><select onchange="listeBagla(\''+k+'\','+ix+',this.value)" style="min-width:170px">'
          + '<option value="">Tüm departmanlar</option>'
          + listeAl('dept').map(x=>'<option'+(x===bagDepti(k,v)?' selected':'')+'>'+esc(x)+'</option>').join('')
          + '</select></td>' : '')
      + '<td class="num">'+listeKullanim(k,v)+'</td>'
      + '<td style="text-align:right;white-space:nowrap">'
      + '<button class="btn sm" onclick="listeAdlandirAc(\''+k+'\','+ix+')">Düzenle</button> '
      + '<button class="btn sm no" onclick="listeSil(\''+k+'\','+ix+')">Sil</button></td></tr>').join('')
      : '<tr><td colspan="'+(bagliListe(k)?4:3)+'" class="hint" style="padding:18px;text-align:center">Liste boş</td></tr>')
  + '</tbody></table></div></div></div>'
  + (bagliListe(k) ? '<div class="hint mt">Bir '+tekil+' değerini departmana bağlarsanız personel kartında yalnızca o departman seçiliyken listelenir. '
      + '“Tüm departmanlar” seçilirse her departmanda kullanılabilir.</div>' : '')
  + '<div class="hint mt">Kullanım sütunu değerin kaç personelde geçtiğini gösterir. '
  + '<b>Düzenle</b> değeri yeniden adlandırır ve ilgili tüm kayıtları birlikte günceller; '
  + 'mevcut bir değerin adını yazarsanız ikisi birleşir. '
  + '<b>Sil</b> ise kullanımdaysa kayıtların hangi değere taşınacağını sorar.</div>'
  + '</div><div class="mf"><button class="btn" onclick="modalKapat()">Kapat</button></div>');
}
function listeYonetAcikMi(k){ return !!document.getElementById('ln_'+k); }

function listeYeni(k){
  const el = document.getElementById('ln_'+k), v = el.value.trim();
  if(!v){ bildir('Bir değer yazın.'); return; }
  if(listeAl(k).some(x => x.toLocaleLowerCase('tr') === v.toLocaleLowerCase('tr'))){ bildir('Bu değer zaten listede.'); return; }
  listeEkle(k, v);
  if(bagliListe(k)){
    const d = document.getElementById('ln_'+k+'Dept');
    bagMap(k)[v] = d ? d.value : '';
  }
  kaydet(); bildir('“'+v+'” listeye eklendi.');
  listeYonetAc(k);
}
const LISTE_AD = {dept:'Departman', lokasyon:'Lokasyon', unvan:'Unvan', altdept:'Alt departman'};

/* Bir değeri (unvan / alt departman) departmana bağlar; boş değer = tüm departmanlar */
function listeBagla(k, ix, dept){
  const u = listeAl(k)[ix];
  if(u === undefined) return;
  const alan = (k === 'altdept') ? 'altDept' : k;
  bagMap(k)[u] = dept || '';
  const uyum = S.personel.filter(p => p[alan] === u && p.dept && dept && p.dept !== dept).length;
  kaydet(); listeYonetAc(k);
  bildir(dept ? '“'+u+'” → '+dept + (uyum ? ' · '+uyum+' kayıt başka departmanda' : '') : '“'+u+'” tüm departmanlarda kullanılabilir.');
}

function listeSil(k, ix){
  const v = listeAl(k)[ix];
  if(v === undefined) return;
  const acik = listeYonetAcikMi(k);
  if(!listeKullanim(k, v)){
    S.ayar.listeler[k] = (S.ayar.listeler[k] || []).filter(x => x !== v);
    if(bagliListe(k)) delete bagMap(k)[v];
    if(k === 'dept'){ unvanBagiTasi(v, ''); altBagiTasi(v, ''); }
    kaydet(); bildir('“'+v+'” listeden çıkarıldı.');
    if(acik) listeYonetAc(k);
    return;
  }
  listeTasiAc(k, v, acik);
}

/* Değeri yeniden adlandırır; ilgili tüm personel kayıtları birlikte güncellenir */
function listeAdlandirAc(k, ix){
  const v = listeAl(k)[ix];
  if(v === undefined) return;
  S.listeDuzen = {k, v, geri: listeYonetAcikMi(k)};
  modalAc('<div class="mh"><h3>'+LISTE_AD[k]+' düzenle</h3><button class="x" onclick="listeDuzenVazgec()">×</button></div>'
  + '<div class="mb">'
  + '<div class="fld"><label class="lb">Mevcut değer</label>'
  + '<div style="font-weight:600;margin-top:2px">'+esc(v)+' <span class="hint">· '+listeKullanim(k,v)+' kayıtta kullanılıyor</span></div></div>'
  + '<div class="fld mt"><label class="lb">Yeni değer</label>'
  + '<input type="text" id="ld_yeni" value="'+esc(v)+'" oninput="listeAdlandirKontrol()" '
  + 'onkeydown="if(event.key===\'Enter\')listeAdlandirUygula()">'
  + '<div id="ld_msj" class="hint" style="margin-top:4px"></div></div>'
  + (bagliListe(k) ? '<div class="fld mt"><label class="lb">Bağlı departman</label>'
      + '<select id="ld_dept">'
      + '<option value="">Tüm departmanlar</option>'
      + listeAl('dept').map(x=>'<option'+(x===bagDepti(k,v)?' selected':'')+'>'+esc(x)+'</option>').join('')
      + '</select></div>' : '')
  + '</div><div class="mf"><button class="btn" onclick="listeDuzenVazgec()">Vazgeç</button>'
  + '<button class="btn pri" onclick="listeAdlandirUygula()">Kaydet</button></div>');
  listeAdlandirKontrol();
}
function listeEsleseni(k, v, yeni){
  return listeAl(k).find(x => x !== v && x.toLocaleLowerCase('tr') === yeni.toLocaleLowerCase('tr'));
}
function listeAdlandirKontrol(){
  const d = S.listeDuzen; if(!d) return;
  const el = document.getElementById('ld_yeni'), msj = document.getElementById('ld_msj');
  if(!el || !msj) return;
  const yeni = el.value.trim(), kul = listeKullanim(d.k, d.v);
  if(!yeni){ msj.textContent = 'Değer boş olamaz.'; msj.style.color = 'var(--red)'; return; }
  if(yeni === d.v){ msj.textContent = 'Değişiklik yapılmadı.'; msj.style.color = ''; return; }
  const es = listeEsleseni(d.k, d.v, yeni);
  if(es){
    msj.textContent = '“'+es+'” listede zaten var. Kaydederseniz '+kul+' kayıt onunla birleştirilir.';
    msj.style.color = 'var(--bekle)';
  } else {
    msj.textContent = kul + ' kayıt yeni değerle güncellenecek.';
    msj.style.color = 'var(--onay)';
  }
}
function listeAdlandirUygula(){
  const d = S.listeDuzen; if(!d) return;
  const yeni = (document.getElementById('ld_yeni').value || '').trim();
  if(!yeni){ bildir('Değer boş olamaz.'); return; }
  const dSec = document.getElementById('ld_dept');
  if(yeni === d.v){
    if(dSec && bagliListe(d.k)){ bagMap(d.k)[d.v] = dSec.value || ''; kaydet(); }
    listeDuzenVazgec(); return;
  }
  const hedef = listeEsleseni(d.k, d.v, yeni) || yeni;
  const alan = listeAlan(d.k);
  let n = 0;
  for(const p of S.personel) if(p[alan] === d.v){ p[alan] = hedef; n++; }
  S.ayar.listeler[d.k] = (S.ayar.listeler[d.k] || []).filter(x => x !== d.v);
  listeEkle(d.k, hedef);

  if(d.k === 'dept'){
    unvanBagiTasi(d.v, hedef);
    altBagiTasi(d.v, hedef);
  }
  if(bagliListe(d.k)){
    const m = bagMap(d.k);
    m[hedef] = dSec ? (dSec.value || '') : (m[d.v] || '');
    if(hedef !== d.v) delete m[d.v];
  }
  // açık/kapalı durumu yeni ada taşınsın
  S.acikDept = S.acikDept || {};
  if(d.k === 'dept' && S.acikDept[d.v]){ S.acikDept[hedef] = true; delete S.acikDept[d.v]; }

  const geri = d.geri, k = d.k;
  S.listeDuzen = null;
  kaydet();
  if(geri) listeYonetAc(k); else modalKapat();
  bildir('“'+d.v+'” → “'+hedef+'” · '+n+' kayıt güncellendi.');
}
function listeDuzenVazgec(){
  const d = S.listeDuzen; S.listeDuzen = null;
  if(d && d.geri) listeYonetAc(d.k); else modalKapat();
}

/* Kullanımdaki bir değeri silmeden önce ilgili kayıtlar başka değere taşınır */
function listeTasiAc(k, v, geri){
  S.listeSilme = {k, v, geri:!!geri};
  const etkilenen = S.personel.filter(p => p[listeAlan(k)] === v);
  const digerleri = listeAl(k).filter(x => x !== v);
  const zorunlu = (k === 'dept');
  const isim = etkilenen.slice(0,8).map(p => esc(p.ad+' '+p.soyad)).join(', ')
             + (etkilenen.length > 8 ? ' ve '+(etkilenen.length-8)+' kişi daha' : '');

  modalAc('<div class="mh"><h3>Listeden sil</h3><button class="x" onclick="modalKapat()">×</button></div><div class="mb">'
  + '<div><b>“'+esc(v)+'”</b> şu an <b>'+etkilenen.length+'</b> kayıtta kullanılıyor. '
  + 'Silmeden önce bu kişilerin '+LISTE_AD[k].toLocaleLowerCase('tr')+' bilgisi ne olacak?</div>'
  + '<div class="card mt" style="box-shadow:none;background:var(--surface2)"><div class="bd">'
  + '<div class="lb">Etkilenen personel</div><div class="hint" style="margin-top:5px">'+isim+'</div></div></div>'
  + '<div class="fld mt"><label class="lb">Yeni değer</label><select id="lt_hedef">'
  + (zorunlu ? '' : '<option value="">— boş bırak —</option>')
  + digerleri.map(x => '<option>'+esc(x)+'</option>').join('')
  + '</select>'
  + (zorunlu && !digerleri.length ? '<div class="hint" style="margin-top:5px;color:var(--red)">Taşınacak başka departman yok. Önce yeni bir departman ekleyin.</div>' : '')
  + '</div></div>'
  + '<div class="mf"><button class="btn" onclick="listeTasiVazgec()">Vazgeç</button>'
  + '<button class="btn no" onclick="listeTasiUygula()">Taşı ve sil</button></div>');
}

function listeTasiVazgec(){
  const d = S.listeSilme; S.listeSilme = null;
  if(d && d.geri) listeYonetAc(d.k); else modalKapat();
}
function listeTasiUygula(){
  const {k, v, geri} = S.listeSilme || {};
  if(!k) return;
  const hedef = document.getElementById('lt_hedef').value;
  if(k === 'dept' && !hedef){ bildir('Departman boş bırakılamaz, bir hedef seçin.'); return; }
  const alan = listeAlan(k);
  let n = 0;
  for(const p of S.personel) if(p[alan] === v){ p[alan] = hedef; n++; }
  S.ayar.listeler[k] = (S.ayar.listeler[k] || []).filter(x => x !== v);
  if(k === 'dept'){ unvanBagiTasi(v, hedef); altBagiTasi(v, hedef); }
  if(bagliListe(k)) delete bagMap(k)[v];
  S.listeSilme = null;
  kaydet();
  if(geri) listeYonetAc(k); else modalKapat();
  bildir(n + ' kayıt ' + (hedef ? '“'+hedef+'” değerine taşındı' : 'boşaltıldı') + ', “'+v+'” silindi.');
}

function calismaGunuDegis(g, ac){
  const l = S.ayar.calismaGunleri;
  if(ac){ if(!l.includes(g)) l.push(g); } else S.ayar.calismaGunleri = l.filter(x=>x!==g);
  S.ayar.calismaGunleri.sort();
  kaydet();
}

/* ===================== 13. VERİ AKTARIMI ve BAŞLATMA ===================== */

function sifirla(){
  onayIste('Kayıtlı listeye sıfırla',
    'Tüm izin ve mesai kayıtları silinip personel listesi dosyadaki hâline dönecek.\nBu işlem geri alınamaz.',
    'Sıfırla',
    () => { varsayilanaDon(); kaydet(); bildir('Kayıtlı listeye dönüldü.'); });
}

function kaydet(){ depoYaz(); ciz(); }

/* Eski sürümde kaydedilmiş verideki eksik alanları dosyadaki listeden tamamlar.
   Kullanıcının girdiği değerlere dokunmaz; yalnızca boş olanları doldurur. */
function gocEt(){
  const anahtar = o => ((o.ad||'')+'|'+(o.soyad||'')).toLocaleUpperCase('tr').replace(/\s+/g,' ').trim();
  const kaynak = {};
  for(const o of PERSONEL_VAR) kaynak[anahtar(o)] = o;

  let tamamlanan = 0;
  for(const p of S.personel){
    const k = kaynak[anahtar(p)];
    if(k){
      for(const alan of ['tcno','lokasyon','kidem','ucret','aylikGun','dogum','tel','giris','unvan','dept']){
        const bos = p[alan] === undefined || p[alan] === '' || p[alan] === null ||
                    ((alan === 'ucret' || alan === 'aylikGun') && !p[alan]);
        if(bos && k[alan] !== undefined && k[alan] !== ''){ p[alan] = k[alan]; tamamlanan++; }
      }
    }
    if(p.aylikGun === undefined || !p.aylikGun) p.aylikGun = 30;
    if(p.ucret === undefined) p.ucret = 0;
    /* Eski kayıtlarda ücret her zaman aylıktı */
    if(p.ucretTipi !== 'gunluk') p.ucretTipi = 'aylik';
    if(p.tcno === undefined) p.tcno = '';
    if(p.kidem === undefined) p.kidem = p.giris || '';
    if(p.izinKidem === undefined || p.izinKidem === '') p.izinKidem = p.kidem || p.giris || '';   // izin hak edişinin esası
    if(p.netBrut === undefined) p.netBrut = 'net';
    if(p.lokasyon === undefined) p.lokasyon = '';
    if(p.cikis === undefined) p.cikis = '';
    if(p.altDept === undefined) p.altDept = '';
    if(p.devirTarihi === undefined) p.devirTarihi = '';
    delete p.sicil;
  }
  // yetki modeli sürüm 2: Genel Müdür üst yönetim oldu, tam yetki İK ve Mali İşler'de
  /* Yetki modeli sürüm 3: üst yönetim ayrı bir rol oldu; roller kayıtlı listeden tazelenir */
  /* saatlik izin türü sonradan eklendi; ikinci sırada durur */
  {
    const mevcut = S.ayar.izinTurleri.findIndex(t => t.kod === 'saatlik');
    if(mevcut !== 1){
      const kayit = mevcut < 0
        ? JSON.parse(JSON.stringify(IZIN_TURLERI_VAR.find(t => t.kod === 'saatlik')))
        : S.ayar.izinTurleri.splice(mevcut, 1)[0];
      S.ayar.izinTurleri.splice(1, 0, kayit);
    }
    /* eski kayıtlarda saatli bayrağı eksik olabilir */
    const sa = S.ayar.izinTurleri.find(t => t.kod === 'saatlik');
    if(sa){ sa.saatli = true; sa.yillikDus = true; }
  }
  if(!S.ayar.isBaslangic) S.ayar.isBaslangic = '08:30';
  if(!S.ayar.isBitis) S.ayar.isBitis = '18:00';
  if((S.ayar.yetkiSurum || 0) < 3){
    for(const p of S.personel){
      const k = kaynak[anahtar(p)];
      if(k && k.rol) p.rol = k.rol;
    }
    S.ayar.yetkiSurum = 3;
  }
  return tamamlanan;
}

/* Ayarlardan elle çalıştırılabilir tazeleme */
function listeyiTazele(){
  const n = gocEt();
  kaydet();
  bildir(n ? n+' eksik alan dosyadaki listeden tamamlandı.' : 'Eksik alan bulunamadı, kayıtlar güncel.');
}

async function baslat(){
  const kayitli = await depoOku();
  if(kayitli && kayitli.personel && kayitli.personel.length){
    S.ayar = Object.assign(JSON.parse(JSON.stringify(AYAR_VAR)), kayitli.ayar || {});
    S.personel = kayitli.personel; S.izin = kayitli.izin || []; S.mesai = kayitli.mesai || [];
    S.aktifId = kayitli.aktifId && kayitli.personel.some(p=>p.id===kayitli.aktifId) ? kayitli.aktifId : kayitli.personel[0].id;
  } else varsayilanaDon();

  const eksik = gocEt();
  S.ayar.gunlukSaat = S.ayar.gunlukSaat || 7.5;
  S.ayar.varsayilanBakiyeTarihi = S.ayar.varsayilanBakiyeTarihi || bugun();
  S.ayar.ilkYil = Number(S.ayar.ilkYil) || 2026;
  S.ayar.sistemBaslangic = S.ayar.sistemBaslangic || AYAR_VAR.sistemBaslangic;
  if(S.ayar.arifeYarim === undefined) S.ayar.arifeYarim = false;
  if(S.ayar.eksiSiniri === undefined) S.ayar.eksiSiniri = 0;
  if(S.ayar.eksiKuraliAktif === undefined) S.ayar.eksiKuraliAktif = false;
  S.ayar.unvanDept = S.ayar.unvanDept || {};
  delete S.ayar.altUst; delete S.ayar.altDeptler; delete S.ayar.unvanAlt; delete S.ayar.ikOnayiZorunlu;
  // İK onay adımı kaldırıldı: bekleyen kayıtlar yönetici onayıyla tamamlanmış sayılır
  for(const i of S.izin) if(i.durum === 'ik_bekliyor') i.durum = 'onaylandi';
  for(const m of S.mesai) if(m.durum === 'ik_bekliyor') m.durum = 'onaylandi';
  if(!Array.isArray(S.ayar.gruplar)) S.ayar.gruplar = JSON.parse(JSON.stringify(AYAR_VAR.gruplar || []));
  for(const g of S.ayar.gruplar){ if(!g.kapsam) g.kapsam = 'kisiler'; if(g.kapsamDeger === undefined) g.kapsamDeger = ''; }

  // izin türü listesi sürüm 2: kaldırılan türler yıllık izne, dogum -> babalik olarak eşlenir
  if((S.ayar.turSurum || 0) < 2){
    const ESLE = {dogum:'babalik', mazeret:'yillik', rapor:'yillik', idari:'yillik'};
    for(const i of S.izin) if(ESLE[i.tur]) i.tur = ESLE[i.tur];
    const gecerli = new Set(IZIN_TURLERI_VAR.map(t => t.kod));
    for(const i of S.izin) if(!gecerli.has(i.tur)) i.tur = 'yillik';
    // kullanıcı ayarlarını koru, listeyi yenile
    const eski = {};
    for(const t of (S.ayar.izinTurleri || [])) eski[t.kod] = t;
    S.ayar.izinTurleri = IZIN_TURLERI_VAR.map(t => {
      const e = eski[t.kod];
      return e ? Object.assign({}, t, {yillikDus:e.yillikDus, ucretli:e.ucretli}) : Object.assign({}, t);
    });
    S.ayar.turSurum = 2;
  }

  // mesai türü listesi sürüm 2: fazla sürelerle çalışma kaldırıldı, tek çarpana geçildi
  if((S.ayar.mesaiSurum || 0) < 2){
    for(const m of S.mesai) if(m.tur === 'fazlasure') m.tur = 'fazla';
    const gecerli = new Set(MESAI_TURLERI_VAR.map(t => t.kod));
    for(const m of S.mesai) if(!gecerli.has(m.tur)) m.tur = 'fazla';
    const eski = {};
    for(const t of (S.ayar.mesaiTurleri || [])) eski[t.kod] = t;
    S.ayar.mesaiTurleri = MESAI_TURLERI_VAR.map(t => {
      const e = eski[t.kod];
      return e ? Object.assign({}, t, {carpan:e.carpan}) : Object.assign({}, t);
    });
    S.ayar.mesaiSurum = 2;
  }
  S.ayar.listeler = S.ayar.listeler || {dept:[], lokasyon:[], unvan:[], altdept:[]};
  for(const k of ['dept','lokasyon','unvan']) S.ayar.listeler[k] = S.ayar.listeler[k] || [];

  unvanBaglariniKur();
  S.yil = yilSinirla(new Date().getFullYear());

  S.gorunum = S.gorunum || 'oto';
  $('#viewSel').onchange = e => gorunumSec(e.target.value);
  $('#userSel').onchange = e => { S.aktifId = e.target.value; S.gorunum = 'oto'; S.sayfa = 'izinlerim';
    takvimFiltre.kuruldu = ''; kaydet(); };
  $('#yearSel').onchange = e => { S.yil = Number(e.target.value); ciz(); };
  $('#ov').onclick = e => { if(e.target.id === 'ov') modalKapat(); };
  document.addEventListener('keydown', e => { if(e.key === 'Escape') modalKapat(); });
  document.addEventListener('keydown', formTuslari);
  document.addEventListener('click', () => { try{ if(S.acikSecici) seciciKapat(); if(S.dokumAyAcik){ S.dokumAyAcik=false; izinDokumCiz(); } if(S.mesaiDokumAyAcik){ S.mesaiDokumAyAcik=false; mesaiDokumCiz(); } }catch(e){} });

  ciz();
  if(eksik) bildir(eksik+' eksik alan güncellendi (T.C. no, ücret, lokasyon).');
}

/* Açılışta bir şey ters giderse boş ekran yerine hatayı göster */
function hataGoster(mesaj, ayrinti){
  const el = document.getElementById('page');
  if(!el || el.innerHTML.trim()) return;      // sayfa doluysa dokunma
  el.innerHTML = '<div style="max-width:640px;margin:40px auto;padding:22px;border:1px solid #E8D5D5;'
    + 'border-radius:14px;background:#fff;font-family:system-ui,sans-serif;color:#1B2A2E">'
    + '<div style="font-size:18px;font-weight:700;margin-bottom:8px">Uygulama açılamadı</div>'
    + '<div style="font-size:14px;line-height:1.5;color:#5A6B70">Aşağıdaki bilgiyi iletirseniz düzeltebiliriz.</div>'
    + '<pre style="margin-top:14px;padding:12px;background:#F6F7F7;border-radius:9px;font-size:12.5px;'
    + 'white-space:pre-wrap;word-break:break-word">'+String(mesaj)+(ayrinti ? '\n\n'+String(ayrinti) : '')+'</pre>'
    + '<div style="font-size:12.5px;color:#5A6B70;margin-top:10px">Tarayıcı: '
    + (navigator && navigator.userAgent ? navigator.userAgent : 'bilinmiyor')+'</div></div>';
}
if(typeof window !== 'undefined' && window.addEventListener){
  window.addEventListener('error', e => {
    if(!e.lineno && String(e.message).indexOf('Script error') === 0) return;   // başka kaynaktan
    hataGoster(e.message, e.filename+' satır '+e.lineno);
  });
}
baslat().catch(e => {
  /* açılış başarısızsa varsayılan veriyle yine de çalıştır */
  try{
    varsayilanaDon();
    S.yil = yilSinirla(new Date().getFullYear());
    ciz();
    bildir('Kayıtlı veri okunamadı, varsayılan liste yüklendi.');
  }catch(e2){
    hataGoster(e && e.message, (e && e.stack) || '');
  }
});

/* ===================== ÖZEL KURALLAR (GRUPLAR) ===================== */

function grupForm(id){
  const g = id ? grupBul(id) : null;
  S.grupTaslak = g ? JSON.parse(JSON.stringify(g))
    : {id:'', ad:'', kapsam:'kisiler', tip:'minCalisan', deger:1, gerekce:true, aciklama:'', uyeler:[]};
  // Kural artık her zaman "belirli kişiler" tabanlı; eski dinamik kapsamlı kuralı düzenlerken üyeleri sabitle
  if(g && g.kapsam && g.kapsam !== 'kisiler') S.grupTaslak.uyeler = grupUyeleri(g);
  S.grupTaslak.kapsam = 'kisiler';
  if(!S.grupTaslak.uyeler) S.grupTaslak.uyeler = [];
  S.grupTaslak.q = ''; S.grupTaslak.fDept = []; S.grupTaslak.fAlt = []; S.grupTaslak.fLok = [];
  S.acikSecici = '';
  S.seciciRefresh = grupKapsamTazele;   // modal içindeki başlık seçicileri bu alanı yeniler
  grupFormCiz();
}
function grupKapsamTazele(){
  const el = document.getElementById('g_kapsamAlan'); if(el) el.innerHTML = grupKapsamAlani();
  const oz = document.getElementById('g_ozet'); if(oz) oz.innerHTML = grupOzetHtml();
}

function grupFormCiz(){
  const t = S.grupTaslak;
  const bslk = (n, baslik, aciklama) => '<div class="bslk" style="margin-top:18px">'+n+' · '+baslik
    + (aciklama ? ' <span class="hint" style="text-transform:none;letter-spacing:0;font-weight:400">— '+aciklama+'</span>' : '')
    + '</div>';

  modalAc('<div class="mh"><h3>'+(t.id?'Kuralı düzenle':'Yeni kural')+'</h3>'
  + '<button class="x" onclick="modalKapat()">×</button></div>'
  + '<div class="mb">'

  + '<div class="bslk" style="margin-top:0">1 &middot; Kural</div>'
  + '<div class="grid g2" style="margin-top:8px">'
  + '<div class="fld"><label class="lb">Kural adı</label>'
  + '<input type="text" id="g_ad" value="'+esc(t.ad)+'" oninput="S.grupTaslak.ad=this.value" placeholder="Örn. Muhasebe yedekliliği"></div>'
  + '<div class="fld"><label class="lb">Kural açıklaması</label>'
  + '<input type="text" id="g_ack" value="'+esc(t.aciklama||'')+'" oninput="S.grupTaslak.aciklama=this.value" placeholder="Kuralın amacı / kimler birbirinin yerine bakıyor?"></div>'
  + '</div>'

  + bslk(2, 'Kapsam', 'departman / alt departman / lokasyondan süzüp kişileri ekleyin')
  + '<div id="g_kapsamAlan">'+grupKapsamAlani()+'</div>'

  + bslk(3, 'Kural', 'kapsamdaki kişiler için geçerli')
  + '<div id="g_kuralAlan">'+grupKuralAlani()+'</div>'
  + '<div id="g_ozet" class="mt">'+grupOzetHtml()+'</div>'

  + '</div><div class="mf"><button class="btn" onclick="modalKapat()">Vazgeç</button>'
  + '<button class="btn pri" onclick="grupKaydet()">Kaydet</button></div>', true);
}

/* Kapsam alanı: çoklu filtre (departman/alt departman/lokasyon) + kişi listesi + Tümünü ekle */
function grupDeptOps(){ return [...new Set(S.personel.filter(p=>p.aktif).map(p=>p.dept).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'tr')); }
function grupLokOps(){ return [...new Set(S.personel.filter(p=>p.aktif).map(p=>p.lokasyon).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'tr')); }
function grupAltOps(){ const t=S.grupTaslak; return [...new Set(S.personel.filter(p=>p.aktif && (!t.fDept.length || t.fDept.includes(p.dept))).map(p=>p.altDept).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'tr')); }
function grupFCok(alan, ops, i){
  const t = S.grupTaslak;
  if(i === null){ t[alan] = tumunuSecToggle(t[alan], ops.slice()); }
  else { const v = ops[i]; if(v === undefined) return; const j = t[alan].indexOf(v); if(j < 0) t[alan].push(v); else t[alan].splice(j,1); }
  grupKapsamTazele();
}
function grupFDeptSec(i){ grupFCok('fDept', grupDeptOps(), i); }
function grupFAltSec(i){ grupFCok('fAlt', grupAltOps(), i); }
function grupFLokSec(i){ grupFCok('fLok', grupLokOps(), i); }
/* Filtreye uyan, henüz eklenmemiş kişiler */
function grupFiltreliKisiler(){
  const t = S.grupTaslak;
  const q = (t.q||'').toLocaleLowerCase('tr');
  return S.personel.filter(p => p.aktif
    && !t.uyeler.includes(p.id)
    && (!t.fDept.length || t.fDept.includes(p.dept))
    && (!t.fAlt.length  || t.fAlt.includes(p.altDept||''))
    && (!t.fLok.length  || t.fLok.includes(p.lokasyon||''))
    && (!q || (p.ad+' '+p.soyad+' '+p.unvan).toLocaleLowerCase('tr').includes(q)));
}
function grupTumunuEkle(){
  const t = S.grupTaslak;
  const ekle = grupFiltreliKisiler().map(p=>p.id);
  if(!ekle.length){ bildir('Filtreye uyan, eklenecek kişi yok.'); return; }
  t.uyeler = [...new Set([...t.uyeler, ...ekle])];
  grupKapsamTazele();
}
function grupKapsamAlani(){
  const t = S.grupTaslak;
  const filtreliSay = grupFiltreliKisiler().length;
  return '<div id="g_secili" style="margin-top:8px">'+grupSeciliListesi()+'</div>'
    + '<div class="row" style="gap:6px;margin-top:10px;flex-wrap:wrap;align-items:center">'
    + baslikSecici('gDept','Departman', grupDeptOps(), t.fDept, 'grupFDeptSec')
    + baslikSecici('gAlt','Alt departman', grupAltOps(), t.fAlt, 'grupFAltSec')
    + baslikSecici('gLok','Lokasyon', grupLokOps(), t.fLok, 'grupFLokSec')
    + '<input type="text" style="flex:1;min-width:130px" placeholder="Ad / unvan ara…" value="'+esc(t.q||'')+'" oninput="grupAra(this.value)">'
    + '<button class="btn sm pri" onclick="grupTumunuEkle()">Tümünü ekle'+(filtreliSay?' ('+filtreliSay+')':'')+'</button>'
    + '</div>'
    + '<div id="g_uyeler" style="border:1px solid var(--line);border-radius:8px;margin-top:7px;max-height:280px;overflow:auto">'+grupUyeListesi()+'</div>';
}
/* Kural alt-alanı: kural tipi + değer (kişi sayısı / %) */
function grupKuralAlani(){
  const t = S.grupTaslak, yuzde = t.tip === 'yuzdeCalisan';
  return '<div class="grid g2" style="margin-top:8px">'
    + '<div class="fld"><label class="lb">Kural</label><select id="g_tip" onchange="grupTipDegis(this.value)">'
    + '<option value="minCalisan"'+(t.tip==='minCalisan'?' selected':'')+'>En az … kişi işbaşında kalmalı</option>'
    + '<option value="maxIzinli"'+(t.tip==='maxIzinli'?' selected':'')+'>Aynı anda en çok … kişi izinli olabilir</option>'
    + '<option value="yuzdeCalisan"'+(yuzde?' selected':'')+'>En az %… işbaşında kalmalı</option>'
    + '</select></div>'
    + '<div class="fld"><label class="lb">'+(yuzde?'Yüzde (%)':'Kişi sayısı')+'</label>'
    + '<input type="number" min="0"'+(yuzde?' max="100"':'')+' id="g_deger" value="'+(t.deger)+'" oninput="grupTaslakGuncelle()"></div>'
    + '<div class="fld full"><label class="lb">Kural aşılırsa</label><select id="g_gerekce" onchange="grupTaslakGuncelle()">'
    + '<option value="1"'+(t.gerekce?' selected':'')+'>Gerekçe iste, talebi yöneticiye gönder</option>'
    + '<option value="0"'+(!t.gerekce?' selected':'')+'>Yalnızca uyar</option></select></div>'
    + '</div>';
}
function grupTipDegis(v){
  S.grupTaslak.tip = v;
  const el = document.getElementById('g_kuralAlan'); if(el) el.innerHTML = grupKuralAlani();
  const oz = document.getElementById('g_ozet'); if(oz) oz.innerHTML = grupOzetHtml();
}

function grupOzetHtml(){
  const t = S.grupTaslak, n = grupUyeleri(t).length, s = grupSiniri(t);
  if(!n) return '<div class="hint">'+(t.kapsam==='kisiler' ? 'Kural, kişiler seçildikten sonra anlam kazanır. Aşağıdaki listeden ekleyin.' : 'Kapsam seçilince özet görünür.')+'</div>';
  const sorun = s >= n ? 'Kural etkisiz: bu ayarla kapsamdaki herkes aynı anda izne çıkabilir.'
              : (s <= 0 ? 'Bu ayarla kapsamdan hiç kimse izne çıkamaz.' : '');
  return '<div class="card" style="box-shadow:none;background:var(--surface2)"><div class="bd row" style="gap:22px;padding:12px 14px;flex-wrap:wrap">'
    + '<div><div class="lb" style="font-size:10px">Kapsam</div><div style="font-weight:600;margin-top:4px" class="mono">'+n+' kişi</div></div>'
    + '<div><div class="lb" style="font-size:10px">Aynı anda izinli</div><div style="font-weight:600;margin-top:4px" class="mono">en çok '+s+'</div></div>'
    + '<div><div class="lb" style="font-size:10px">İşbaşında kalan</div><div style="font-weight:600;margin-top:4px" class="mono">en az '+(n-s)+'</div></div>'
    + (sorun?'<div style="margin-left:auto;color:var(--bekle);font-size:12px;max-width:230px">'+sorun+'</div>':'')
    + '</div></div>';
}

/* Gruba seçilmiş kişiler */
function grupSeciliListesi(){
  const t = S.grupTaslak;
  if(!t.uyeler.length)
    return '<div class="hint" style="border:1px dashed var(--line);border-radius:8px;padding:14px;text-align:center">'
      + 'Henüz kimse eklenmedi. Aşağıdaki listeden seçin.</div>';
  return '<div style="border:1px solid var(--line);border-radius:8px;overflow:hidden">'
    + t.uyeler.map(id => {
        const p = per(id);
        if(!p) return '';
        return '<div class="row" style="gap:9px;padding:7px 10px;border-bottom:1px solid var(--line2)">'
          + '<span style="font-size:12.5px;font-weight:600">'+esc(p.ad+' '+p.soyad)+'</span>'
          + '<span class="hint" style="font-size:11px">'+esc(p.unvan)+' · '+esc(p.dept)+'</span>'
          + '<button class="btn sm no" style="margin-left:auto;padding:2px 8px" onclick="grupUye(\''+id+'\',false)">Çıkar</button>'
          + '</div>';
      }).join('')
    + '</div>';
}

/* Eklenebilecek kişiler — aynı kişi birden fazla kurala girebilir; başka kurallar bilgi olarak gösterilir */
function grupUyeListesi(){
  const t = S.grupTaslak;
  const q = (t.q||'').toLocaleLowerCase('tr');
  const baskaKural = {};                         // kişi başka hangi "belirli kişiler" kurallarında (bilgi)
  for(const g of gruplar()){
    if(g.id === t.id || g.kapsam !== 'kisiler') continue;
    for(const u of (g.uyeler || [])) (baskaKural[u] = baskaKural[u] || []).push(g.ad);
  }

  const liste = grupFiltreliKisiler();

  if(!liste.length)
    return '<div class="hint" style="padding:16px;text-align:center">Filtreye uyan, eklenmemiş kişi yok.</div>';

  liste.sort((a,b)=>a.dept.localeCompare(b.dept,'tr')||a.ad.localeCompare(b.ad,'tr'));
  let h = '', sonDept = '';
  for(const p of liste){
    if(p.dept !== sonDept){
      h += '<div class="bslk" style="margin:0;padding:7px 10px;background:var(--surface2);border-bottom:1px solid var(--line2)">'+esc(p.dept)+'</div>';
      sonDept = p.dept;
    }
    h += '<div class="row" style="gap:9px;padding:6px 10px;border-bottom:1px solid var(--line2)">'
      + '<span style="font-size:12.5px">'+esc(p.ad+' '+p.soyad)+'</span>'
      + '<span class="hint" style="font-size:11px">'+esc(p.unvan)+(p.lokasyon?' · '+esc(p.lokasyon):'')
        + (baskaKural[p.id]?' · <span style="color:var(--bekle)">'+esc(baskaKural[p.id].join(', '))+' kuralında</span>':'')+'</span>'
      + '<button class="btn sm" style="margin-left:auto;padding:2px 9px" onclick="grupUye(\''+p.id+'\',true)">Ekle</button>'
      + '</div>';
  }
  return h;
}

function grupUye(pid, ac){
  const t = S.grupTaslak;
  t.uyeler = ac ? [...new Set([...t.uyeler, pid])] : t.uyeler.filter(x => x !== pid);
  grupKapsamTazele();
}
function grupAra(v){
  S.grupTaslak.q = v;
  const el = document.getElementById('g_uyeler');
  if(el) el.innerHTML = grupUyeListesi();
}
function grupTaslakGuncelle(){
  const t = S.grupTaslak;
  const tipEl = document.getElementById('g_tip');   if(tipEl) t.tip = tipEl.value;
  const degEl = document.getElementById('g_deger'); if(degEl) t.deger = Number(degEl.value) || 0;
  const gEl   = document.getElementById('g_gerekce'); if(gEl) t.gerekce = gEl.value === '1';
  const oz = document.getElementById('g_ozet');
  if(oz) oz.innerHTML = grupOzetHtml();
}
function grupKaydet(){
  const t = S.grupTaslak;
  t.ad = (document.getElementById('g_ad').value || '').trim();
  t.aciklama = (document.getElementById('g_ack').value || '').trim();
  grupTaslakGuncelle();
  if(!t.ad){ bildir('Kural adı zorunlu.'); return; }
  if(t.uyeler.length < 2){ bildir('Kurala en az iki kişi ekleyin.'); return; }
  const kayit = {id:t.id || yeniId('g'), ad:t.ad, kapsam:'kisiler', kapsamDeger:'',
                 tip:t.tip, deger:t.deger, gerekce:t.gerekce, aciklama:t.aciklama, uyeler:t.uyeler};
  const mevcut = grupBul(t.id);
  if(mevcut) Object.assign(mevcut, kayit); else gruplar().push(kayit);
  S.grupTaslak = null;
  kaydet(); modalKapat();
  bildir('“'+kayit.ad+'” kaydedildi · '+kayit.uyeler.length+' kişi.');
}
function grupSil(id){
  const g = grupBul(id); if(!g) return;
  onayIste('Kuralı sil', '<b>'+esc(g.ad)+'</b>\nKural silinecek; izin kayıtları etkilenmez.', 'Sil',
    () => { S.ayar.gruplar = gruplar().filter(x => x.id !== id); kaydet(); bildir('Kural silindi.'); });
}


/* --- Ayarlar: mesai girişi anahtarları --- */
function mesaiAyarDegis(pid, acik){
  const p = per(pid); if(!p) return;
  p.mesaiKapali = !acik;
  kaydet();
  bildir(adSoyad(pid)+' · mesai girişi '+(acik ? 'açıldı' : 'kapatıldı')+'.');
}
function mesaiAyarAra(v){
  S.msAyarQ = v; ciz();
  const el = document.getElementById('msAyarAra');
  if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
}
function mesaiAyarDept(v){ S.msAyarDept = v; ciz(); }
function mesaiTopluAyar(acik){
  const liste = S.personel.filter(p => p.aktif
      && (!S.msAyarDept || p.dept === S.msAyarDept)
      && (!S.msAyarQ || (p.ad+' '+p.soyad+' '+p.unvan).toLocaleLowerCase('tr').includes((S.msAyarQ||'').toLocaleLowerCase('tr'))));
  if(!liste.length){ bildir('Listede kişi yok.'); return; }
  onayIste(acik ? 'Mesai girişini aç' : 'Mesai girişini kapat',
    liste.length+' kişi için mesai girişi '+(acik ? 'açılacak' : 'kapatılacak')+'. Sürdürmek istiyor musunuz?',
    acik ? 'Aç' : 'Kapat',
    () => {
      for(const p of liste) p.mesaiKapali = !acik;
      kaydet();
      bildir(liste.length+' kişi güncellendi.');
    });
}


/* Test kayıtlarını temizler; personel, ayarlar ve tatiller kalır */
function kayitlariTemizle(){
  const iz = S.izin.length, ms = S.mesai.length;
  if(!iz && !ms){ bildir('Silinecek kayıt yok.'); return; }
  onayIste('İzin ve mesai kayıtlarını sil',
    iz+' izin ve '+ms+' mesai kaydı kalıcı olarak silinecek. Personel kartları, ayarlar ve resmî tatiller korunur. '
    + 'Bu işlem geri alınamaz.',
    'Kayıtları sil',
    () => {
      S.izin = [];
      S.mesai = [];
      S.takvimSecim = null;
      S.kayitKisi = null;
      kaydet();
      bildir(iz+' izin, '+ms+' mesai kaydı silindi.');
    });
}

</script>
